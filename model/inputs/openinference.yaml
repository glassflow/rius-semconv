# Generated by tools/to_weaver.py from registry/. Edit registry/ and rerun it.

file_format: definition/2
attribute_groups:
- id: rius.openinference
  visibility: public
  stability: development
  brief: OpenInference attributes the Rius SDKs emit.
  attributes:
  - ref: openinference.span.kind
  - ref: input.value
  - ref: output.value
- id: rius.normalizer_input.openinference
  visibility: public
  stability: development
  brief: Attributes OpenInference writes that the Rius normalizers read.
  attributes:
  - ref: llm.invocation_parameters
  - ref: llm.token_count.prompt
  - ref: llm.token_count.completion
  - ref: llm.token_count.prompt_details.cache_read
  - ref: llm.token_count.prompt_details.cache_write
  - ref: llm.token_count.completion_details.reasoning
  - ref: llm.token_count.total
  - ref: llm.token_count.prompt_details.audio
  - ref: llm.token_count.completion_details.audio
  - ref: llm.cost.total
  - ref: metadata.ai.response.avgOutputTokensPerSecond
attributes:
- key: openinference.span.kind
  type:
    members:
    - id: agent
      value: AGENT
      brief: an agent invocation or run
      stability: development
    - id: llm
      value: LLM
      brief: a model call (generations use this)
      stability: development
    - id: tool
      value: TOOL
      brief: a tool execution
      stability: development
    - id: retriever
      value: RETRIEVER
      brief: a retrieval / search step
      stability: development
    - id: embedding
      value: EMBEDDING
      brief: an embedding computation
      stability: development
    - id: reranker
      value: RERANKER
      brief: a reranking step, e.g. reordering retrieved documents by relevance
      stability: development
    - id: chain
      value: CHAIN
      brief: a generic processing step (the default)
      stability: development
  brief: The OpenInference span kind, which is the Rius span taxonomy.
  stability: development
  examples:
  - LLM
  - AGENT
  annotations:
    rius:
      const: OPENINFERENCE_SPAN_KIND
      section: |
        --- Attribute keys ---
        OpenInference
      go: OpenInferenceSpanKind
      key: openinference.span.kind
      values_from: span_kind
      symbol: attribute
      origin: openinference
      kinds: all
      category: identity
      level: required
      type: string
      fill:
      - native
      - openinference
      - vercel
- key: input.value
  type: string
  brief: The input of an agent, tool, retriever or chain step, as text or JSON.
  stability: development
  examples:
  - '{"args":["Weather in Paris?"],"kwargs":{}}'
  - What is the weather in Paris?
  annotations:
    rius:
      const: INPUT_VALUE
      key: input.value
      symbol: attribute
      origin: openinference
      kinds:
      - AGENT
      - TOOL
      - RETRIEVER
      - CHAIN
      category: content
      level: vendor
      type: string
      fill:
      - native
      - openinference
      - vercel
- key: output.value
  type: string
  brief: The output of an agent, tool, retriever or chain step, as text or JSON.
  stability: development
  examples:
  - sunny, 22C
  - '{"temperature_c":22}'
  annotations:
    rius:
      const: OUTPUT_VALUE
      key: output.value
      symbol: attribute
      origin: openinference
      kinds:
      - AGENT
      - TOOL
      - RETRIEVER
      - CHAIN
      category: content
      level: vendor
      type: string
      fill:
      - native
      - openinference
      - vercel
- key: llm.invocation_parameters
  type: any
  brief: The request parameters an OpenInference instrumentor recorded, as one JSON object.
  note: |
    The request-parameters bag OpenInference instrumentors emit.
  stability: development
  examples:
  - '{"model": "gpt-4o-mini", "max_tokens": 64, "temperature": 0.2}'
  annotations:
    rius:
      const: LLM_INVOCATION_PARAMETERS
      key: llm.invocation_parameters
      symbol: attribute
      origin: openinference
      direction: read
      kinds:
      - LLM
      category: content
      type: json
      fill:
      - openinference
      rationale: |
        The request-parameters bag OpenInference instrumentors emit.
      wire_type: json
- key: llm.token_count.prompt
  type: int
  brief: Usage count written by OpenInference; the python, typescript and sink normalizers map it to gen_ai.usage.input_tokens.
  note: |
    Copied, never summed with the cache counts: every bundled instrumentor
    already reports it inclusive of them.
  stability: development
  annotations:
    rius:
      producer: openinference
      direction: read
      normalizer_input:
        decision: mapped
        target: gen_ai.usage.input_tokens
        mapped_by:
        - python
        - typescript
        - sink
        go: LLMTokenCountPrompt
- key: llm.token_count.completion
  type: int
  brief: Usage count written by OpenInference; the python, typescript and sink normalizers map it to gen_ai.usage.output_tokens.
  stability: development
  annotations:
    rius:
      producer: openinference
      direction: read
      normalizer_input:
        decision: mapped
        target: gen_ai.usage.output_tokens
        mapped_by:
        - python
        - typescript
        - sink
        go: LLMTokenCountCompletion
- key: llm.token_count.prompt_details.cache_read
  type: int
  brief: Usage count written by OpenInference; the python, typescript and sink normalizers map it to gen_ai.usage.cache_read.input_tokens.
  stability: development
  annotations:
    rius:
      producer: openinference
      direction: read
      normalizer_input:
        decision: mapped
        target: gen_ai.usage.cache_read.input_tokens
        mapped_by:
        - python
        - typescript
        - sink
        go: LLMTokenCountPromptCacheRead
- key: llm.token_count.prompt_details.cache_write
  type: int
  brief: Usage count written by OpenInference; the python, typescript and sink normalizers map it to gen_ai.usage.cache_write.input_tokens.
  stability: development
  annotations:
    rius:
      producer: openinference
      direction: read
      normalizer_input:
        decision: mapped
        target: gen_ai.usage.cache_write.input_tokens
        mapped_by:
        - python
        - typescript
        - sink
        go: LLMTokenCountPromptCacheWrite
- key: llm.token_count.completion_details.reasoning
  type: int
  brief: Usage count written by OpenInference; the python, typescript and sink normalizers map it to gen_ai.usage.reasoning.output_tokens.
  stability: development
  annotations:
    rius:
      producer: openinference
      direction: read
      normalizer_input:
        decision: mapped
        target: gen_ai.usage.reasoning.output_tokens
        mapped_by:
        - python
        - typescript
        - sink
        go: LLMTokenCountCompletionReasoning
- key: llm.token_count.total
  type: int
  brief: 'Usage figure written by OpenInference, left on the span: nothing reads it as usage.'
  note: |
    The conventions define no total: they record input and output and leave
    the sum to the reader. The sink reads it for validation only.
  stability: development
  annotations:
    rius:
      producer: openinference
      direction: read
      normalizer_input:
        decision: ignored
        go: LLMTokenCountTotal
- key: llm.token_count.prompt_details.audio
  type: int
  brief: Usage count written by OpenInference; the python, typescript and sink normalizers map it to gen_ai.usage.audio.input_tokens.
  note: A subset of the input count, never added to it.
  stability: development
  annotations:
    rius:
      producer: openinference
      direction: read
      normalizer_input:
        decision: mapped
        target: gen_ai.usage.audio.input_tokens
        mapped_by:
        - python
        - typescript
        - sink
- key: llm.token_count.completion_details.audio
  type: int
  brief: Usage count written by OpenInference; the python, typescript and sink normalizers map it to gen_ai.usage.audio.output_tokens.
  note: A subset of the output count, never added to it.
  stability: development
  annotations:
    rius:
      producer: openinference
      direction: read
      normalizer_input:
        decision: mapped
        target: gen_ai.usage.audio.output_tokens
        mapped_by:
        - python
        - typescript
        - sink
- key: llm.cost.total
  type: double
  brief: 'Usage figure written by OpenInference, left on the span: nothing reads it as usage.'
  note: |
    Cost stays off the wire on purpose: the backend prices from the token
    counts with its own table, so a producer's figure is never trusted.
  stability: development
  annotations:
    rius:
      producer: openinference
      direction: read
      normalizer_input:
        decision: ignored
- key: metadata.ai.response.avgOutputTokensPerSecond
  type: double
  brief: Key written by OpenInference that names tokens or cost but is not a usage count.
  note: |
    @arizeai/openinference-vercel's metadata.* mirror of
    ai.response.avgOutputTokensPerSecond. No recording carries it: the
    TypeScript SDK no longer runs that transform. An app can still run the
    package's span processor itself on a provider the SDK bridges onto, and
    its spans then carry the mirror, so the entry stays.
  stability: development
  annotations:
    rius:
      producer: openinference
      direction: read
      normalizer_input:
        decision: not_usage
