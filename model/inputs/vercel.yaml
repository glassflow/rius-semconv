attributes:
- key: ai.usage.inputTokens
  type: int
  brief: Usage count written by the Vercel AI SDK; the typescript and sink normalizers map it to gen_ai.usage.input_tokens.
  note: Inclusive of the cached tokens, as the canonical key is.
  stability: development
  annotations:
    rius:
      producer: vercel
      direction: read
      normalizer_input:
        decision: mapped
        target: gen_ai.usage.input_tokens
        mapped_by:
        - typescript
        - sink
- key: ai.usage.promptTokens
  type: int
  brief: 'Usage figure written by the Vercel AI SDK, left on the span: nothing reads it as usage.'
  note: |
    v5's input count on generateText and generateObject, left unread on
    purpose. On a model call the AI SDK writes the same value to
    gen_ai.usage.input_tokens itself. On the generateText wrapper v5 takes
    it from the LAST step's response, not the run's total (v5's streams and
    v6 report the total under ai.usage.inputTokens), so mapping it to
    rius.aggregated_usage.* would put a short total under a key that
    promises the whole run.
  stability: development
  annotations:
    rius:
      producer: vercel
      direction: read
      normalizer_input:
        decision: ignored
