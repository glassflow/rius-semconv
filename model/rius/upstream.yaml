# Generated by tools/to_weaver.py from registry/. Edit registry/ and rerun it.

file_format: definition/2
attribute_groups:
- id: rius.upstream
  visibility: public
  stability: development
  brief: OpenTelemetry attributes the Rius SDKs emit or read.
  attributes:
  - ref: service.name
    requirement_level: required
    annotations:
      rius:
        const: SERVICE_NAME
        section: '--- Resource attribute keys ---'
        symbol: attribute
        origin: otel
        kinds: resource
        level: required
        type: string
        fill:
        - native
        shipped_in:
        - go
        divergence: |
          Both SDKs set service.name through the OpenTelemetry SDK's own resource
          handling and name no constant for it; the sink reads it by this constant.
        rationale: |
          OTel standard logical service name. The backend falls back to it when a
          process names no agent.
  - ref: service.instance.id
    requirement_level: required
    annotations:
      rius:
        const: SERVICE_INSTANCE_ID
        symbol: attribute
        origin: otel
        kinds: resource
        level: required
        type: string
        fill:
        - native
        rationale: |
          OTel standard identity of one process lifetime (one uuid per client, minted
          at init). The heartbeat payload's instance_id carries the SAME value, which
          is what lets the backend join heartbeats to traces and count replicas.
  - ref: service.version
    requirement_level: recommended
    annotations:
      rius:
        const: SERVICE_VERSION
        symbol: attribute
        origin: otel
        kinds: resource
        level: recommended
        type: string
        fill:
        - native
        ts_alias:
          name: ATTR_SERVICE_VERSION
          from: '@opentelemetry/semantic-conventions'
        rationale: |
          OTel standard version of the deployed service. Metadata about the process,
          not about any one span. Stamped only when a version is actually known: there
          is deliberately no placeholder default, because a fake one merges every
          deployment into a single bucket — the same mistake `unknown_service` makes
          for service.name.
  - ref: telemetry.distro.name
    requirement_level: required
    annotations:
      rius:
        const: TELEMETRY_DISTRO_NAME
        symbol: attribute
        origin: otel
        kinds: resource
        level: required
        type: string
        fill:
        - native
        status: planned
        rationale: |
          Names the distribution that exported the span. Both SDKs set it today as
          an inline literal with no semconv constant, which is why the row is
          planned rather than shipped.
  - ref: telemetry.distro.version
    requirement_level: required
    annotations:
      rius:
        const: TELEMETRY_DISTRO_VERSION
        symbol: attribute
        origin: otel
        kinds: resource
        level: required
        type: string
        fill:
        - native
        status: planned
        rationale: |
          The SDK version that exported the span. Inline literal in both SDKs today,
          like telemetry.distro.name.
  - ref: gen_ai.agent.name
    requirement_level:
      conditionally_required: when the agent is known
    annotations:
      rius:
        const: GEN_AI_AGENT_NAME
        symbol: attribute
        origin: otel
        kinds:
        - AGENT
        - TOOL
        category: identity
        level: conditionally_required
        level_note: when the agent is known
        type: string
        fill:
        - native
        placements:
        - scope: resource
          level: recommended
          brief: the agent this PROCESS is
        - scope: span
          when:
            operation: invoke_agent
          kinds:
          - AGENT
          level: conditionally_required
          brief: the agent BEING INVOKED
        - scope: span
          when:
            operation: execute_tool
          kinds:
          - TOOL
          level: conditionally_required
          brief: the agent EXECUTING the tool
        rationale: |
          The agent this process IS, stamped once on the resource so every span it
          emits groups under the same name its heartbeats do. Without it the backend
          falls through to service.name per span, and a process whose agent name
          differs from its service name has its agents view and its trace list
          disagreeing about what it is called.
  - ref: gen_ai.agent.id
    requirement_level:
      conditionally_required: when the invoked agent is a hosted resource with an id
    annotations:
      rius:
        const: GEN_AI_AGENT_ID
        symbol: attribute
        origin: otel
        kinds:
        - AGENT
        category: identity
        level: conditionally_required
        level_note: when the invoked agent is a hosted resource with an id
        type: string
        fill:
        - native
        rationale: |
          The identifier of a HOSTED agent resource, not of an agent in general: the
          conventions give an AWS Bedrock agent ARN and a GCP Agent Registry id as the
          examples, and say it is NOT RECOMMENDED to record in-memory agent instance
          ids here, because those are transient. So an in-process agent leaves it
          unset and there is no configured default to fall back to — a name is the
          only identity such an agent has. Adopted rather than deferred because the
          callers who do run hosted agents have nowhere else to put the id.
  - ref: gen_ai.agent.version
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_AGENT_VERSION
        symbol: attribute
        origin: otel
        kinds:
        - AGENT
        category: identity
        level: recommended
        type: string
        fill:
        - native
        rationale: |
          The version of the agent an AGENT span INVOKED — the same callee
          gen_ai.agent.name and gen_ai.agent.id describe on that span, never
          the process's own version and never service.version. Registry type is a
          plain string and the conventions' own examples are "1.0.0" and "2025-05-01",
          so the caller's value is taken verbatim: there is no format to validate.
  - ref: gen_ai.main_agent.name
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_MAIN_AGENT_NAME
        section: |
          --- The MAIN agent: the agent this PROCESS is ---
          gen_ai.agent.name has no resource-level meaning in the conventions, and ON A
          SPAN it means the agent being INVOKED: one key answering two different
          questions, told apart only by which of a resource and a span you happen to be
          reading. The GenAI conventions' gen_ai.main_agent entity answers the
          process-level question: "the process emitting this telemetry IS this agent",
          once per OTLP batch. rius.main_agent.{name,id,description} answered it
          before the conventions did, and are deprecated in favour of these keys;
          the SDKs stamp both families through the deprecation window.

          gen_ai.agent.name stays on the resource alongside them, deliberately: a swap
          would be a flag day, breaking agent identity for every deployment running an
          SDK newer than the sink. Resource attributes ride once per batch, not per
          span, so carrying all of them costs essentially nothing.
        symbol: attribute
        origin: otel
        kinds: resource
        level: recommended
        type: string
        fill:
        - native
        rationale: |
          The name of the agent this process is, from the same setting as
          gen_ai.agent.name on the resource, and suppressed the same way: a process
          whose name is the unknown_service placeholder stamps none. The conventions
          make gen_ai.main_agent.id the entity's identity and say the entity is not
          emitted without one; the SDKs stamp the name whether or not an id is
          configured, as they did rius.main_agent.name, because in Rius the agent's
          name is its identity and most processes have no hosted id. Replaces
          rius.main_agent.name.
  - ref: gen_ai.main_agent.id
    requirement_level:
      conditionally_required: when the process is configured with a stable agent id
    annotations:
      rius:
        const: GEN_AI_MAIN_AGENT_ID
        symbol: attribute
        origin: otel
        kinds: resource
        level: conditionally_required
        level_note: when the process is configured with a stable agent id
        type: string
        fill:
        - native
        rationale: |
          The stable identifier of the agent this process is. The conventions say it
          MUST NOT be generated from an in-memory or process-local id: a value that
          changes every restart mints a new "agent" every restart. So it is stamped
          only when the caller configures one, and there is no default. Replaces
          rius.main_agent.id.
  - ref: gen_ai.main_agent.description
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_MAIN_AGENT_DESCRIPTION
        symbol: attribute
        origin: otel
        kinds: resource
        level: recommended
        type: string
        fill:
        - native
        rationale: |
          What the agent this process is does, in free text. Stamped only when
          configured. Replaces rius.main_agent.description.
  - ref: session.id
    annotations:
      rius:
        const: SESSION_ID
        upstream: core
        symbol: attribute
        origin: openinference
        kinds: all
        category: identity
        level: vendor
        type: string
        fill:
        - native
        rationale: |
          The session grouping key. OpenInference's spelling, and the one the sink
          reads first; gen_ai.conversation.id is deliberately not emitted alongside
          it, one name for one fact.
  - ref: user.id
    annotations:
      rius:
        const: USER_ID
        upstream: core
        symbol: attribute
        origin: openinference
        kinds: all
        category: identity
        level: vendor
        type: string
        fill:
        - native
        rationale: |
          The end-user identity. OpenInference's spelling, also what Langfuse reads
          and what the OTel registry lists; the sink additionally accepts OTel's
          enduser.id / enduser.pseudo.id from third-party instrumentors, but the SDKs
          emit one name for one fact.
  - ref: gen_ai.operation.name
    requirement_level: required
    annotations:
      rius:
        const: GEN_AI_OPERATION_NAME
        section: OTel GenAI (subset we emit)
        symbol: attribute
        origin: otel
        kinds:
          all_but:
          - CHAIN
        category: identity
        level: required
        type: string
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.provider.name
    requirement_level:
      conditionally_required: when known
    annotations:
      rius:
        const: GEN_AI_PROVIDER_NAME
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        - EMBEDDING
        category: identity
        level: conditionally_required
        level_note: when known
        type: string
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.request.model
    requirement_level:
      conditionally_required: when known
    annotations:
      rius:
        const: GEN_AI_REQUEST_MODEL
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        - EMBEDDING
        category: identity
        level: conditionally_required
        level_note: when known
        type: string
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.request.reasoning.level
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_REASONING_LEVEL
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: recommended
        type: string
        fill:
        - native
  - ref: gen_ai.response.model
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_RESPONSE_MODEL
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        - EMBEDDING
        category: metadata
        level: recommended
        type: string
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.response.id
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_RESPONSE_ID
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: metadata
        level: recommended
        type: string
        fill:
        - native
        rationale: |
          The provider's own identifier for the completion ("chatcmpl-123"),
          Recommended on an inference span. Metadata: it exists only once the provider
          has answered, so it is a post-call setter and never reaches a pending
          snapshot. Not content — an opaque id says nothing about what was said — so
          it survives capture_content=False.
  - ref: gen_ai.output.type
    requirement_level:
      conditionally_required: when the request specifies an output format
    annotations:
      rius:
        const: GEN_AI_OUTPUT_TYPE
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: conditionally_required
        level_note: when the request specifies an output format
        type: string
        fill:
        - native
        rationale: |
          The output modality the client ASKED for (text / json / image / speech in
          the registry today), Conditionally Required when the request specifies one.
          Identity: it describes the request, so it is known at span creation and must
          ride pending snapshots. Note the key is NOT under gen_ai.request., so
          PENDING_IDENTITY_PREFIXES does not cover it and it needs its own allowlist
          entry. Recorded verbatim rather than validated against the enum: the
          conventions are free to extend it, and a value we do not recognise is still
          the caller's truth. Not content, for the reason the response id is not.
  - ref: gen_ai.request.stream
    requirement_level:
      conditionally_required: when streaming
    annotations:
      rius:
        const: GEN_AI_REQUEST_STREAM
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: conditionally_required
        level_note: when streaming
        type: boolean
        fill:
        - native
        - openinference
        rationale: |
          Streaming, per the GenAI inference-span conventions: gen_ai.request.stream
          (boolean, Conditionally Required when streaming) and
          gen_ai.response.time_to_first_chunk (double, seconds, "measured from request
          issuance", Recommended for streaming requests). Both are set by
          record_first_token: a first chunk arriving is what proves the request
          streamed, and the SDK has no earlier hook for it.
  - ref: gen_ai.response.time_to_first_chunk
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_RESPONSE_TIME_TO_FIRST_CHUNK
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: metadata
        level: recommended
        level_note: when streaming
        type: double
        fill:
        - native
        - openinference
  - ref: gen_ai.request.temperature
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_TEMPERATURE
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: recommended
        type: double
        fill:
        - native
        - openinference
        rationale: |
          Sampling parameters. Produced from a generation's model parameters through
          GEN_AI_REQUEST_PARAMETERS, and by normalization, which promotes them out of
          a third-party instrumentor's request bag (llm.invocation_parameters). Names
          and types are the GenAI registry's.
  - ref: gen_ai.request.top_p
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_TOP_P
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: recommended
        type: double
        fill:
        - native
        - openinference
  - ref: gen_ai.request.top_k
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_TOP_K
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: recommended
        type: int
        fill:
        - native
        - openinference
  - ref: gen_ai.request.max_tokens
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_MAX_TOKENS
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: recommended
        type: int
        fill:
        - native
        - openinference
  - ref: gen_ai.request.frequency_penalty
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_FREQUENCY_PENALTY
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: recommended
        type: double
        fill:
        - native
        - openinference
  - ref: gen_ai.request.presence_penalty
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_PRESENCE_PENALTY
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: recommended
        type: double
        fill:
        - native
        - openinference
  - ref: gen_ai.request.seed
    requirement_level:
      conditionally_required: when the request includes a seed
    annotations:
      rius:
        const: GEN_AI_REQUEST_SEED
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: conditionally_required
        level_note: when the request includes a seed
        type: int
        fill:
        - native
        - openinference
  - ref: gen_ai.request.stop_sequences
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_STOP_SEQUENCES
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: recommended
        type: string[]
        fill:
        - native
        - openinference
  - ref: gen_ai.request.choice.count
    requirement_level:
      conditionally_required: when available and not 1
    annotations:
      rius:
        const: GEN_AI_REQUEST_CHOICE_COUNT
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: conditionally_required
        level_note: when available and not 1
        type: int
        fill:
        - native
        - openinference
        rationale: |
          "The target number of candidate completions to return" — OpenAI's `n`.
  - ref: gen_ai.request.encoding_formats
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_ENCODING_FORMATS
        symbol: attribute
        origin: otel
        kinds:
        - EMBEDDING
        category: identity
        level: recommended
        type: string[]
        fill:
        - native
        - openinference
        rationale: |
          Reached only through model parameters (and so through the request
          parameter table), named because the normalizer's per-key type guard is
          keyed by it.
  - ref: gen_ai.request.previous_response.id
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_PREVIOUS_RESPONSE_ID
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: recommended
        type: string
        fill:
        - native
        - openinference
  - ref: gen_ai.request.stream_cursor
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_REQUEST_STREAM_CURSOR
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: identity
        level: recommended
        type: string
        fill:
        - native
        - openinference
  - ref: gen_ai.usage.input_tokens
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_USAGE_INPUT_TOKENS
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: metadata
        level: recommended
        type: int
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.usage.output_tokens
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_USAGE_OUTPUT_TOKENS
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: metadata
        level: recommended
        type: int
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.usage.cache_read.input_tokens
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_USAGE_CACHE_READ_INPUT_TOKENS
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: metadata
        level: recommended
        level_note: when applicable
        type: int
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.usage.cache_write.input_tokens
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_USAGE_CACHE_WRITE_INPUT_TOKENS
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: metadata
        level: recommended
        level_note: when applicable
        type: int
        fill:
        - native
        - openinference
        rationale: |
          semconv-genai renamed cache_creation -> cache_write (PR #440) before our
          cache fields first shipped; no released SDK version carries the old name.
  - ref: gen_ai.usage.reasoning.output_tokens
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_USAGE_REASONING_OUTPUT_TOKENS
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: metadata
        level: recommended
        level_note: when applicable
        type: int
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.input.messages
    requirement_level: opt_in
    annotations:
      rius:
        const: GEN_AI_INPUT_MESSAGES
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: content
        level: opt_in
        level_note: on by default
        type: json
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.output.messages
    requirement_level: opt_in
    annotations:
      rius:
        const: GEN_AI_OUTPUT_MESSAGES
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: content
        level: opt_in
        level_note: on by default
        type: json
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.system_instructions
    requirement_level: opt_in
    annotations:
      rius:
        const: GEN_AI_SYSTEM_INSTRUCTIONS
        symbol: attribute
        origin: otel
        kinds:
        - AGENT
        - LLM
        category: content
        level: opt_in
        type: json
        fill:
        - vercel
        status: planned
        rationale: |
          The system prompt, apart from the input messages. The TypeScript SDK
          writes it when it normalizes a Vercel AI SDK span, as an inline literal
          with no semconv constant, which is why the row is planned rather than
          shipped. Content, listed in CONTENT_ATTRIBUTES by key.
  - ref: gen_ai.response.finish_reasons
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_RESPONSE_FINISH_REASONS
        go: GenAIResponseFinishReason
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: metadata
        level: recommended
        type: string[]
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.tool.name
    requirement_level: required
    annotations:
      rius:
        const: GEN_AI_TOOL_NAME
        symbol: attribute
        origin: otel
        kinds:
        - TOOL
        category: identity
        level: required
        type: string
        fill:
        - native
        - openinference
        - vercel
  - ref: gen_ai.tool.call.id
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_TOOL_CALL_ID
        symbol: attribute
        origin: otel
        kinds:
        - TOOL
        category: identity
        level: recommended
        level_note: if available
        type: string
        fill:
        - native
        rationale: |
          The identifier of the tool call this execution answers — the id the MODEL
          minted on its tool-call message, which is what joins a tool span back to the
          generation that asked for it. Identity, set at span creation, so it needs an
          allowlist entry. Never derived: only the caller holds the model's
          response. Its sibling gen_ai.tool.call.arguments IS content and is listed in
          CONTENT_ATTRIBUTES; an opaque id is not.
  - ref: gen_ai.tool.type
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_TOOL_TYPE
        symbol: attribute
        origin: otel
        kinds:
        - TOOL
        category: identity
        level: recommended
        level_note: if available
        type: string
        fill:
        - native
        rationale: |
          What KIND of tool ran, the conventions' own examples being "function"
          (client-side), "extension" (agent-side) and "datastore". Identity for the
          same reason the call id is: caller-supplied, known before the tool runs.
          A free string, not an enum, in the registry.
  - ref: gen_ai.tool.definitions
    requirement_level: opt_in
    annotations:
      rius:
        const: GEN_AI_TOOL_DEFINITIONS
        symbol: attribute
        origin: otel
        kinds:
        - LLM
        category: content
        level: opt_in
        type: json
        fill:
        - native
        - openinference
        - vercel
        rationale: |
          The request's tool/function definitions, serialized verbatim (provider
          shapes differ; the backend reads names and sizes from either). Content,
          not identity — listed in CONTENT_ATTRIBUTES.
  - ref: gen_ai.tool.call.arguments
    requirement_level: opt_in
    annotations:
      rius:
        const: GEN_AI_TOOL_CALL_ARGUMENTS
        symbol: attribute
        origin: otel
        kinds:
        - TOOL
        category: content
        level: opt_in
        type: json
        fill:
        - vercel
        status: planned
        rationale: |
          The arguments the model passed to the tool. The TypeScript SDK writes it
          from the Vercel AI SDK's ai.toolCall.args, as an inline literal with no
          semconv constant, which is why the row is planned rather than shipped.
          Content, listed in CONTENT_ATTRIBUTES by key.
  - ref: gen_ai.tool.call.result
    requirement_level: opt_in
    annotations:
      rius:
        const: GEN_AI_TOOL_CALL_RESULT
        symbol: attribute
        origin: otel
        kinds:
        - TOOL
        category: content
        level: opt_in
        type: string
        fill:
        - vercel
        status: planned
        rationale: |
          What the tool returned. Written as gen_ai.tool.call.arguments is, from
          ai.toolCall.result; planned for the same reason. Content, listed in
          CONTENT_ATTRIBUTES by key.
  - ref: gen_ai.data_source.id
    requirement_level:
      conditionally_required: when the retrieval has a single identifiable data source
    annotations:
      rius:
        const: GEN_AI_DATA_SOURCE_ID
        symbol: attribute
        origin: otel
        kinds:
        - RETRIEVER
        category: identity
        level: conditionally_required
        level_note: when the retrieval has a single identifiable data source
        type: string
        fill:
        - native
        rationale: |
          The index, collection or knowledge base a retrieval ran against. Identity,
          set at span creation: it is what a retriever span is named after and the
          only thing that distinguishes two otherwise identical searches.
  - ref: gen_ai.retrieval.top_k
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_RETRIEVAL_TOP_K
        symbol: attribute
        origin: otel
        kinds:
        - RETRIEVER
        category: identity
        level: recommended
        type: int
        fill:
        - native
        rationale: |
          How many documents the retriever was ASKED for, the spec's own framing
          ("also known as k, limit, or max_num_results"). Identity: it is a property
          of the request, known before the search runs, so it rides pending snapshots.
  - ref: gen_ai.retrieval.documents
    requirement_level: recommended
    annotations:
      rius:
        const: GEN_AI_RETRIEVAL_DOCUMENTS
        symbol: attribute
        origin: otel
        kinds:
        - RETRIEVER
        category: metadata
        level: recommended
        type: json
        fill:
        - native
        rationale: |
          What the retriever RETURNED, as the conventions define it: a JSON array of
          objects each with an optional `id` and an optional `score`. Identifiers and
          relevance only, never document text, which is why the spec does not mark it
          sensitive and why it is NOT on the content allowlist. It is metadata: known
          only once the search has run, so it never reaches a pending snapshot, and
          it survives capture_content=False because a document id is not content.
  - ref: mcp.method.name
    requirement_level: required
    annotations:
      rius:
        const: MCP_METHOD_NAME
        symbol: attribute
        origin: otel
        kinds:
        - TOOL
        category: identity
        level: required
        level_note: on a TOOL span that is an MCP client call
        type: string
        fill:
        - native
        rationale: |
          OTel MCP semantic conventions (semantic-conventions-genai, Development
          stability). mcp.method.name is the REQUIRED attribute of an MCP client span
          and the marker everything downstream keys on: a local TOOL span has the same
          kind, name and I/O shape, so this is what tells the two apart.
        values:
          MCP_METHOD_TOOLS_CALL: tools/call
  - ref: mcp.protocol.version
    requirement_level: recommended
    annotations:
      rius:
        const: MCP_PROTOCOL_VERSION
        symbol: attribute
        origin: otel
        kinds:
        - TOOL
        category: identity
        level: recommended
        level_note: on a TOOL span that is an MCP client call
        type: string
        fill:
        - native
        rationale: |
          The version the initialize handshake negotiated — not the one we asked for.
  - ref: error.type
    requirement_level:
      conditionally_required: on error
    annotations:
      rius:
        const: ERROR_TYPE
        symbol: attribute
        origin: otel
        kinds: all
        category: metadata
        level: conditionally_required
        level_note: on error
        type: string
        fill:
        - native
        - openinference
        - vercel
        rationale: |
          OTel general error.type: on an MCP tools/call it is "tool_error" when the
          result carries isError (the tool ran and reported failure), else the
          exception class when the call itself raised.
        values:
          ERROR_TYPE_TOOL_ERROR: tool_error
  - ref: exception.type
    annotations:
      rius:
        const: EXCEPTION_TYPE
        symbol: attribute
        origin: otel
        direction: read
        kinds: all
        category: metadata
        type: string
        fill:
        - openinference
        - vercel
        note: an attribute of the exception EVENT, not of the span
- id: rius.passthrough
  visibility: public
  stability: development
  brief: OpenTelemetry attributes other producers write that Rius stores but no Rius SDK emits.
  attributes:
  - ref: gen_ai.conversation.id
    annotations:
      rius:
        origin: otel
        upstream: genai
        rationale: |
          pydantic-ai writes it. Neither SDK emits or rewrites it: they write
          session.id, one name for one fact. The Rius backend falls back to it for
          session.id (tools/go_reference_only.yaml, GenAIConversationID).
