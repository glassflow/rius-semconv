# Generated by tools/to_weaver.py from registry/. Edit registry/ and rerun it.

file_format: definition/2
attribute_groups:
- id: registry.rius
  visibility: public
  stability: development
  brief: Attributes in the rius namespace, and the Rius keys outside it.
  attributes:
  - ref: rius.main_agent.name
  - ref: rius.main_agent.id
  - ref: rius.main_agent.description
  - ref: rius.main_agent.version
  - ref: rius.workspace
  - ref: mcp.result_type
  - ref: rius.request
  - ref: rius.request.tool_choice
  - ref: rius.aggregated_usage
  - ref: rius.context.sizes
  - ref: rius.span.pending
  - ref: rius.parent.foreign
  - ref: rius.sdk.global_provider
  - ref: glassflow.span.pending
attributes:
- key: rius.main_agent.name
  type: string
  brief: Name of the agent this process is, stamped once on the resource.
  note: |
    Deprecated: moved to gen_ai.main_agent.name.
    Named the agent this process is before the conventions had a key for it.
  stability: development
  examples:
  - weather-agent
  - support-triage
  deprecated:
    reason: uncategorized
    note: |
      Moved to gen_ai.main_agent.name, which the OpenTelemetry GenAI
      conventions now define for the same fact. The SDKs stamp both through
      the deprecation window; readers take gen_ai.main_agent.name first.
  annotations:
    rius:
      const: RIUS_MAIN_AGENT_NAME
      key: rius.main_agent.name
      symbol: attribute
      origin: rius
      kinds: resource
      level: vendor
      type: string
      fill:
      - native
      rationale: |
        Deprecated: moved to gen_ai.main_agent.name.
        Named the agent this process is before the conventions had a key for it.
      replaced_by: gen_ai.main_agent.name
- key: rius.main_agent.id
  type: string
  brief: Stable identifier of the agent this process is, unchanged across restarts and deployments.
  note: |
    Deprecated: moved to gen_ai.main_agent.id.
    Took the same stability constraint the conventions put on gen_ai.agent.id:
    a transient in-memory or process-local id here would mint a new "agent"
    every restart and make the key useless for grouping.
  stability: development
  examples:
  - support-triage-prod
  - 8f14e45f-ceea-467a-9575-4c0d6f6c1b9e
  deprecated:
    reason: uncategorized
    note: |
      Moved to gen_ai.main_agent.id, which the OpenTelemetry GenAI
      conventions now define for the same fact. The SDKs stamp both through
      the deprecation window; readers take gen_ai.main_agent.id first. This
      key only ever carried a configured id, while gen_ai.main_agent.id falls
      back to the agent name when none is configured.
  annotations:
    rius:
      const: RIUS_MAIN_AGENT_ID
      key: rius.main_agent.id
      symbol: attribute
      origin: rius
      kinds: resource
      level: vendor
      type: string
      fill:
      - native
      rationale: |
        Deprecated: moved to gen_ai.main_agent.id.
        Took the same stability constraint the conventions put on gen_ai.agent.id:
        a transient in-memory or process-local id here would mint a new "agent"
        every restart and make the key useless for grouping.
      replaced_by: gen_ai.main_agent.id
- key: rius.main_agent.description
  type: string
  brief: What the agent this process is does, in free text.
  note: |
    Deprecated: moved to gen_ai.main_agent.description.
  stability: development
