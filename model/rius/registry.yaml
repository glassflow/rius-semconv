        they disagree, which is most of them.
- key: rius.workspace
  type: string
  brief: Alias of the workspace a span is exported to when one process sends to several; stripped before the span leaves the process.
  note: |
    Process-local routing marker for multi-workspace export. Stamped at span
    start so pending snapshots route too, and ALWAYS stripped by the routing
    exporter before spans leave the process: the destination's API key is what
    tells the backend which workspace a span belongs to.
  stability: development
  examples:
  - acme
  - customer-eu
  annotations:
    rius:
      const: WORKSPACE_ROUTE
      key: rius.workspace
      symbol: attribute
      origin: rius
      kinds: all
      category: process_local
      level: vendor
      type: string
      fill:
      - native
      rationale: |
        Process-local routing marker for multi-workspace export. Stamped at span
        start so pending snapshots route too, and ALWAYS stripped by the routing
        exporter before spans leave the process: the destination's API key is what
        tells the backend which workspace a span belongs to.
- key: mcp.result_type
  type: string
  brief: Result type of an MCP tools/call round that ended with an interim result instead of a final one.
  note: |
    Deprecated: obsoleted, nothing replaces it; interim rounds stay identifiable by mcp.method.name.
    MCP spec 2026-07-28: a tools/call round can end with an interim
    "input_required" result (MRTR) instead of a final one. Early Rius SDKs
    set it ONLY on interim rounds. NOT an OTel semconv attribute, unlike the
    two above: the key borrows the mcp SDK's own `mcp.*` spelling for its
    result-type field, and no convention defines it. Nothing ever read it.
  stability: development
  examples:
  - input_required
  deprecated:
    reason: obsoleted
    note: |
      Emitted by early Rius SDKs on interim MCP tools/call rounds and never
      read by any backend. No convention defines it, and an interim round
      stays identifiable without it, as a tool span carrying
      mcp.method.name.
  annotations:
    rius:
      const: MCP_RESULT_TYPE
      key: mcp.result_type
      symbol: attribute
      origin: rius
      namespace_exception: |
        Predates the rule. The key borrows the mcp SDK's own `mcp.*` spelling for
