- key: rius.aggregated_usage
  type: template[int]
  brief: A whole agent run's token usage, moved off gen_ai.usage.* so per-call usage is not counted twice; the suffix is the gen_ai.usage.* suffix.
  note: |
    Where a whole agent run's token usage goes when the same producer also
    reports each model call's usage on that call's own span:
    gen_ai.usage.<suffix> becomes rius.aggregated_usage.<suffix>, on the
    in-process (INTERNAL) invoke_agent span only. Left under gen_ai.usage.*,
    the run's tokens are counted once per call span and once more on the
    agent span by any backend that sums usage across spans.

    Applied only to producers KNOWN to repeat the usage on per-call spans,
    because a span on its own cannot say whether its usage is an aggregate
    or the only record. CLIENT invoke_agent spans keep their usage: a remote
    agent's model calls are not in the trace.

    The same move covers a wrapper span that repeats ONE call's usage: a
    LiteLLM completion span whose child, the openai instrumentor's
    ChatCompletion span, records the call. The child keeps gen_ai.usage.*,
    since it is the call itself. Decided from end order (a child ends
    before its parent), so a LiteLLM span with no such child keeps its usage.

    Our namespace, not pydantic-ai's gen_ai.aggregated_usage.*: the GenAI
    conventions define no aggregate yet (semantic-conventions-genai#19), and
    one could be defined later with different semantics (sub-agents included
    or not). A backend reads both spellings, for display only; totals read
    gen_ai.usage.* alone.
  stability: development
  examples:
  - 115
  - 42
  annotations:
    rius:
      const: RIUS_AGGREGATED_USAGE_PREFIX
      key: rius.aggregated_usage.
      type: int
      symbol: prefix
      origin: rius
      covers: rius.aggregated_usage.<usage key suffix>
      shipped_in:
      - python
      - typescript
      divergence: |
        Each SDK writes it for the producers it instruments: TypeScript for the
        Vercel AI SDK v7 (@ai-sdk/otel), Python for LiteLLM spans whose OpenAI
        child recorded the same call. The sink adds the key when the trace
        view displays the aggregate.
      rationale: |
        Where a whole agent run's token usage goes when the same producer also
        reports each model call's usage on that call's own span:
        gen_ai.usage.<suffix> becomes rius.aggregated_usage.<suffix>, on the
        in-process (INTERNAL) invoke_agent span only. Left under gen_ai.usage.*,
        the run's tokens are counted once per call span and once more on the
        agent span by any backend that sums usage across spans.

        Applied only to producers KNOWN to repeat the usage on per-call spans,
        because a span on its own cannot say whether its usage is an aggregate
        or the only record. CLIENT invoke_agent spans keep their usage: a remote
        agent's model calls are not in the trace.

        The same move covers a wrapper span that repeats ONE call's usage: a
        LiteLLM completion span whose child, the openai instrumentor's
        ChatCompletion span, records the call. The child keeps gen_ai.usage.*,
        since it is the call itself. Decided from end order (a child ends
        before its parent), so a LiteLLM span with no such child keeps its usage.

        Our namespace, not pydantic-ai's gen_ai.aggregated_usage.*: the GenAI
        conventions define no aggregate yet (semantic-conventions-genai#19), and
        one could be defined later with different semantics (sub-agents included
        or not). A backend reads both spellings, for display only; totals read
        gen_ai.usage.* alone.
- key: rius.context.sizes
  type: any
  brief: Byte sizes of each part of a generation's context (tool definitions, input and output messages), as compact JSON.
  note: |
    Per-part byte sizes of a generation's context, as compact JSON with
    readable keys: tool_definitions (name, bytes), input_messages and
    output_messages (literal role, parts typed text / tool_call /
    tool_call_response with bytes and tool name), cache_marker, and a folded
    summary of older input.
    A media part (blob / uri / file) carries its modality (image, video,
    audio or document) and, when known, byte_size, never bytes: the size of
    the media itself, not of any content, which a blob does not carry.
    A Rius vendor attribute, NOT a convention:
    the backend reads it to attribute gen_ai.usage.input_tokens across the
    context, and no convention describes context composition. Deliberately
    absent from CONTENT_ATTRIBUTES (it is sizes, not content, and must survive
    masking and capture_content=False; that is its whole point when the
    messages are truncated or stripped) and from PENDING_IDENTITY_ATTRIBUTES
    (content is unknown at span start, so a pending snapshot never has it).
  stability: development
  examples:
  - '{"version":1,"input_messages":[{"role":"system","parts":[{"type":"text","bytes":19}]},{"role":"user","parts":[{"type":"text","bytes":18}]}],"output_messages":[{"role":"assistant","parts":[{"type":"text","bytes":6}]}]}'
  - '{"version":1,"input_messages":[{"role":"user","parts":[{"type":"text","bytes":14},{"type":"blob","modality":"image","byte_size":48213}]}],"output_messages":[{"role":"assistant","parts":[{"type":"text","bytes":31}]}]}'
  annotations:
    rius:
      const: RIUS_CONTEXT_SIZES
      key: rius.context.sizes
      symbol: attribute
      origin: rius
      kinds:
      - LLM
      category: metadata
      level: vendor
      type: json
      fill:
      - native
      rationale: |
        Per-part byte sizes of a generation's context, as compact JSON with
        readable keys: tool_definitions (name, bytes), input_messages and
        output_messages (literal role, parts typed text / tool_call /
        tool_call_response with bytes and tool name), cache_marker, and a folded
        summary of older input.
        A media part (blob / uri / file) carries its modality (image, video,
        audio or document) and, when known, byte_size, never bytes: the size of
        the media itself, not of any content, which a blob does not carry.
        A Rius vendor attribute, NOT a convention:
        the backend reads it to attribute gen_ai.usage.input_tokens across the
        context, and no convention describes context composition. Deliberately
        absent from CONTENT_ATTRIBUTES (it is sizes, not content, and must survive
        masking and capture_content=False; that is its whole point when the
        messages are truncated or stripped) and from PENDING_IDENTITY_ATTRIBUTES
        (content is unknown at span start, so a pending snapshot never has it).
      wire_type: json
- key: rius.compaction.kind
  type: string
  brief: 'What a compaction did to the context: summarize, clear_tool_results, clear_thinking or truncate.'
  note: |
    How the context was shrunk: summarize (a summary replaces older turns),
    clear_tool_results (old tool results are emptied), clear_thinking (old
    thinking blocks are dropped) or truncate (old turns are cut with nothing
    in their place). A reader needs it because the four lose different
    things, and a drop in context between two calls means something else
    after each.
    Required on a compaction span and a rius.compaction event, which is why
    it is conditionally required rather than required: only those carry it,
    and a CHAIN or LLM span that is no compaction has nothing to say here.
    The span form is keyed by gen_ai.operation.name, not by the span name:
    the registry's conventions already key spans by the operation, and
    taxonomy.yaml maps "compaction" to the CHAIN kind from it, so a reader
    that finds compaction spans by operation needs no name parsing.
    A Rius key under rius.*, never gen_ai.*: no convention defines a
    compaction span or event, and the GenAI registry is free to define one
    later and mean something else.
  stability: development
  examples:
  - summarize
  - clear_tool_results
  annotations:
    rius:
      const: RIUS_COMPACTION_KIND
      section: |
        --- Context compaction ---
        An agent's context can shrink in two ways: the history is dropped without
        a word, or the producer compacts it on purpose. A backend can tell the two
        apart only if the producer says so, and no convention carries more than a
        boolean on the first call after a compaction (gen_ai.conversation.compacted).
        The rius.compaction.* keys say what was compacted, by whom and how much.

        They ride in two placements, because compaction happens in two ways. A
        compaction that is a step of its own (Claude Code, Codex, an on-demand
        provider call) is a CHAIN span whose gen_ai.operation.name is
        "compaction", carrying the keys itself. A compaction that happens inside
        one request (provider-side context editing, Cursor's preCompact) is a
        rius.compaction span event on that LLM span, carrying the same keys.
        The first LLM call after either sets gen_ai.conversation.compacted.
      key: rius.compaction.kind
      symbol: attribute
      origin: rius
      kinds:
      - CHAIN
      - LLM
      category: metadata
      level: conditionally_required
      level_note: on every compaction span and rius.compaction event
      type: string
      fill:
      - native
      - coding_agents
      rationale: |
        How the context was shrunk: summarize (a summary replaces older turns),
        clear_tool_results (old tool results are emptied), clear_thinking (old
        thinking blocks are dropped) or truncate (old turns are cut with nothing
        in their place). A reader needs it because the four lose different
        things, and a drop in context between two calls means something else
        after each.
        Required on a compaction span and a rius.compaction event, which is why
        it is conditionally required rather than required: only those carry it,
        and a CHAIN or LLM span that is no compaction has nothing to say here.
        The span form is keyed by gen_ai.operation.name, not by the span name:
        the registry's conventions already key spans by the operation, and
        taxonomy.yaml maps "compaction" to the CHAIN kind from it, so a reader
        that finds compaction spans by operation needs no name parsing.
        A Rius key under rius.*, never gen_ai.*: no convention defines a
        compaction span or event, and the GenAI registry is free to define one
        later and mean something else.
- key: rius.compaction.executor
  type: string
  brief: 'Who performed the compaction: the client that sent the request, or the provider.'
  note: |
    client when the application or agent did the work (it summarized the
    history itself, or cut it before sending), provider when the model
    provider did it on its side (context editing, a server-side compaction
    call). It tells a reader whose behaviour to look at when context
    shrinks: the agent's own policy, or a provider setting. Required where
    rius.compaction.kind is, for the same reason.
  stability: development
  examples:
  - client
  - provider
  annotations:
    rius:
      const: RIUS_COMPACTION_EXECUTOR
      key: rius.compaction.executor
      symbol: attribute
      origin: rius
      kinds:
      - CHAIN
      - LLM
      category: metadata
      level: conditionally_required
      level_note: on every compaction span and rius.compaction event
      type: string
      fill:
      - native
      - coding_agents
      rationale: |
        client when the application or agent did the work (it summarized the
        history itself, or cut it before sending), provider when the model
        provider did it on its side (context editing, a server-side compaction
        call). It tells a reader whose behaviour to look at when context
        shrinks: the agent's own policy, or a provider setting. Required where
        rius.compaction.kind is, for the same reason.
- key: rius.compaction.trigger
  type: string
  brief: 'What started the compaction: the context filling up (auto) or a request to compact (manual).'
  note: |
    auto when the producer or provider compacted because the context neared
    its limit, manual when a person or the calling code asked for it (a
    /compact command, an explicit call). Absent when the producer cannot
    tell. It separates a compaction that was a cost of the run from one
    somebody chose.
  stability: development
  examples:
  - auto
  - manual
  annotations:
    rius:
      const: RIUS_COMPACTION_TRIGGER
      key: rius.compaction.trigger
      symbol: attribute
      origin: rius
      kinds:
      - CHAIN
      - LLM
      category: metadata
      level: vendor
      type: string
      fill:
      - native
      - coding_agents
      rationale: |
        auto when the producer or provider compacted because the context neared
        its limit, manual when a person or the calling code asked for it (a
        /compact command, an explicit call). Absent when the producer cannot
        tell. It separates a compaction that was a cost of the run from one
        somebody chose.
