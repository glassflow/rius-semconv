      category: metadata
      level: vendor
      type: int
      fill:
      - native
      - coding_agents
      rationale: |
        The limit the context was measured against, so tokens.before reads as how
        full the window was. Shared form of what Cursor's preCompact hook reports
        as cursor.context.context_window_size.
