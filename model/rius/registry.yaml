- key: rius.command.class
  type: string
  brief: What kind of work a shell tool call ran, as one word, never the command itself.
  note: |
    Classified on the user's machine from the command line, which is never
    sent: test, build, lint, package, git, or other. Lets a trace show what a
    running or failed shell call was doing without exporting the command.
    Claude Code's own telemetry has a similar bash_command_class; no
    convention defines the fact.
  stability: development
  examples:
  - test
  annotations:
    rius:
      const: RIUS_COMMAND_CLASS
      section: '--- Coding-agent plugin ---'
      key: rius.command.class
      symbol: attribute
      origin: rius
      kinds:
      - TOOL
      category: identity
      level: vendor
      type: string
      fill:
      - coding_agents
      shipped_in:
      - python
      - go
      divergence: |
        Only the coding-agent plugin (Python) writes it, and only the Rius
        backend (Go) reads it. No TypeScript consumer has a use for it.
      not_pending: |
        The coding-agent plugin keeps its own pending allowlist, and this key is
        on it. PENDING_IDENTITY_ATTRIBUTES lists what the SDKs put on their
        snapshots, and no SDK writes this key.
      rationale: |
        Classified on the user's machine from the command line, which is never
        sent: test, build, lint, package, git, or other. Lets a trace show what a
        running or failed shell call was doing without exporting the command.
        Claude Code's own telemetry has a similar bash_command_class; no
        convention defines the fact.
