- key: rius.compaction.tokens.after
  type: int
  brief: Tokens in the context just after the compaction.
  note: |
    The size of the context the compaction left behind, measured the same
    way as rius.compaction.tokens.before.
  stability: development
  examples:
  - 31000
  annotations:
    rius:
      const: RIUS_COMPACTION_TOKENS_AFTER
      key: rius.compaction.tokens.after
      symbol: attribute
      origin: rius
      kinds:
      - CHAIN
      - LLM
      category: metadata
      level: vendor
      type: int
      fill:
      - native
      - coding_agents
      rationale: |
        The size of the context the compaction left behind, measured the same
        way as rius.compaction.tokens.before.
- key: rius.compaction.tokens.dropped
  type: int
  brief: How many tokens the compaction removed from the context.
  note: |
    What the compaction removed: tokens.before minus tokens.after when both
    are known. Its own key because a provider that clears tool results often
    reports only how much it cleared and never the two sizes, and a reader
    should not have to subtract to answer "how much was lost".
  stability: development
  examples:
  - 137000
  annotations:
    rius:
      const: RIUS_COMPACTION_TOKENS_DROPPED
      key: rius.compaction.tokens.dropped
      symbol: attribute
      origin: rius
      kinds:
      - CHAIN
      - LLM
      category: metadata
      level: vendor
      type: int
      fill:
      - native
      - coding_agents
      rationale: |
        What the compaction removed: tokens.before minus tokens.after when both
        are known. Its own key because a provider that clears tool results often
        reports only how much it cleared and never the two sizes, and a reader
        should not have to subtract to answer "how much was lost".
- key: rius.compaction.context_window
  type: int
  brief: The size of the model's context window, in tokens, when the compaction ran.
  note: |
    The limit the context was measured against, so tokens.before reads as how
    full the window was. Shared form of what Cursor's preCompact hook reports
    as cursor.context.context_window_size.
  stability: development
  examples:
  - 200000
  annotations:
    rius:
      const: RIUS_COMPACTION_CONTEXT_WINDOW
      key: rius.compaction.context_window
      symbol: attribute
      origin: rius
      kinds:
      - CHAIN
