# Brings Renovate's version-bump pull requests up to date: the files derived
# from the pins in versions.env (Weaver checksums, the manifest's schema_urls,
# model/, out/ and docs/registry/) are regenerated with tools/follow_pins.py
# and committed on the pull request's branch, so CI runs green on the result.
#
# It pushes with the RENOVATE_FOLLOWUP_TOKEN secret (Contents: read and write
# on this repository): a push made with GITHUB_TOKEN would not trigger CI on
# the new commit. Without the secret it only reports, and fails when the
# branch needs regenerating. It runs on pull_request, never
# pull_request_target: Renovate's branches live in this repository, so they
# get secrets, and a fork's pull request does not.
name: renovate-followup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to regenerate and push to
        required: true

permissions:
  contents: read

concurrency:
  group: renovate-followup-${{ github.head_ref || inputs.branch }}
  cancel-in-progress: true

env:
  BRANCH: ${{ github.head_ref || inputs.branch }}
  SUBJECT: "chore(deps): regenerate for the new pins"

jobs:
  regenerate:
    # Renovate's own branches only: a fork's branch has the same name but
    # lives elsewhere.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.head_ref, 'renovate/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the default branch
        if: env.BRANCH == 'main'
        run: |
          echo "::error::Run this on a pull request's branch, not main."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.BRANCH }}
          # The token is passed to the push step only, never stored in
          # .git/config while the branch's code runs.
          persist-credentials: false
      - run: git fetch --depth=1 origin main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # gofmt formats the generated Go.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - run: pip install -r requirements-dev.txt

      - name: Regenerate
        run: python tools/follow_pins.py --base origin/main

      - name: Commit and push
        env:
          TOKEN: ${{ secrets.RENOVATE_FOLLOWUP_TOKEN }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Nothing to regenerate."
            exit 0
          fi
          git status --short
          if [[ "$(git log -1 --format=%s)" == "$SUBJECT" ]]; then
            echo "::error::The last commit already regenerated, yet regenerating again changes files. Generation is not deterministic; not pushing again."
            exit 1
          fi
          if [[ -z "$TOKEN" ]]; then
            echo "::error::This branch needs regenerating and the RENOVATE_FOLLOWUP_TOKEN secret is not set, so it cannot be pushed. On the branch, run 'python tools/follow_pins.py' and commit the result (see CONTRIBUTING.md, \"Dependency bumps\")."
            exit 1
          fi
          # renovate.json lists this author in gitIgnoredAuthors, so Renovate
          # keeps updating the branch after this commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -s -m "$SUBJECT"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
