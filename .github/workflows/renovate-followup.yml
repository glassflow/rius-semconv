# Brings Renovate's version-bump pull requests up to date: the files derived
# from the pins in versions.env (Weaver checksums, the manifest's schema_urls,
# model/, out/ and docs/registry/) are regenerated with tools/follow_pins.py
# and committed on the pull request's branch, so CI runs green on the result.
#
# Two jobs, so the push token never shares a runner with the branch's code:
# `regenerate` runs the branch's code with no secrets and uploads the change
# as a patch; `push` runs none of it, checks the patch touches only generated
# paths, and commits and pushes it with a short-lived installation token of a
# GitHub App installed on this repository only (Contents: read and write),
# made from the RENOVATE_FOLLOWUP_APP_CLIENT_ID and RENOVATE_FOLLOWUP_APP_KEY
# secrets. A push made with GITHUB_TOKEN would not trigger CI on the new
# commit. Without the secrets it only reports, and fails when the branch
# needs regenerating.
#
# It runs on pull_request, never pull_request_target: Renovate's branches
# live in this repository, so they get secrets, and a fork's pull request
# does not.
name: renovate-followup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to regenerate and push to
        required: true

permissions:
  contents: read

concurrency:
  group: renovate-followup-${{ github.head_ref || inputs.branch }}
  cancel-in-progress: false

env:
  BRANCH: ${{ github.head_ref || inputs.branch }}
  SUBJECT: "chore(deps): regenerate for the new pins"

jobs:
  regenerate:
    # Renovate's own branches only: a fork's branch has the same name but
    # lives elsewhere.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.head_ref, 'renovate/') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the default branch
        if: env.BRANCH == 'main'
        run: |
          echo "::error::Run this on a pull request's branch, not main."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.branch }}
          # origin/main too: follow_pins.py compares the Weaver pin with it.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # gofmt formats the generated Go.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - run: pip install -r requirements-dev.txt

      - name: Regenerate
        run: python tools/follow_pins.py --base origin/main

      # Empty when nothing changed. head.txt names the commit it applies to.
      - name: Write the patch
        run: |
          mkdir -p "$RUNNER_TEMP/followup"
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/followup/regenerate.patch"
          git rev-parse HEAD > "$RUNNER_TEMP/followup/head.txt"
          git diff --cached --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerate-patch
          path: ${{ runner.temp }}/followup/
          if-no-files-found: error
          retention-days: 7

  push:
    needs: regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regenerate-patch
          path: ${{ runner.temp }}/followup

      - name: Nothing to regenerate?
        id: patch
        run: |
          if [[ -s "$RUNNER_TEMP/followup/regenerate.patch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to regenerate."
          fi

      # Nothing below runs the branch's code: git comes from the image, hooks
      # are off, and the patch is applied as data.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.patch.outputs.changed
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false

      # Secrets cannot appear in `if:`, so this step says whether they are set.
      - name: App secrets set?
        id: app
        if: steps.patch.outputs.changed
        env:
          CLIENT_ID: ${{ secrets.RENOVATE_FOLLOWUP_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RENOVATE_FOLLOWUP_APP_KEY }}
        run: |
          if [[ -n "$CLIENT_ID" && -n "$APP_KEY" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # An installation token for this repository only, with Contents: write.
      # It expires within the hour and is revoked when the job ends.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        if: steps.app.outputs.present == 'true'
        with:
          client-id: ${{ secrets.RENOVATE_FOLLOWUP_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_FOLLOWUP_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: rius-semconv
          permission-contents: write

      - name: Commit and push
        if: steps.patch.outputs.changed
        env:
          TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git() { /usr/bin/git -c core.hooksPath=/dev/null "$@"; }
          if [[ "$(git rev-parse HEAD)" != "$(cat "$RUNNER_TEMP/followup/head.txt")" ]]; then
            echo "::notice::$BRANCH moved since it was regenerated; the run for its new head handles it."
            exit 0
          fi
          if [[ "$(git log -1 --format=%s)" == "$SUBJECT" ]]; then
            echo "::error::The last commit already regenerated, yet regenerating again changes files. Generation is not deterministic; not pushing again."
            exit 1
          fi
          git apply --index "$RUNNER_TEMP/followup/regenerate.patch"
          git diff --cached --stat
          # Only the files follow_pins.py writes, as plain files.
          paths=$(git diff --cached --no-renames --name-only \
            | grep -Ev '^(versions\.env|model/.+|out/.+|docs/registry/.+)$' || true)
          modes=$(git diff --cached --no-renames --raw \
            | awk '$2 !~ /^(100644|000000)$/ {print $NF " (mode " $2 ")"}')
          if [[ -n "$paths$modes" ]]; then
            echo "::error::The regenerated patch touches paths it must not, or not as plain files:"
            printf '%s\n' "$paths" "$modes" | grep .
            exit 1
          fi
          if [[ -z "$TOKEN" ]]; then
            echo "::error::This branch needs regenerating and the RENOVATE_FOLLOWUP_APP_CLIENT_ID and RENOVATE_FOLLOWUP_APP_KEY secrets are not set, so it cannot be pushed. Run 'python tools/follow_pins.py' on the branch and commit the result (see CONTRIBUTING.md, \"Dependency bumps\")."
            exit 1
          fi
          # renovate.json lists this author in gitIgnoredAuthors, so Renovate
          # keeps updating the branch after this commit.
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -s -m "$SUBJECT"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
