# Checks the generated constants against what each SDK ships on its main
# branch: rius-sdk-python and rius-sdk-typescript. See the README, "CI", and
# tools/check_parity.py for what is compared.
#
# Both SDK repositories are public, so this job needs no secret. The Rius
# backend's Go constants are checked in the backend's own CI, against a pinned
# release of this registry, not here.
name: parity

on:
  pull_request:
  push:
    branches: [main]
  # The SDKs change without touching this repository; a daily run notices.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out rius-sdk-python
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: glassflow/rius-sdk-python
          ref: main
          path: consumers/rius-sdk-python
          persist-credentials: false

      - name: Check out rius-sdk-typescript
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: glassflow/rius-sdk-typescript
          ref: main
          path: consumers/rius-sdk-typescript
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Evaluates semconv.ts with --experimental-transform-types.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Compare
        run: |
          set -o pipefail
          pip install -r requirements-dev.txt
          # `|| status=$?` so a failure still reaches the summary below; the
          # step's shell runs with -e.
          status=0
          python tools/check_parity.py python typescript --ref HEAD --cross \
            --python-repo consumers/rius-sdk-python \
            --typescript-repo consumers/rius-sdk-typescript | tee parity.txt || status=$?
          { echo '```'; cat parity.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
