# Lints the registry, proves generation is deterministic, fails if out/ is
# stale, and runs the tests. Needs no secrets: everything here reads only this
# repository. Parity with the consumers is parity.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # gofmt formats the generated Go, and the tests compile it. Pinned to the
      # Go line the Rius backend builds with, so gofmt output cannot drift
      # between a developer's machine and CI.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      # The tests evaluate generated TypeScript with --experimental-transform-types.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: pip install -r requirements-dev.txt

      - name: Lint this repository's code
        run: |
          ruff check .
          ruff format --check .

      - name: Lint the registry
        run: python tools/check_registry.py

      - name: Generation is deterministic
        run: |
          python -m generators.generate --out "$RUNNER_TEMP/first"
          python -m generators.generate --out "$RUNNER_TEMP/second"
          diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"

      - name: out/ is current
        run: |
          if ! python -m generators.generate --check; then
            echo "::error::out/ is stale. Run 'python -m generators.generate' and commit the result."
            exit 1
          fi

      - name: Fixtures are complete
        run: python tools/check_fixtures.py

      - name: Every usage key is decided
        run: python tools/check_usage_keys.py

      - name: Tests
        run: python -m pytest -q -rs

  # Checks that model/ is what tools/to_weaver.py writes from registry/, then
  # checks and resolves the Weaver registry under model/ against the upstream
  # registries pinned in versions.env and model/manifest.yaml, runs the policies
  # in policies/ and the shared OTel packs, and compares the registry with the
  # last release. Weaver clones both upstream registries and the policy packs on
  # every run (about 20 seconds each time); it keeps no reusable cache to restore.
  weaver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release tags: the breaking-change gate compares with the last one.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: The manifest pins what versions.env says
        run: python tools/check_weaver_pins.py

      - name: model/ is current
        run: |
          if ! python tools/to_weaver.py --check; then
            echo "::error::model/ is stale. Run 'python tools/to_weaver.py' and commit the result."
            exit 1
          fi

      - name: Install the pinned Weaver
        run: |
          tools/install_weaver.sh "$RUNNER_TEMP/weaver"
          echo "$RUNNER_TEMP/weaver" >> "$GITHUB_PATH"

      # weaver registry check with policies/check and the shared stability and
      # backwards-compatibility packs. Against the newest release whose tree has
      # model/, it fails a removed or retyped key; before such a release exists
      # it says so in a notice and skips only that comparison.
      - name: Policies and the breaking-change gate
        run: python tools/weaver_check.py

      - name: Policy tests
        env:
          RIUS_REQUIRE_WEAVER: "1"
        run: python -m pytest -q -rs tests/test_policies.py

      - name: weaver registry resolve
        run: weaver registry resolve -r model --v2 -o "$RUNNER_TEMP/resolved.yaml"

      - name: Our rows agree with the upstream types they reference
        run: python tools/check_weaver_types.py "$RUNNER_TEMP/resolved.yaml"
