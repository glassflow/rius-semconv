# Tooling configuration only: this repository is not a Python package.
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["generators", "tools", "conftest"]
