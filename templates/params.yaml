# Generated by tools/to_weaver.py from registry/. Edit registry/ and rerun it.
# The weaver --params file: emission order and what Weaver has no definition for.
params:
  layout:
  - const: TRACER_NAME
    key: rius
    symbol: scope
    origin: rius
    namespace_exception: |
      A scope name, not an attribute key, so there is no namespace to be in.
    shipped_in:
    - python
    - typescript
    divergence: |
      The sink deliberately names no instrumentation scope: it stores
      whatever scope name arrives and no reader keys on it.
    rationale: |
      Instrumentation scope name (stamped on every span as otel.scope.name).
      "rius" since the vendor keys were normalized under the product name; it was
      "glassflow" before. Wire-visible, but nothing in the backend keys on it: the
      sink stores the scope name verbatim and no reader filters on it, so the two
      values coexist in stored data without any special handling.
  - const: SERVICE_NAME
  - const: SERVICE_INSTANCE_ID
  - const: SERVICE_VERSION
  - const: PROCESS_WORKING_DIRECTORY
  - const: VCS_REF_HEAD_NAME
  - const: TELEMETRY_DISTRO_NAME
  - const: TELEMETRY_DISTRO_NAME_CODING_AGENTS
    key: rius-coding-agents
    symbol: value
    of: TELEMETRY_DISTRO_NAME
    shipped_in:
    - python
    - go
    divergence: |
      Only the coding-agent plugin (Python) writes it, and only the Rius
      backend (Go) reads it. No TypeScript consumer has a use for it.
  - const: TELEMETRY_DISTRO_VERSION
  - const: GEN_AI_AGENT_NAME
  - const: GEN_AI_AGENT_ID
