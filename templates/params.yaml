# Generated by tools/to_weaver.py from registry/. Edit registry/ and rerun it.
# The weaver --params file: emission order and what Weaver has no definition for.
params:
  layout:
  - const: TRACER_NAME
    key: rius
    symbol: scope
    origin: rius
    namespace_exception: |
      A scope name, not an attribute key, so there is no namespace to be in.
    shipped_in:
    - python
    - typescript
    divergence: |
      The sink deliberately names no instrumentation scope: it stores
      whatever scope name arrives and no reader keys on it.
    rationale: |
      Instrumentation scope name (stamped on every span as otel.scope.name).
      "rius" since the vendor keys were normalized under the product name; it was
      "glassflow" before. Wire-visible, but nothing in the backend keys on it: the
      sink stores the scope name verbatim and no reader filters on it, so the two
      values coexist in stored data without any special handling.
  - const: SERVICE_NAME
    section: '--- Resource attribute keys ---'
    key: service.name
    symbol: attribute
    origin: otel
    kinds: resource
    level: required
    type: string
    fill:
    - native
    shipped_in:
    - go
    divergence: |
      Both SDKs set service.name through the OpenTelemetry SDK's own resource
      handling and name no constant for it; the sink reads it by this constant.
    rationale: |
      OTel standard logical service name. The backend falls back to it when a
      process names no agent.
  - const: SERVICE_INSTANCE_ID
    key: service.instance.id
    symbol: attribute
    origin: otel
    kinds: resource
    level: required
    type: string
    fill:
    - native
    rationale: |
      OTel standard identity of one process lifetime (one uuid per client, minted
      at init). The heartbeat payload's instance_id carries the SAME value, which
      is what lets the backend join heartbeats to traces and count replicas.
  - const: SERVICE_VERSION
    key: service.version
    symbol: attribute
    origin: otel
    kinds: resource
    level: recommended
    type: string
    fill:
    - native
    ts_alias:
      name: ATTR_SERVICE_VERSION
      from: '@opentelemetry/semantic-conventions'
    rationale: |
      OTel standard version of the deployed service. Metadata about the process,
      not about any one span. Stamped only when a version is actually known: there
      is deliberately no placeholder default, because a fake one merges every
      deployment into a single bucket — the same mistake `unknown_service` makes
      for service.name.
  - const: TELEMETRY_DISTRO_NAME
    key: telemetry.distro.name
    symbol: attribute
    origin: otel
    kinds: resource
    level: required
    type: string
    fill:
    - native
    status: planned
    rationale: |
      Names the distribution that exported the span. Both SDKs set it today as
      an inline literal with no semconv constant, which is why the row is
      planned rather than shipped.
  - const: TELEMETRY_DISTRO_VERSION
    key: telemetry.distro.version
    symbol: attribute
    origin: otel
    kinds: resource
    level: required
    type: string
    fill:
    - native
    status: planned
    rationale: |
      The SDK version that exported the span. Inline literal in both SDKs today,
      like telemetry.distro.name.
  - const: GEN_AI_AGENT_NAME
    key: gen_ai.agent.name
    symbol: attribute
    origin: otel
    kinds:
    - AGENT
    - TOOL
    category: identity
    level: conditionally_required
    level_note: when the agent is known
    type: string
    fill:
    - native
    placements:
    - scope: resource
      level: recommended
      brief: the agent this PROCESS is
    - scope: span
      when:
        operation: invoke_agent
      kinds:
      - AGENT
      level: conditionally_required
      brief: the agent BEING INVOKED
    - scope: span
      when:
        operation: execute_tool
      kinds:
      - TOOL
      level: conditionally_required
      brief: the agent EXECUTING the tool
    rationale: |
      The agent this process IS, stamped once on the resource so every span it
      emits groups under the same name its heartbeats do. Without it the backend
      falls through to service.name per span, and a process whose agent name
      differs from its service name has its agents view and its trace list
      disagreeing about what it is called.
  - const: GEN_AI_AGENT_ID
    key: gen_ai.agent.id
    symbol: attribute
    origin: otel
    kinds:
    - AGENT
    category: identity
    level: conditionally_required
    level_note: when the invoked agent is a hosted resource with an id
    type: string
    fill:
    - native
    rationale: |
      The identifier of a HOSTED agent resource, not of an agent in general: the
      conventions give an AWS Bedrock agent ARN and a GCP Agent Registry id as the
      examples, and say it is NOT RECOMMENDED to record in-memory agent instance
      ids here, because those are transient. So an in-process agent leaves it
      unset and there is no configured default to fall back to — a name is the
      only identity such an agent has. Adopted rather than deferred because the
      callers who do run hosted agents have nowhere else to put the id.
  - const: GEN_AI_AGENT_VERSION
    key: gen_ai.agent.version
    symbol: attribute
    origin: otel
    kinds:
    - AGENT
    category: identity
    level: recommended
    type: string
    fill:
    - native
    rationale: |
      The version of the agent an AGENT span INVOKED — the same callee
      gen_ai.agent.name and gen_ai.agent.id describe on that span, never
      the process's own version and never service.version. Registry type is a
      plain string and the conventions' own examples are "1.0.0" and "2025-05-01",
      so the caller's value is taken verbatim: there is no format to validate.
  - const: RIUS_MAIN_AGENT_NAME
  - const: RIUS_MAIN_AGENT_ID
  - const: RIUS_MAIN_AGENT_DESCRIPTION
  - const: RIUS_MAIN_AGENT_VERSION
  - const: OPENINFERENCE_SPAN_KIND
    section: |
      --- Attribute keys ---
      OpenInference
    go: OpenInferenceSpanKind
    key: openinference.span.kind
    symbol: attribute
    origin: openinference
    kinds: all
    category: identity
    level: required
    type: string
    fill:
    - native
    - openinference
    - vercel
  - const: INPUT_VALUE
    key: input.value
    symbol: attribute
    origin: openinference
    kinds:
    - AGENT
    - TOOL
    - RETRIEVER
    - CHAIN
    category: content
    level: vendor
    type: string
    fill:
    - native
    - openinference
    - vercel
  - const: OUTPUT_VALUE
    key: output.value
    symbol: attribute
    origin: openinference
    kinds:
    - AGENT
    - TOOL
    - RETRIEVER
    - CHAIN
    category: content
    level: vendor
    type: string
    fill:
    - native
    - openinference
    - vercel
  - const: SESSION_ID
    key: session.id
    symbol: attribute
    origin: openinference
    kinds: all
    category: identity
    level: vendor
    type: string
    fill:
    - native
    rationale: |
      The session grouping key. OpenInference's spelling, and the one the sink
      reads first; gen_ai.conversation.id is deliberately not emitted alongside
      it, one name for one fact.
  - const: USER_ID
    key: user.id
    symbol: attribute
    origin: openinference
    kinds: all
    category: identity
    level: vendor
    type: string
    fill:
    - native
    rationale: |
      The end-user identity. OpenInference's spelling, also what Langfuse reads
      and what the OTel registry lists; the sink additionally accepts OTel's
      enduser.id / enduser.pseudo.id from third-party instrumentors, but the SDKs
      emit one name for one fact.
  - const: WORKSPACE_ROUTE
  - const: GEN_AI_OPERATION_NAME
    section: OTel GenAI (subset we emit)
    key: gen_ai.operation.name
    symbol: attribute
    origin: otel
    kinds:
      all_but:
      - CHAIN
    category: identity
    level: required
    type: string
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_PROVIDER_NAME
    key: gen_ai.provider.name
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    - EMBEDDING
    category: identity
    level: conditionally_required
    level_note: when known
    type: string
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_REQUEST_MODEL
    key: gen_ai.request.model
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    - EMBEDDING
    category: identity
    level: conditionally_required
    level_note: when known
    type: string
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_REQUEST_REASONING_LEVEL
    key: gen_ai.request.reasoning.level
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: recommended
    type: string
    fill:
    - native
  - const: GEN_AI_RESPONSE_MODEL
    key: gen_ai.response.model
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    - EMBEDDING
    category: metadata
    level: recommended
    type: string
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_RESPONSE_ID
    key: gen_ai.response.id
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: metadata
    level: recommended
    type: string
    fill:
    - native
    rationale: |
      The provider's own identifier for the completion ("chatcmpl-123"),
      Recommended on an inference span. Metadata: it exists only once the provider
      has answered, so it is a post-call setter and never reaches a pending
      snapshot. Not content — an opaque id says nothing about what was said — so
      it survives capture_content=False.
  - const: GEN_AI_OUTPUT_TYPE
    key: gen_ai.output.type
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: conditionally_required
    level_note: when the request specifies an output format
    type: string
    fill:
    - native
    rationale: |
      The output modality the client ASKED for (text / json / image / speech in
      the registry today), Conditionally Required when the request specifies one.
      Identity: it describes the request, so it is known at span creation and must
      ride pending snapshots. Note the key is NOT under gen_ai.request., so
      PENDING_IDENTITY_PREFIXES does not cover it and it needs its own allowlist
      entry. Recorded verbatim rather than validated against the enum: the
      conventions are free to extend it, and a value we do not recognise is still
      the caller's truth. Not content, for the reason the response id is not.
  - const: GEN_AI_REQUEST_STREAM
    key: gen_ai.request.stream
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: conditionally_required
    level_note: when streaming
    type: boolean
    fill:
    - native
    - openinference
    rationale: |
      Streaming, per the GenAI inference-span conventions: gen_ai.request.stream
      (boolean, Conditionally Required when streaming) and
      gen_ai.response.time_to_first_chunk (double, seconds, "measured from request
      issuance", Recommended for streaming requests). Both are set by
      record_first_token: a first chunk arriving is what proves the request
      streamed, and the SDK has no earlier hook for it.
  - const: GEN_AI_RESPONSE_TIME_TO_FIRST_CHUNK
    key: gen_ai.response.time_to_first_chunk
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: metadata
    level: recommended
    level_note: when streaming
    type: double
    fill:
    - native
    - openinference
  - const: GEN_AI_REQUEST_TEMPERATURE
    key: gen_ai.request.temperature
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: recommended
    type: double
    fill:
    - native
    - openinference
    rationale: |
      Sampling parameters. Produced from a generation's model parameters through
      GEN_AI_REQUEST_PARAMETERS, and by normalization, which promotes them out of
      a third-party instrumentor's request bag (llm.invocation_parameters). Names
      and types are the GenAI registry's.
  - const: GEN_AI_REQUEST_TOP_P
    key: gen_ai.request.top_p
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: recommended
    type: double
    fill:
    - native
    - openinference
  - const: GEN_AI_REQUEST_TOP_K
    key: gen_ai.request.top_k
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: recommended
    type: double
    fill:
    - native
    - openinference
  - const: GEN_AI_REQUEST_MAX_TOKENS
    key: gen_ai.request.max_tokens
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: recommended
    type: int
    fill:
    - native
    - openinference
  - const: GEN_AI_REQUEST_FREQUENCY_PENALTY
    key: gen_ai.request.frequency_penalty
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: recommended
    type: double
    fill:
    - native
    - openinference
  - const: GEN_AI_REQUEST_PRESENCE_PENALTY
    key: gen_ai.request.presence_penalty
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: recommended
    type: double
    fill:
    - native
    - openinference
  - const: GEN_AI_REQUEST_SEED
    key: gen_ai.request.seed
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: conditionally_required
    level_note: when the request includes a seed
    type: int
    fill:
    - native
    - openinference
  - const: GEN_AI_REQUEST_STOP_SEQUENCES
    key: gen_ai.request.stop_sequences
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: recommended
    type: string[]
    fill:
    - native
    - openinference
  - const: GEN_AI_REQUEST_CHOICE_COUNT
    key: gen_ai.request.choice.count
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: conditionally_required
    level_note: when available and not 1
    type: int
    fill:
    - native
    - openinference
    rationale: |
      "The target number of candidate completions to return" — OpenAI's `n`.
  - const: GEN_AI_REQUEST_ENCODING_FORMATS
    key: gen_ai.request.encoding_formats
    symbol: attribute
    origin: otel
    kinds:
    - EMBEDDING
    category: identity
    level: recommended
    type: string[]
    fill:
    - native
    - openinference
    rationale: |
      Reached only through model parameters (and so through the request
      parameter table), named because the normalizer's per-key type guard is
      keyed by it.
  - const: GEN_AI_REQUEST_PREVIOUS_RESPONSE_ID
    key: gen_ai.request.previous_response.id
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: recommended
    type: string
    fill:
    - native
    - openinference
  - const: GEN_AI_REQUEST_STREAM_CURSOR
    key: gen_ai.request.stream_cursor
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: identity
    level: recommended
    type: string
    fill:
    - native
    - openinference
  - const: GEN_AI_USAGE_INPUT_TOKENS
    key: gen_ai.usage.input_tokens
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: metadata
    level: recommended
    type: int
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_USAGE_OUTPUT_TOKENS
    key: gen_ai.usage.output_tokens
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: metadata
    level: recommended
    type: int
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_USAGE_CACHE_READ_INPUT_TOKENS
    key: gen_ai.usage.cache_read.input_tokens
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: metadata
    level: recommended
    level_note: when applicable
    type: int
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_USAGE_CACHE_WRITE_INPUT_TOKENS
    key: gen_ai.usage.cache_write.input_tokens
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: metadata
    level: recommended
    level_note: when applicable
    type: int
    fill:
    - native
    - openinference
    rationale: |
      semconv-genai renamed cache_creation -> cache_write (PR #440) before our
      cache fields first shipped; no released SDK version carries the old name.
  - const: GEN_AI_USAGE_REASONING_OUTPUT_TOKENS
    key: gen_ai.usage.reasoning.output_tokens
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: metadata
    level: recommended
    level_note: when applicable
    type: int
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_INPUT_MESSAGES
    key: gen_ai.input.messages
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: content
    level: opt_in
    level_note: on by default
    type: json
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_OUTPUT_MESSAGES
    key: gen_ai.output.messages
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: content
    level: opt_in
    level_note: on by default
    type: json
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_RESPONSE_FINISH_REASONS
    go: GenAIResponseFinishReason
    key: gen_ai.response.finish_reasons
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: metadata
    level: recommended
    type: string[]
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_TOOL_NAME
    key: gen_ai.tool.name
    symbol: attribute
    origin: otel
    kinds:
    - TOOL
    category: identity
    level: required
    type: string
    fill:
    - native
    - openinference
    - vercel
  - const: GEN_AI_TOOL_CALL_ID
    key: gen_ai.tool.call.id
    symbol: attribute
    origin: otel
    kinds:
    - TOOL
    category: identity
    level: recommended
    level_note: if available
    type: string
    fill:
    - native
    rationale: |
      The identifier of the tool call this execution answers — the id the MODEL
      minted on its tool-call message, which is what joins a tool span back to the
      generation that asked for it. Identity, set at span creation, so it needs an
      allowlist entry. Never derived: only the caller holds the model's
      response. Its sibling gen_ai.tool.call.arguments IS content and is listed in
      CONTENT_ATTRIBUTES; an opaque id is not.
  - const: GEN_AI_TOOL_TYPE
    key: gen_ai.tool.type
    symbol: attribute
    origin: otel
    kinds:
    - TOOL
    category: identity
    level: recommended
    level_note: if available
    type: string
    fill:
    - native
    rationale: |
      What KIND of tool ran, the conventions' own examples being "function"
      (client-side), "extension" (agent-side) and "datastore". Identity for the
      same reason the call id is: caller-supplied, known before the tool runs.
      A free string, not an enum, in the registry.
  - const: GEN_AI_TOOL_DEFINITIONS
    key: gen_ai.tool.definitions
    symbol: attribute
    origin: otel
    kinds:
    - LLM
    category: content
    level: opt_in
    type: json
    fill:
    - native
    - openinference
    - vercel
    rationale: |
      The request's tool/function definitions, serialized verbatim (provider
      shapes differ; the backend reads names and sizes from either). Content,
      not identity — listed in CONTENT_ATTRIBUTES.
  - const: GEN_AI_DATA_SOURCE_ID
    key: gen_ai.data_source.id
    symbol: attribute
    origin: otel
    kinds:
    - RETRIEVER
    category: identity
    level: conditionally_required
    level_note: when the retrieval has a single identifiable data source
    type: string
    fill:
    - native
    rationale: |
      The index, collection or knowledge base a retrieval ran against. Identity,
      set at span creation: it is what a retriever span is named after and the
      only thing that distinguishes two otherwise identical searches.
  - const: GEN_AI_RETRIEVAL_TOP_K
    key: gen_ai.retrieval.top_k
    symbol: attribute
    origin: otel
    kinds:
    - RETRIEVER
    category: identity
    level: recommended
    type: int
    fill:
    - native
    rationale: |
      How many documents the retriever was ASKED for, the spec's own framing
      ("also known as k, limit, or max_num_results"). Identity: it is a property
      of the request, known before the search runs, so it rides pending snapshots.
  - const: GEN_AI_RETRIEVAL_DOCUMENTS
    key: gen_ai.retrieval.documents
    symbol: attribute
    origin: otel
    kinds:
    - RETRIEVER
    category: metadata
    level: recommended
    type: json
    fill:
    - native
    rationale: |
      What the retriever RETURNED, as the conventions define it: a JSON array of
      objects each with an optional `id` and an optional `score`. Identifiers and
      relevance only, never document text, which is why the spec does not mark it
      sensitive and why it is NOT on the content allowlist. It is metadata: known
      only once the search has run, so it never reaches a pending snapshot, and
      it survives capture_content=False because a document id is not content.
  - const: MCP_METHOD_NAME
    key: mcp.method.name
    symbol: attribute
    origin: otel
    kinds:
    - TOOL
    category: identity
    level: required
    level_note: on a TOOL span that is an MCP client call
    type: string
    fill:
    - native
    rationale: |
      OTel MCP semantic conventions (semantic-conventions-genai, Development
      stability). mcp.method.name is the REQUIRED attribute of an MCP client span
      and the marker everything downstream keys on: a local TOOL span has the same
      kind, name and I/O shape, so this is what tells the two apart.
  - const: MCP_METHOD_TOOLS_CALL
    key: tools/call
    symbol: value
    of: MCP_METHOD_NAME
  - const: MCP_PROTOCOL_VERSION
    key: mcp.protocol.version
    symbol: attribute
    origin: otel
    kinds:
    - TOOL
    category: identity
    level: recommended
    level_note: on a TOOL span that is an MCP client call
    type: string
    fill:
    - native
    rationale: |
      The version the initialize handshake negotiated — not the one we asked for.
  - const: ERROR_TYPE
    key: error.type
    symbol: attribute
    origin: otel
    kinds: all
    category: metadata
    level: conditionally_required
    level_note: on error
    type: string
    fill:
    - native
    - openinference
    - vercel
    rationale: |
      OTel general error.type: on an MCP tools/call it is "tool_error" when the
      result carries isError (the tool ran and reported failure), else the
      exception class when the call itself raised.
  - const: ERROR_TYPE_TOOL_ERROR
    key: tool_error
    symbol: value
    of: ERROR_TYPE
  - const: EXCEPTION_EVENT
    key: exception
    symbol: event
    origin: otel
    direction: read
    rationale: |
      The OTel exception event, as record_exception() writes it, and its attribute
      naming the exception's class. Read, never emitted by us directly: an
      auto-instrumented failure carries these but no error.type, so normalization
      derives error.type from EXCEPTION_TYPE.
  - const: EXCEPTION_TYPE
    key: exception.type
    symbol: attribute
    origin: otel
    direction: read
    kinds: all
    category: metadata
    type: string
    fill:
    - openinference
    - vercel
    note: an attribute of the exception EVENT, not of the span
  - const: MCP_RESULT_TYPE
  - const: GEN_AI_REQUEST_PREFIX
    key: gen_ai.request.
    symbol: prefix
    origin: otel
    covers: gen_ai.request.<parameter>
  - const: RIUS_REQUEST_PREFIX
  - const: RIUS_REQUEST_TOOL_CHOICE
  - const: GEN_AI_USAGE_PREFIX
    key: gen_ai.usage.
    symbol: prefix
    origin: otel
    covers: gen_ai.usage.<usage key>
    shipped_in:
    - python
    - typescript
    divergence: |
      The SDKs match the usage family by prefix, to move it to
      rius.aggregated_usage.* (see RIUS_AGGREGATED_USAGE_PREFIX). The sink
      names each usage key on its own.
  - const: RIUS_AGGREGATED_USAGE_PREFIX
  - const: RIUS_CONTEXT_SIZES
  - const: GEN_AI_FIRST_TOKEN_EVENT
  - const: RIUS_SPAN_PENDING
  - const: RIUS_PARENT_FOREIGN
  - const: RIUS_SDK_GLOBAL_PROVIDER
  - const: LLM_INVOCATION_PARAMETERS
    key: llm.invocation_parameters
    symbol: attribute
    origin: openinference
    direction: read
    kinds:
    - LLM
    category: content
    type: json
    fill:
    - openinference
    rationale: |
      The request-parameters bag OpenInference instrumentors emit.
  - const: LLM_INPUT_MESSAGES_PREFIX
    key: llm.input_messages.
    symbol: prefix
    origin: openinference
    direction: read
    covers: llm.input_messages.<i>.<message field>
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
    rationale: |
      OpenInference's flattened message families, read by normalization and
      reassembled into gen_ai.input.messages / gen_ai.output.messages: one key
      per field, <prefix><i>.message.role,
      ...message.tool_calls.<j>.tool_call.id,
      ...message.contents.<k>.message_content.type and so on. Source spellings,
      never emitted.
  - const: LLM_OUTPUT_MESSAGES_PREFIX
    key: llm.output_messages.
    symbol: prefix
    origin: openinference
    direction: read
    covers: llm.output_messages.<i>.<message field>
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
  - const: LLM_MESSAGE_ROLE
    key: message.role
    symbol: fragment
    origin: openinference
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
    rationale: |
      The message fields read, relative to <prefix><i>.
  - const: LLM_MESSAGE_CONTENT
    key: message.content
    symbol: fragment
    origin: openinference
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
  - const: LLM_MESSAGE_TOOL_CALL_ID
    key: message.tool_call_id
    symbol: fragment
    origin: openinference
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
  - const: LLM_MESSAGE_TOOL_CALLS_PREFIX
    key: message.tool_calls.
    symbol: fragment
    origin: openinference
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
    rationale: |
      A message's tool calls: message.tool_calls.<j>.tool_call.<field>.
  - const: LLM_TOOL_CALL_PREFIX
    key: tool_call.
    symbol: fragment
    origin: openinference
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
  - const: LLM_TOOL_CALL_ID
    key: id
    symbol: fragment
    origin: openinference
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
    rationale: |
      Tool-call fields relative to tool_call.
  - const: LLM_TOOL_CALL_FUNCTION_NAME
    key: function.name
    symbol: fragment
    origin: openinference
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
  - const: LLM_TOOL_CALL_FUNCTION_ARGUMENTS
    key: function.arguments
    symbol: fragment
    origin: openinference
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
  - const: LLM_MESSAGE_CONTENTS_PREFIX
    key: message.contents.
    symbol: fragment
    origin: openinference
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
    rationale: |
      A message's multimodal items:
      message.contents.<k>.message_content.<field>, plus
      message.contents.<k>.tool_call.<field> on a tool_use item.
  - const: LLM_MESSAGE_CONTENT_PREFIX
    key: message_content.
    symbol: fragment
    origin: openinference
    shipped_in:
    - typescript
    divergence: |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
  - const: CHAIN_SPAN_NAME
    key: chain
    symbol: name
    rationale: |
      The name of a span whose kind has no operation and nothing else to compose
      from. The conventions define no operation for a generic workflow step, and
      the manual span helpers see nothing but the kind. A literal beats an empty
      name.
  allowlists:
    pending_identity:
      const: PENDING_IDENTITY_ATTRIBUTES
      go: PendingIdentityAttributes
      doc: |
        Attributes allowed to ride a pending snapshot: identity/taxonomy known at
        span start. An ALLOWLIST on purpose: content exclusion must hold for
        third-party instrumentors' attribute families too, and a blocklist would
        have to enumerate all of them.
      attributes:
      - ref: OPENINFERENCE_SPAN_KIND
      - ref: GEN_AI_OPERATION_NAME
      - ref: GEN_AI_PROVIDER_NAME
      - ref: GEN_AI_TOOL_NAME
      - ref: GEN_AI_TOOL_CALL_ID
        note: |
          Which tool call a still-running execution answers, and what kind of
          tool it is. Both are caller-supplied at creation, and the call id is
          what joins the pending tool span back to the generation that asked
          for it while the tool is still running.
      - ref: GEN_AI_TOOL_TYPE
      - ref: GEN_AI_OUTPUT_TYPE
        note: |
          The requested output modality describes the request, so it is known
          before the model answers. Listed explicitly because the key sits
          outside gen_ai.request. and the prefix rule does not reach it.
      - ref: GEN_AI_DATA_SOURCE_ID
        note: |
          Which index a still-running retrieval is searching is identity, and
          the live view has nothing else to tell two searches apart by.
      - ref: GEN_AI_RETRIEVAL_TOP_K
        note: |
          How many documents were asked for is a property of the request, so
          it is known before the search returns and belongs on the snapshot.
          Its counterpart, gen_ai.retrieval.documents, deliberately is not:
          what came back cannot be known while the span is still open.
      - ref: GEN_AI_AGENT_NAME
        note: |
          Which agent a span invokes is chosen by the caller before the work
          starts, so a still-running agent is attributable in the live view.
          On a TOOL span the same key instead names the agent EXECUTING the
          call, known from the enclosing scope at creation for the same
          reason: which agent is stuck is the live view's first question.
          Distinct from the resource key of the same name, which says which
          PROCESS is running; this says which agent that process invoked here.
      - ref: GEN_AI_AGENT_ID
      - ref: GEN_AI_AGENT_VERSION
        note: |
          Which VERSION of that agent definition was invoked. Chosen by the
          caller at creation like the other two, and the live view's follow-up
          question once it knows which agent is stuck.
      - ref: MCP_METHOD_NAME
        note: |
          Protocol identity, not content: a still-running MCP call must be
          distinguishable from a local tool in the live view — the one place
          setting the marker at creation pays off.
      - ref: MCP_PROTOCOL_VERSION
      - ref: SESSION_ID
        note: |
          Identity, not content: a pending span must be groupable into its
          session while still running, that is the live view's whole point.
      - ref: USER_ID
        note: |
          Same reason: a crashed run's partial spans must still be
          attributable to the user they served.
      - ref: WORKSPACE_ROUTE
        note: |
          Routing, not content: a crashed run's snapshot must land in the same
          workspace its final span would have. Stripped at export either way.
    pending_identity_prefixes:
      const: PENDING_IDENTITY_PREFIXES
      go: PendingIdentityPrefixes
      doc: |
        gen_ai.request.* (model, temperature, ...) is identity, not content, and so
        is rius.request.* (the caller parameters the conventions do not define):
        both are chosen before the call runs, so a live view of a still-running
        generation must already show them. The two namespaces are deliberately
        treated alike here as well as in CONTENT_ATTRIBUTES.
      refs:
      - GEN_AI_REQUEST_PREFIX
      - RIUS_REQUEST_PREFIX
    invocation_parameters_content_members:
      const: INVOCATION_PARAMETERS_CONTENT_MEMBERS
      go: InvocationParametersContentMembers
      doc: |
        Parameter names that carry TOOL DEFINITIONS rather than a sampling knob.
        Named once and consumed by every route to the same definitions, so the
        routes cannot drift apart: as gen_ai.request.<member> and
        rius.request.<member> (derived into CONTENT_ATTRIBUTES), and as JSON
        members of llm.invocation_parameters. Tool definitions are content in the
        same sense messages are, and which route they arrived by cannot be what
        decides whether they are protected.
      values:
      - tools
      - functions
    content:
      const: CONTENT_ATTRIBUTES
      go: ContentAttributes
      doc: |
        Attribute keys carrying user content, masked/stripped at export.
      attributes:
      - ref: INPUT_VALUE
      - ref: OUTPUT_VALUE
      - ref: GEN_AI_INPUT_MESSAGES
      - ref: GEN_AI_OUTPUT_MESSAGES
      - key: gen_ai.tool.description
        note: |
          Sensitive per the GenAI conventions (semconv-genai#431): tool
          definitions routinely embed proprietary prompt engineering, and
          sometimes credentials or internal URLs in parameter defaults.
          gen_ai.tool.name stays: it is identity, not content.
      - ref: GEN_AI_TOOL_DEFINITIONS
      - key: gen_ai.system_instructions
        note: |
          GenAI semconv keys emitted by OTel-native instrumentations (the
          Vercel AI SDK's @ai-sdk/otel among them, pinned 2026-09-14): the
          system prompt and each tool call's input and output are content in
          the same sense messages are. gen_ai.tool.call.id stays: identity.
      - key: gen_ai.tool.call.arguments
      - key: gen_ai.tool.call.result
      - key: tool.description
        note: |
          OpenInference TOOL-kind spans carry the definition under these two
          bare keys, sensitive for the reason gen_ai.tool.description is.
      - key: tool.parameters
      - key: gen_ai.prompt
        note: |
          common third-party content keys (bundled instrumentation)
      - key: gen_ai.completion
      - key: llm.input_messages
      - key: llm.output_messages
      - key: llm.prompts
        note: |
          bare (unflattened) forms of the prefix-covered families:
          instrumentations vary on whether they flatten these into indexed
          keys, and a prefix match never covers its own bare key
      - key: llm.prompt_template
      - key: llm.tools
        note: |
          Every bundled OpenInference instrumentor emits tool definitions as
          llm.tools.{i}.tool.json_schema (pinned empirically 2026-09-14);
          covered by prefix, bare key listed per the bare-key rule.
      - key: ai.prompt
        note: |
          The Vercel AI SDK's own telemetry keys survive the OpenInference
          transform untouched, and they carry the full prompt (messages AND
          tool definitions), response content, and tool-call I/O. Names, ids
          and models (ai.toolCall.name, ai.response.model, ...) are identity
          and stay.
      - key: ai.response.text
      - key: ai.response.object
      - key: ai.toolCall.args
      - key: ai.toolCall.result
      - key: ai.response.reasoning
        note: |
          Same family, keys enumerated from the ai v7 telemetry surface
          (2026-09-14): model reasoning, tool calls in the response, response
          files, embedding inputs, rerank documents, and the generateObject
          schema (a tool definition by another name).
      - key: ai.response.toolCalls
      - key: ai.response.files
      - key: ai.value
      - key: ai.values
      - key: ai.documents
      - key: ai.schema
      - key: ai.schema.description
      - ref: LLM_INVOCATION_PARAMETERS
        note: |
          The OpenInference request-parameters bag, whole. Its membership is
          open and provider-defined — litellm and langchain put the request's
          tools array in it, and providers are free to add anything else —
          so a per-member blocklist is always one provider behind. It is only
          safe to treat the whole bag as content because normalization runs
          BEFORE masking and has already promoted every member the rule table
          recognises onto gen_ai.request.*, so what reaches here is exactly
          the set nothing has classified.
      derived:
        prefixes:
        - GEN_AI_REQUEST_PREFIX
        - RIUS_REQUEST_PREFIX
        members: INVOCATION_PARAMETERS_CONTENT_MEMBERS
        note: |
          The NAMED EXCEPTION to the rule that request parameters export in clear.
          That rule is right for scalar knobs, but a caller passing tools through
          model parameters would otherwise export proprietary prompt engineering
          verbatim with content capture off. Per KEY, not per namespace: both
          namespaces stay non-content wholesale, which is what keeps their tie
          intact.
      includes:
      - third_party_content
    third_party_content:
      const: THIRD_PARTY_CONTENT_ATTRIBUTES
      go: ThirdPartyContentAttributes
      doc: |
        Content keys of other OTel-based SDKs a customer runs next to rius. Their
        spans reach rius's exporter through the foreign-provider bridge, or
        directly when rius holds the global provider they write to, and an e2e
        run found Langfuse's input and output stored with content capture off.
        Each group is read off the SDK's own source at the version named; a key is
        here only if that source writes it onto a span or span event. Names,
        types, levels, usage and prompt keys/versions stay: identity, not content.

        A denylist cannot cover Logfire whole. It writes every keyword argument of
        logfire.span()/info()/@instrument as a top-level attribute under the
        caller's own name, so its content has no fixed key. logfire.msg is listed
        (the message with those values interpolated); logfire.msg_template stays,
        because it is the literal from the caller's code and Logfire already uses
        it as the span name.
      attributes:
      - key: langfuse.observation.input
        note: |
          langfuse 3.15.0, langfuse/_client/attributes.py. Metadata is the
          caller's arbitrary payload (one key per member, see the prefixes), and
          the OpenAI wrapper writes the exception's message into status_message.
      - key: langfuse.observation.output
      - key: langfuse.trace.input
      - key: langfuse.trace.output
      - key: langfuse.observation.metadata
      - key: langfuse.trace.metadata
      - key: langfuse.observation.status_message
      - key: langfuse.experiment.metadata
      - key: langfuse.experiment.item.metadata
      - key: langfuse.experiment.item.expected_output
      - key: traceloop.entity.input
        note: |
          traceloop-sdk 0.62.3 (opentelemetry-semantic-conventions-ai 0.5.1):
          workflow/task I/O and the managed prompt's template and variables; the
          LangChain instrumentation mirrors entity I/O into gen_ai.task.*, and
          the MCP one writes each tool result to mcp.response.value.
      - key: traceloop.entity.output
      - key: traceloop.prompt.template
      - key: traceloop.prompt.template_variables
      - key: gen_ai.task.input
      - key: gen_ai.task.output
      - key: mcp.response.value
      - key: request_data
        note: |
          logfire 5.1.1: the OpenAI/Anthropic integrations put the request and
          the reply in request_data/response_data and the messages in events;
          the OpenAI Agents one adds raw_input, the Response object, and a
          function span's arguments and result under bare input/output.
      - key: response_data
      - key: events
      - key: all_messages_events
      - key: pydantic_ai.all_messages
      - key: raw_input
      - key: response
      - key: input
      - key: output
      - key: logfire.msg
      - key: mlflow.spanInputs
        note: |
          mlflow-tracing 3.16.1, mlflow/tracing/constant.py. chunk.value is a
          streamed chunk, written on span events.
      - key: mlflow.spanOutputs
      - key: mlflow.chat.tools
      - key: mlflow.trace.intermediate_outputs
      - key: mlflow.chunk.value
      - key: gen_ai.retrieval.query.text
        note: |
          openlit 1.45.0, openlit/semcov/__init__.py, each one written by at
          least one of its instrumentations. gen_ai.retrieval.query.text is also
          a GenAI convention key: the user's query, verbatim.
      - key: gen_ai.content.reasoning
      - key: gen_ai.content.revised_prompt
      - key: gen_ai.tool.args
      - key: gen_ai.response.tool_calls
      - key: gen_ai.workflow.input
      - key: gen_ai.workflow.output
      - key: gen_ai.framework.pipeline.input_data
      - key: gen_ai.framework.pipeline.output_data
      - key: gen_ai.framework.error.message
      - key: gen_ai.agent.context
      - key: gen_ai.agent.instructions
      - key: gen_ai.agent.goal
      - key: gen_ai.agent.action.tool_input
      - key: gen_ai.agent.final_result
      - key: gen_ai.agent.next_goal
      - key: gen_ai.agent.step_messages
      - key: gen_ai.memory.search.query
      - key: gen_ai.vectordb.search.query
      - key: gen_ai.extraction.instruction
      - key: mcp.tool.arguments
      - key: mcp.tool.result
      - key: mcp.result
      - key: mcp.params
      - key: mcp.sampling.messages
      - key: mcp.fastmcp.prompt.arguments
      - key: mcp.completion.argument.value
      - key: mcp.completion.context.arguments
      - key: mcp.completion.values
      - key: mcp.error.message
      - key: lmnr.span.input
        note: |
          lmnr 0.7.64, lmnr/opentelemetry_lib/tracing/attributes.py: the
          observed function's arguments and return value, the caller's metadata
          (one key per member, see the prefixes), and the provider's whole reply
          its Anthropic and LiteLLM instrumentations write.
      - key: lmnr.span.output
      - key: lmnr.association.properties.metadata
      - key: lmnr.sdk.raw.response
    content_prefixes:
      const: CONTENT_ATTRIBUTE_PREFIXES
      go: ContentAttributePrefixes
      doc: |
        OpenInference/OpenLLMetry instrumentors flatten message content into indexed
        keys (e.g. `llm.input_messages.0.message.content`), matched by prefix.
      values:
      - llm.input_messages.
      - llm.output_messages.
      - gen_ai.prompt.
      - gen_ai.completion.
      - llm.prompts.
      - llm.prompt_template.
      - llm.tools.
      - ai.prompt.
      - langfuse.observation.metadata.
      - langfuse.trace.metadata.
      - traceloop.prompt.template_variables.
      - lmnr.association.properties.metadata.
    content_prefix_identity:
      const: CONTENT_PREFIX_IDENTITY_ATTRIBUTES
      go: ContentPrefixIdentityAttributes
      doc: |
        Members of a content prefix that carry identity, not content. Laminar's
        metadata is the caller's arbitrary payload, but the sink reads these three
        as the tool call id and the agent name; masking them would cost a trace
        with content capture off its tool linkage and its agent.
      attributes:
      - key: lmnr.association.properties.metadata.tool_call_id
      - key: lmnr.association.properties.metadata.agent.name
      - key: lmnr.association.properties.metadata.service.name
    content_suffixes:
      const: CONTENT_ATTRIBUTE_SUFFIXES
      go: ContentAttributeSuffixes
      doc: |
        Indexed families where only the content leaf is sensitive (siblings like
        `.document.id` / `.document.score` are metadata), matched by suffix.
      values:
      - .document.content
      - .embedding.text
    content_prefixed_suffixes:
      const: CONTENT_ATTRIBUTE_PREFIXED_SUFFIXES
      go: ContentAttributePrefixedSuffixes
      doc: |
        The same, for a leaf too generic to match on its own across every
        namespace (gen_ai.agent.description is identity): a prefix and its content
        leaves. Traceloop writes each tool definition as
        llm.request.functions.{i}.{name,description,parameters} (Ollama
        instrumentation 0.62.3; OpenAI, Anthropic and LangChain up to 0.40.x).
        .name stays: identity. .arguments has no emitter in the versions read, but
        is content by name wherever it appears.
      values:
      - prefix: llm.request.functions.
        suffixes:
        - .description
        - .parameters
        - .arguments
  taxonomy:
    span_kind:
      names:
        python: SpanKind
        typescript: SpanKind
        go: SpanKind
      doc: |
        Observation kind. Values are OpenInference ``openinference.span.kind`` values.
      values:
      - name: AGENT
        doc: an agent invocation or run
      - name: LLM
        doc: a model call (generations use this)
      - name: TOOL
        doc: a tool execution
      - name: RETRIEVER
        doc: a retrieval / search step
      - name: EMBEDDING
        doc: an embedding computation
      - name: RERANKER
        doc: a reranking step, e.g. reordering retrieved documents by relevance
      - name: CHAIN
        doc: a generic processing step (the default)
    operation_by_kind:
      names:
        python: _OPERATION_BY_KIND
        typescript: OPERATION_BY_KIND
        go: OperationByKind
      doc: |
        SpanKind -> OTel GenAI gen_ai.operation.name, where a canonical operation exists.
        CHAIN is deliberately absent: the conventions define no operation for a
        generic workflow step, and inventing one would put a non-spec value in a
        spec-defined enum. Revisit only if the upstream invoke_node proposal lands.
        RERANKER maps to rerank, which the conventions do not define either. It is
        the value the Vercel AI SDK's @ai-sdk/otel writes on a rerank call, and the
        SDKs write it on AI SDK v6 reranks too, so it is already on the wire. Mapping
        the kind to it gives every rerank span (AI SDK, OpenInference RERANKER,
        user-created) the same operation, so a filter on either key finds them all.
      map:
        LLM: chat
        TOOL: execute_tool
        EMBEDDING: embeddings
        AGENT: invoke_agent
        RETRIEVER: retrieval
        RERANKER: rerank
      unmapped:
        CHAIN: the conventions define no operation for a generic workflow step
    kind_by_operation:
      names:
        python: _KIND_BY_OPERATION
        typescript: KIND_BY_OPERATION
        go: KindByOperation
      doc: |
        The inverse, for spans that speak the conventions (and the GenAI-native
        vendor operations listed below, such as agent_step and rerank). A
        GenAI-native instrumentation sets gen_ai.operation.name and never heard of
        openinference.span.kind, and both keys must be present on every span, so
        the derivation has to run in both directions.

        Not a mechanical inversion of the map above, and it cannot be generated from
        it, for two reasons:
          - several operations share one kind. text_completion and generate_content
            are LLM calls the same way chat is, and create_agent is an AGENT span
            just as invoke_agent is, so the mapping is many-to-one and only the
            chat/invoke_agent entries round-trip.
          - CHAIN has no operation of its own, but three operations land on it.
            invoke_workflow and plan are real GenAI operations with no taxonomy
            value of their own; CHAIN is the honest home for both, and the reverse
            direction is the only one that can say so. agent_step is not a
            conventions operation: the Vercel AI SDK's @ai-sdk/otel writes it on
            each step of an agent run (one model call and the tools it asked
            for), a step within the run rather than an agent invocation, so
            CHAIN as well.
      map:
        chat: LLM
        text_completion: LLM
        generate_content: LLM
        execute_tool: TOOL
        embeddings: EMBEDDING
        invoke_agent: AGENT
        create_agent: AGENT
        retrieval: RETRIEVER
        rerank: RERANKER
        invoke_workflow: CHAIN
        plan: CHAIN
        agent_step: CHAIN
    otel_kind_by_kind:
      names:
        python: _OTEL_KIND_BY_KIND
        typescript: OTEL_KIND_BY_KIND
      shipped_in:
      - python
      - typescript
      divergence: |
        Only the SDKs create spans. Emitting it in Go would add an OpenTelemetry
        dependency to a constants package for a map the sink never reads.
      doc: |
        SpanKind (our taxonomy ATTRIBUTE) -> the OpenTelemetry SpanKind FIELD, set
        centrally at span creation. The GenAI conventions decide the field per
        operation: inference, embeddings and retrieval call out of the process
        (CLIENT); execute_tool is INTERNAL; invoke_agent is CLIENT only for a hosted
        agent. Hence:
        - LLM / EMBEDDING / RETRIEVER / RERANKER -> CLIENT: a remote model or
          index is called.
        - TOOL -> INTERNAL: a bare TOOL span is an in-process function, and the
          execute-tool convention says INTERNAL. The MCP wrapper overrides this to
          CLIENT at its own call site because a tools/call crosses a process
          boundary and the MCP client convention says CLIENT.
        - AGENT -> INTERNAL: an observed agent function is an in-process agent, the
          convention's INTERNAL case; a hosted agent would need a call-site override.
        - CHAIN -> INTERNAL: a workflow step by definition.
        Nothing in the backend groups on this field (it reads the attributes), so
        the mapping is free to follow the conventions exactly.
      map:
        LLM: CLIENT
        EMBEDDING: CLIENT
        RETRIEVER: CLIENT
        RERANKER: CLIENT
        TOOL: INTERNAL
        AGENT: INTERNAL
        CHAIN: INTERNAL
    name_target_by_kind:
      names:
        python: _NAME_TARGET_BY_KIND
        typescript: NAME_TARGET_BY_KIND
        go: NameTargetByKind
      doc: |
        Which attribute names the target of a span's `{operation} {target}` name,
        per kind. One key each, so a tool name can never surface in an agent's name
        and the composed name stays a reliable filter value. CHAIN is absent: it has
        no operation and so no composed name. LLM reads the REQUEST model on
        purpose: a pending snapshot must carry the same name as the final span.
        RERANKER reads the request model too, as EMBEDDING does, so a rerank span
        is named `rerank <model>`.
      map:
        LLM: GEN_AI_REQUEST_MODEL
        EMBEDDING: GEN_AI_REQUEST_MODEL
        TOOL: GEN_AI_TOOL_NAME
        AGENT: GEN_AI_AGENT_NAME
        RETRIEVER: GEN_AI_DATA_SOURCE_ID
        RERANKER: GEN_AI_REQUEST_MODEL
      unmapped:
        CHAIN: no operation, so nothing to compose a name from
  model_parameters:
    const: GEN_AI_REQUEST_PARAMETERS
    go: GenAIRequestParameters
    fallback_prefix: RIUS_REQUEST_PREFIX
    doc: |
      Request parameters the GenAI conventions define, mapped from every spelling
      we recognise to the canonical attribute key. Verified against
      open-telemetry/semantic-conventions-genai at commit
      8ffdf568e1b4391a99adb081db16e8102e36918e (2026-09-22),
      model/gen-ai/registry.yaml — the repo cuts no releases, so a commit is the
      only citable pin. Each canonical key appears under its own bare spelling
      plus the provider spellings that mean the SAME parameter; anything absent
      here is a caller parameter and goes to RIUS_REQUEST_PREFIX verbatim.

      A provider spelling normalises to ONE key, the canonical one: the provider
      spelling is not also emitted. Two keys for one parameter would make every
      consumer de-duplicate, and the point of a convention is that there is one
      place to look.
    groups:
    - target: gen_ai.request.model
      note: model — the request's model; also settable as its own argument.
      spellings:
      - model
    - target: gen_ai.request.max_tokens
      note: |
        max_tokens — OpenAI Chat Completions `max_tokens`, its successor
        `max_completion_tokens`, the Responses API's `max_output_tokens`, and
        Google's `maxOutputTokens`.
      spellings:
      - max_tokens
      - maxTokens
      - max_completion_tokens
      - maxCompletionTokens
      - max_output_tokens
      - maxOutputTokens
    - target: gen_ai.request.choice.count
      note: |
        choice.count — "the target number of candidate completions to return":
        OpenAI `n`, Google `candidateCount`, Cohere `num_generations`.
      spellings:
      - choice.count
      - n
      - candidate_count
      - candidateCount
      - num_generations
    - target: gen_ai.request.temperature
      spellings:
      - temperature
    - target: gen_ai.request.top_p
      note: top_p — Google `topP`, Cohere `p`.
      spellings:
      - top_p
      - topP
      - p
    - target: gen_ai.request.top_k
      note: |
        top_k — the registry's own note names Anthropic `top_k`, Cohere `k` and
        Google `topK`, and says OpenAI's `top_logprobs` MUST NOT be reported
        here (it shapes the response, not the sampling). So top_logprobs is
        deliberately absent and lands in rius.request.*.
      spellings:
      - top_k
      - topK
      - k
    - target: gen_ai.request.stop_sequences
      note: stop_sequences — OpenAI `stop`, Google `stopSequences`.
      spellings:
      - stop_sequences
      - stopSequences
      - stop
    - target: gen_ai.request.frequency_penalty
      spellings:
      - frequency_penalty
      - frequencyPenalty
    - target: gen_ai.request.presence_penalty
      spellings:
      - presence_penalty
      - presencePenalty
    - target: gen_ai.request.encoding_formats
      note: |
        encoding_formats — plural in the registry; OpenAI's embeddings endpoint
        sends the singular `encoding_format`, and the registry's note says some
        systems call these "embedding types" (Cohere `embedding_types`).
      spellings:
      - encoding_formats
      - encoding_format
      - encodingFormat
      - embedding_types
    - target: gen_ai.request.seed
      spellings:
      - seed
    - target: gen_ai.request.stream
      spellings:
      - stream
    - target: gen_ai.request.reasoning.level
      note: |
        reasoning.level — "the exact string value sent to the provider";
        OpenAI sends it as `reasoning_effort`.
      spellings:
      - reasoning.level
      - reasoning_level
      - reasoning_effort
      - reasoningEffort
    - target: gen_ai.request.previous_response.id
      note: |
        previous_response.id — the registry names OpenAI's
        `previous_response_id` and Google's `previous_interaction_id`.
      spellings:
      - previous_response.id
      - previous_response_id
      - previousResponseId
      - previous_interaction_id
    - target: gen_ai.request.stream_cursor
      note: |
        stream_cursor — the registry names OpenAI's `starting_after` and
        Google's `last_event_id`.
      spellings:
      - stream_cursor
      - starting_after
      - last_event_id
  preamble:
    notice: Generated by rius-semconv from its registry/ directory. DO NOT EDIT.
    header: |
      Regenerate with `python -m generators.generate` in rius-semconv and copy
      the result; see that repository's README for how consumers pin a version.
    python:
      filename: _semconv_generated.py
      docstring: |
        Rius semantic conventions: the constants and tables, generated.

        The hand-written ``semconv.py`` re-exports everything here and adds the
        helper functions that use it.
    typescript:
      filename: semconv.generated.ts
    go:
      filename: semconv_generated.go
      package: semconv
