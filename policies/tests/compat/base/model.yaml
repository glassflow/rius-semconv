file_format: definition/2
attribute_groups:
- id: rius.upstream
  visibility: public
  stability: development
  brief: Upstream keys we use.
  attributes:
  - ref: up.kept
  - ref: up.dropped
  - ref: up.planned
    annotations: {rius: {status: planned}}
attributes:
- key: rius.retyped
  type: string
  brief: A development key.
  stability: development
  annotations: {rius: {origin: rius}}
- key: rius.int_to_double
  type: int
  brief: A development key.
  stability: development
  annotations: {rius: {origin: rius}}
- key: rius.planned
  type: string
  brief: A row that never shipped.
  stability: development
  annotations: {rius: {status: planned}}
- key: rius.enum_grows
  type:
    members:
    - {id: a, value: a, brief: A., stability: development}
  brief: An enum.
  stability: development
  annotations: {rius: {origin: rius}}
- key: rius.enum_to_string
  type:
    members:
    - {id: a, value: a, brief: A., stability: development}
  brief: An enum.
  stability: development
  annotations: {rius: {origin: rius}}
- key: rius.stable_retyped
  type: string
  brief: A stable key.
  stability: stable
  annotations: {rius: {origin: rius}}
