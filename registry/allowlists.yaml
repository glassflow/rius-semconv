# The allowlists that decide what leaves the process, and when.
#
# Both are ALLOWLISTS on purpose: content exclusion must hold for third-party
# instrumentors' attribute families too, and a blocklist would have to
# enumerate all of them.
#
# Membership is AUTHORED here, never derived from an attribute's category.
# The registry linter checks the two agree (an identity attribute that is not
# a pending member must say why in `not_pending`), but it never fills one in
# from the other: "rides a pending snapshot" and "is a member of this
# constant" are two facts, and rius.span.pending is where they differ.
#
# Members are emitted in order. `ref` names a constant from attributes.yaml
# and is emitted as that identifier; `key` is emitted as a string literal, for
# third-party keys the registry has no constant for. `shipped_in` and
# `divergence` work as they do on attribute rows.

pending_identity:
  const: PENDING_IDENTITY_ATTRIBUTES
  go: PendingIdentityAttributes
  doc: |
    Attributes allowed to ride a pending snapshot: identity/taxonomy known at
    span start. An ALLOWLIST on purpose: content exclusion must hold for
    third-party instrumentors' attribute families too, and a blocklist would
    have to enumerate all of them.
  attributes:
    - ref: OPENINFERENCE_SPAN_KIND
    - ref: GEN_AI_OPERATION_NAME
    - ref: GEN_AI_PROVIDER_NAME
    - ref: GEN_AI_TOOL_NAME
    - ref: GEN_AI_TOOL_CALL_ID
      note: |
        Which tool call a still-running execution answers, and what kind of
        tool it is. Both are caller-supplied at creation, and the call id is
        what joins the pending tool span back to the generation that asked
        for it while the tool is still running.
    - ref: GEN_AI_TOOL_TYPE
    - ref: GEN_AI_OUTPUT_TYPE
      note: |
        The requested output modality describes the request, so it is known
        before the model answers. Listed explicitly because the key sits
        outside gen_ai.request. and the prefix rule does not reach it.
    - ref: GEN_AI_DATA_SOURCE_ID
      note: |
        Which index a still-running retrieval is searching is identity, and
        the live view has nothing else to tell two searches apart by.
    - ref: GEN_AI_RETRIEVAL_TOP_K
      note: |
        How many documents were asked for is a property of the request, so
        it is known before the search returns and belongs on the snapshot.
        Its counterpart, gen_ai.retrieval.documents, deliberately is not:
        what came back cannot be known while the span is still open.
    - ref: GEN_AI_AGENT_NAME
      note: |
        Which agent a span invokes is chosen by the caller before the work
        starts, so a still-running agent is attributable in the live view.
        On a TOOL span the same key instead names the agent EXECUTING the
        call, known from the enclosing scope at creation for the same
        reason: which agent is stuck is the live view's first question.
        Distinct from the resource key of the same name, which says which
        PROCESS is running; this says which agent that process invoked here.
    - ref: GEN_AI_AGENT_ID
    - ref: GEN_AI_AGENT_VERSION
      note: |
        Which VERSION of that agent definition was invoked. Chosen by the
        caller at creation like the other two, and the live view's follow-up
        question once it knows which agent is stuck.
    - ref: MCP_METHOD_NAME
      note: |
        Protocol identity, not content: a still-running MCP call must be
        distinguishable from a local tool in the live view, the one place
        setting the marker at creation pays off.
    - ref: MCP_PROTOCOL_VERSION
    - ref: SESSION_ID
      note: |
        Identity, not content: a pending span must be groupable into its
        session while still running, that is the live view's whole point.
    - ref: USER_ID
      note: |
        Same reason: a crashed run's partial spans must still be
        attributable to the user they served.
    - ref: WORKSPACE_ROUTE
      note: |
        Routing, not content: a crashed run's snapshot must land in the same
        workspace its final span would have. Stripped at export either way.

pending_identity_prefixes:
  const: PENDING_IDENTITY_PREFIXES
  go: PendingIdentityPrefixes
  doc: |
    gen_ai.request.* (model, temperature, ...) is identity, not content, and so
    is rius.request.* (the caller parameters the conventions do not define):
    both are chosen before the call runs, so a live view of a still-running
    generation must already show them. The two namespaces are deliberately
    treated alike here as well as in CONTENT_ATTRIBUTES.
  refs:
    - GEN_AI_REQUEST_PREFIX
    - RIUS_REQUEST_PREFIX

invocation_parameters_content_members:
  const: INVOCATION_PARAMETERS_CONTENT_MEMBERS
  go: InvocationParametersContentMembers
  doc: |
    Parameter names that carry TOOL DEFINITIONS rather than a sampling knob.
    Named once and consumed by every route to the same definitions, so the
    routes cannot drift apart: as gen_ai.request.<member> and
    rius.request.<member> (derived into CONTENT_ATTRIBUTES), and as JSON
    members of llm.invocation_parameters. Tool definitions are content in the
    same sense messages are, and which route they arrived by cannot be what
    decides whether they are protected.
  values:
    - tools
    - functions

content:
  const: CONTENT_ATTRIBUTES
  go: ContentAttributes
  doc: |
    Attribute keys carrying user content, masked/stripped at export.
  attributes:
    - ref: INPUT_VALUE
    - ref: OUTPUT_VALUE
    - ref: GEN_AI_INPUT_MESSAGES
    - ref: GEN_AI_OUTPUT_MESSAGES
    - key: gen_ai.tool.description
      note: |
        Sensitive per the GenAI conventions (semconv-genai#431): tool
        definitions routinely embed proprietary prompt engineering, and
        sometimes credentials or internal URLs in parameter defaults.
        gen_ai.tool.name stays: it is identity, not content.
    - ref: GEN_AI_TOOL_DEFINITIONS
    - key: gen_ai.system_instructions
      note: |
        GenAI semconv keys emitted by OTel-native instrumentations (the
        Vercel AI SDK's @ai-sdk/otel among them, pinned 2026-09-14): the
        system prompt and each tool call's input and output are content in
        the same sense messages are. gen_ai.tool.call.id stays: identity.
    - key: gen_ai.tool.call.arguments
    - key: gen_ai.tool.call.result
    - key: tool.description
      note: |
        OpenInference TOOL-kind spans carry the definition under these two
        bare keys, sensitive for the reason gen_ai.tool.description is.
    - key: tool.parameters
    - key: gen_ai.prompt
      note: |
        common third-party content keys (bundled instrumentation)
    - key: gen_ai.completion
    - key: llm.input_messages
    - key: llm.output_messages
    - key: llm.prompts
      note: |
        bare (unflattened) forms of the prefix-covered families:
        instrumentations vary on whether they flatten these into indexed
        keys, and a prefix match never covers its own bare key
    - key: llm.prompt_template
    - key: llm.tools
      note: |
        Every bundled OpenInference instrumentor emits tool definitions as
        llm.tools.{i}.tool.json_schema (pinned empirically 2026-09-14);
        covered by prefix, bare key listed per the bare-key rule.
    - key: ai.prompt
      note: |
        The Vercel AI SDK's own telemetry keys survive the OpenInference
        transform untouched, and they carry the full prompt (messages AND
        tool definitions), response content, and tool-call I/O. Names, ids
        and models (ai.toolCall.name, ai.response.model, ...) are identity
        and stay.
    - key: ai.response.text
    - key: ai.response.object
    - key: ai.toolCall.args
    - key: ai.toolCall.result
    - key: ai.response.reasoning
      note: |
        Same family, keys enumerated from the ai v7 telemetry surface
        (2026-09-14): model reasoning, tool calls in the response, response
        files, embedding inputs, rerank documents, and the generateObject
        schema (a tool definition by another name).
    - key: ai.response.toolCalls
    - key: ai.response.files
    - key: ai.value
    - key: ai.values
    - key: ai.documents
    - key: ai.schema
    - key: ai.schema.description
    - ref: LLM_INVOCATION_PARAMETERS
      note: |
        The OpenInference request-parameters bag, whole. Its membership is
        open and provider-defined (litellm and langchain put the request's
        tools array in it, and providers are free to add anything else),
        so a per-member blocklist is always one provider behind. It is only
        safe to treat the whole bag as content because normalization runs
        BEFORE masking and has already promoted every member the rule table
        recognises onto gen_ai.request.*, so what reaches here is exactly
        the set nothing has classified.
    - ref: RIUS_COMPACTION_SUMMARY_TEXT
      note: |
        A compaction's summary restates the conversation it replaced, so it
        is content in the same sense messages are. Its size,
        rius.compaction.summary.bytes, is not: it stays off this list and
        survives masking.
  # Keys derived as {prefix}{member}, for every prefix and every member.
  derived:
    prefixes: [GEN_AI_REQUEST_PREFIX, RIUS_REQUEST_PREFIX]
    members: INVOCATION_PARAMETERS_CONTENT_MEMBERS
    note: |
      The NAMED EXCEPTION to the rule that request parameters export in clear.
      That rule is right for scalar knobs, but a caller passing tools through
      model parameters would otherwise export proprietary prompt engineering
      verbatim with content capture off. Per KEY, not per namespace: both
      namespaces stay non-content wholesale, which is what keeps their tie
      intact.
  # Whole allowlists folded into this one, after the members and the derived
  # keys. Each name is a top-level section of this file.
  includes: [third_party_content]

third_party_content:
  const: THIRD_PARTY_CONTENT_ATTRIBUTES
  go: ThirdPartyContentAttributes
  doc: |
    Content keys of other OTel-based SDKs a customer runs next to rius. Their
    spans reach rius's exporter through the foreign-provider bridge, or
    directly when rius holds the global provider they write to, and an e2e
    run found Langfuse's input and output stored with content capture off.
    Each group is read off the SDK's own source at the version named; a key is
    here only if that source writes it onto a span or span event. Names,
    types, levels, usage and prompt keys/versions stay: identity, not content.

    A denylist cannot cover Logfire whole. It writes every keyword argument of
    logfire.span()/info()/@instrument as a top-level attribute under the
    caller's own name, so its content has no fixed key. logfire.msg is listed
    (the message with those values interpolated); logfire.msg_template stays,
    because it is the literal from the caller's code and Logfire already uses
    it as the span name.
  attributes:
    - key: langfuse.observation.input
      note: |
        langfuse 3.15.0, langfuse/_client/attributes.py. Metadata is the
        caller's arbitrary payload (one key per member, see the prefixes), and
        the OpenAI wrapper writes the exception's message into status_message.
    - key: langfuse.observation.output
    - key: langfuse.trace.input
    - key: langfuse.trace.output
    - key: langfuse.observation.metadata
    - key: langfuse.trace.metadata
    - key: langfuse.observation.status_message
    - key: langfuse.experiment.metadata
    - key: langfuse.experiment.item.metadata
    - key: langfuse.experiment.item.expected_output
    - key: traceloop.entity.input
      note: |
        traceloop-sdk 0.62.3 (opentelemetry-semantic-conventions-ai 0.5.1):
        workflow/task I/O and the managed prompt's template and variables; the
        LangChain instrumentation mirrors entity I/O into gen_ai.task.*, and
        the MCP one writes each tool result to mcp.response.value.
    - key: traceloop.entity.output
    - key: traceloop.prompt.template
    - key: traceloop.prompt.template_variables
    - key: gen_ai.task.input
    - key: gen_ai.task.output
    - key: mcp.response.value
    - key: request_data
      note: |
        logfire 5.1.1: the OpenAI/Anthropic integrations put the request and
        the reply in request_data/response_data and the messages in events;
        the OpenAI Agents one adds raw_input, the Response object, and a
        function span's arguments and result under bare input/output.
    - key: response_data
    - key: events
    - key: all_messages_events
    - key: pydantic_ai.all_messages
    - key: raw_input
    - key: response
    - key: input
    - key: output
    - key: logfire.msg
    - key: mlflow.spanInputs
      note: |
        mlflow-tracing 3.16.1, mlflow/tracing/constant.py. chunk.value is a
        streamed chunk, written on span events.
    - key: mlflow.spanOutputs
    - key: mlflow.chat.tools
    - key: mlflow.trace.intermediate_outputs
    - key: mlflow.chunk.value
    - key: gen_ai.retrieval.query.text
      note: |
        openlit 1.45.0, openlit/semcov/__init__.py, each one written by at
        least one of its instrumentations. gen_ai.retrieval.query.text is also
        a GenAI convention key: the user's query, verbatim.
    - key: gen_ai.content.reasoning
    - key: gen_ai.content.revised_prompt
    - key: gen_ai.tool.args
    - key: gen_ai.response.tool_calls
    - key: gen_ai.workflow.input
    - key: gen_ai.workflow.output
    - key: gen_ai.framework.pipeline.input_data
    - key: gen_ai.framework.pipeline.output_data
    - key: gen_ai.framework.error.message
    - key: gen_ai.agent.context
    - key: gen_ai.agent.instructions
    - key: gen_ai.agent.goal
    - key: gen_ai.agent.action.tool_input
    - key: gen_ai.agent.final_result
    - key: gen_ai.agent.next_goal
    - key: gen_ai.agent.step_messages
    - key: gen_ai.memory.search.query
    - key: gen_ai.vectordb.search.query
    - key: gen_ai.extraction.instruction
    - key: mcp.tool.arguments
    - key: mcp.tool.result
    - key: mcp.result
    - key: mcp.params
    - key: mcp.sampling.messages
    - key: mcp.fastmcp.prompt.arguments
    - key: mcp.completion.argument.value
    - key: mcp.completion.context.arguments
    - key: mcp.completion.values
    - key: mcp.error.message
    - key: lmnr.span.input
      note: |
        lmnr 0.7.64, lmnr/opentelemetry_lib/tracing/attributes.py: the
        observed function's arguments and return value, the caller's metadata
        (one key per member, see the prefixes), and the provider's whole reply
        its Anthropic and LiteLLM instrumentations write.
    - key: lmnr.span.output
    - key: lmnr.association.properties.metadata
    - key: lmnr.sdk.raw.response

content_prefixes:
  const: CONTENT_ATTRIBUTE_PREFIXES
  go: ContentAttributePrefixes
  doc: |
    OpenInference/OpenLLMetry instrumentors flatten message content into indexed
    keys (e.g. `llm.input_messages.0.message.content`), matched by prefix.
  values:
    - llm.input_messages.
    - llm.output_messages.
    - gen_ai.prompt.
    - gen_ai.completion.
    - llm.prompts.
    - llm.prompt_template.
    - llm.tools.
    - ai.prompt.
    - langfuse.observation.metadata.
    - langfuse.trace.metadata.
    - traceloop.prompt.template_variables.
    - lmnr.association.properties.metadata.

content_prefix_identity:
  const: CONTENT_PREFIX_IDENTITY_ATTRIBUTES
  go: ContentPrefixIdentityAttributes
  doc: |
    Members of a content prefix that carry identity, not content. Laminar's
    metadata is the caller's arbitrary payload, but the sink reads these three
    as the tool call id and the agent name; masking them would cost a trace
    with content capture off its tool linkage and its agent.
  attributes:
    - key: lmnr.association.properties.metadata.tool_call_id
    - key: lmnr.association.properties.metadata.agent.name
    - key: lmnr.association.properties.metadata.service.name

content_suffixes:
  const: CONTENT_ATTRIBUTE_SUFFIXES
  go: ContentAttributeSuffixes
  doc: |
    Indexed families where only the content leaf is sensitive (siblings like
    `.document.id` / `.document.score` are metadata), matched by suffix.
  values:
    - .document.content
    - .embedding.text

content_prefixed_suffixes:
  const: CONTENT_ATTRIBUTE_PREFIXED_SUFFIXES
  go: ContentAttributePrefixedSuffixes
  doc: |
    The same, for a leaf too generic to match on its own across every
    namespace (gen_ai.agent.description is identity): a prefix and its content
    leaves. Traceloop writes each tool definition as
    llm.request.functions.{i}.{name,description,parameters} (Ollama
    instrumentation 0.62.3; OpenAI, Anthropic and LangChain up to 0.40.x).
    .name stays: identity. .arguments has no emitter in the versions read, but
    is content by name wherever it appears.
  values:
    - prefix: llm.request.functions.
      suffixes: [.description, .parameters, .arguments]
