# The canonical Rius attribute registry.
#
# Authored from RIUS-917 ("Define the canonical core attribute set and
# normalization rules"), cross-checked against rius-sdk-python
# src/rius/semconv.py @ origin/main c9344c6 (2026-09-23), which is today's
# parity source.
#
# Every row is one emitted symbol, in emission order. Order is the Python
# file's order, because the generated semconv.py has to be a drop-in
# replacement for the hand-written one.
#
# Fields
#   const        Python/TypeScript constant name. Go name is derived, or
#                overridden with `go:`.
#   key          The wire value.
#   symbol       attribute | value | prefix | event | scope
#                  attribute - an attribute key; carries the table columns
#                  value     - an enumerated VALUE of some attribute
#                  prefix    - a key prefix used for matching
#                  event     - a span event name
#                  scope     - the instrumentation scope name
#   category     identity | content | metadata | process_local   (attributes)
#   level        required | conditionally_required | recommended | opt_in |
#                vendor        (RIUS-917: R / CR / Rec / Opt-In / V)
#   level_note   the condition, for conditionally_required / opt_in
#   kinds        all | all_but: [...] | explicit list of span kinds |
#                resource   (a resource attribute, not a span attribute)
#   fill         who populates it: native | openinference | vercel
#   type         string | boolean | double | int | string[] | json
#   group        the RIUS-917 table section this row came from
#   status       shipped  - present in semconv.py @ origin/main today
#                planned  - in the RIUS-917 table, not yet in any SDK.
#                           Generators SKIP these unless --include-planned.
#   ticket       for status: planned, the ticket that lands it
#   rationale    prose. Line breaks are authored, not reflowed: the Python
#                generator emits these verbatim behind "# " so the generated
#                file keeps the wording the hand-written one had.

attributes:
  - const: TRACER_NAME
    key: rius
    symbol: scope
    status: shipped
    rationale: |
      Instrumentation scope name (stamped on every span as otel.scope.name).
      "rius" since the vendor keys were normalized under the product name; it was
      "glassflow" before. Wire-visible, but nothing in the backend keys on it: the
      sink stores the scope name verbatim and no reader filters on it, so the two
      values coexist in stored data without any special handling.

  - const: SERVICE_NAME
    key: service.name
    symbol: attribute
    category: identity
    level: required
    kinds: resource
    fill: [native]
    type: string
    group: resource
    status: planned
    ticket: RIUS-917
    rationale: |
      The logical service. Set by the SDK from config, and the key the trace
      list filters on until an agent name is set. Not a constant in
      semconv.py today: the SDK passes the OTel SDK's own key. Listed here
      because RIUS-917 makes it a required row of the canonical table and
      argus-core already has the constant.

  - const: SERVICE_INSTANCE_ID
    section: "--- Resource attribute keys ---"
    key: service.instance.id
    symbol: attribute
    category: identity
    level: required
    kinds: resource
    fill: [native]
    type: string
    group: resource
    status: shipped
    rationale: |
      OTel standard identity of one process lifetime (one uuid per client, minted
      at init). The heartbeat payload's instance_id carries the SAME value, which
      is what lets the backend join heartbeats to traces and count replicas.

  - const: TELEMETRY_DISTRO_NAME
    key: telemetry.distro.name
    symbol: attribute
    category: identity
    level: required
    kinds: resource
    fill: [native]
    type: string
    group: resource
    status: planned
    ticket: RIUS-917
    rationale: |
      Names the distribution that normalized and exported the span. Together
      with telemetry.distro.version it is how provenance is answered from the
      span alone: a resource with no distro attributes is foreign traffic that
      the sink normalized. Set by the SDK today without a semconv constant.

  - const: TELEMETRY_DISTRO_VERSION
    key: telemetry.distro.version
    symbol: attribute
    category: identity
    level: required
    kinds: resource
    fill: [native]
    type: string
    group: resource
    status: planned
    ticket: RIUS-917
    rationale: |
      The SDK version that normalized the span. Travels separately from the
      instrumentation scope, which names the library that PRODUCED the span
      (RIUS-919). Because normalization has no opt-out, this version pins
      exactly what was applied.

  - const: OPENINFERENCE_SPAN_KIND
    go: OpenInferenceSpanKind
    section: "--- Attribute keys ---\nOpenInference"
    key: openinference.span.kind
    symbol: attribute
    category: identity
    level: required
    kinds: all
    fill: [native, openinference, vercel]
    type: string
    group: taxonomy
    status: shipped

  - const: INPUT_VALUE
    key: input.value
    symbol: attribute
    category: content
    level: vendor
    kinds: [AGENT, TOOL, RETRIEVER, CHAIN]
    fill: [native, openinference, vercel]
    type: string
    group: content
    status: shipped

  - const: OUTPUT_VALUE
    key: output.value
    symbol: attribute
    category: content
    level: vendor
    kinds: [AGENT, TOOL, RETRIEVER, CHAIN]
    fill: [native, openinference, vercel]
    type: string
    group: content
    status: shipped

  - const: SESSION_ID
    key: session.id
    symbol: attribute
    category: identity
    level: vendor
    kinds: all
    fill: [native]
    type: string
    group: correlation
    status: shipped
    rationale: |
      The session grouping key (see session.py). OpenInference's spelling, and the
      one the sink reads first; gen_ai.conversation.id is deliberately not emitted
      alongside it, one name for one fact.

  - const: USER_ID
    key: user.id
    symbol: attribute
    category: identity
    level: vendor
    kinds: all
    fill: [native]
    type: string
    group: correlation
    status: shipped
    rationale: |
      The end-user identity (see user.py). OpenInference's spelling, also what
      Langfuse reads and what the OTel registry lists; the sink additionally
      accepts OTel's enduser.id / enduser.pseudo.id from third-party instrumentors,
      but this SDK emits one name for one fact.

  - const: WORKSPACE_ROUTE
    blank_before: true  # formatting only: keeps the generated Python byte-identical
    key: rius.workspace
    symbol: attribute
    category: process_local
    level: vendor
    kinds: all
    fill: [native]
    type: string
    group: vendor
    status: shipped
    rationale: |
      Process-local routing marker for multi-workspace export (see workspace.py).
      Stamped at span start so pending snapshots route too, and ALWAYS stripped by
      the routing exporter before spans leave the process: the destination's API
      key is what tells the backend which workspace a span belongs to.

  - const: GEN_AI_OPERATION_NAME
    section: "OTel GenAI (subset we emit)"
    key: gen_ai.operation.name
    symbol: attribute
    category: identity
    level: required
    kinds:
      all_but: [CHAIN]
    fill: [native, openinference, vercel]
    type: string
    group: taxonomy
    status: shipped

  - const: GEN_AI_PROVIDER_NAME
    key: gen_ai.provider.name
    symbol: attribute
    category: identity
    level: conditionally_required
    level_note: when known
    kinds: [LLM, EMBEDDING]
    fill: [native, openinference, vercel]
    type: string
    group: model_call
    status: shipped

  - const: GEN_AI_REQUEST_MODEL
    key: gen_ai.request.model
    symbol: attribute
    category: identity
    level: conditionally_required
    level_note: when known
    kinds: [LLM, EMBEDDING]
    fill: [native, openinference, vercel]
    type: string
    group: model_call
    status: shipped

  - const: GEN_AI_REQUEST_REASONING_LEVEL
    key: gen_ai.request.reasoning.level
    symbol: attribute
    category: identity
    level: recommended
    kinds: [LLM]
    fill: [native]
    type: string
    group: model_call
    status: shipped

  - const: GEN_AI_RESPONSE_MODEL
    key: gen_ai.response.model
    symbol: attribute
    category: metadata
    level: recommended
    kinds: [LLM, EMBEDDING]
    fill: [native, openinference, vercel]
    type: string
    group: model_call
    status: shipped

  - const: GEN_AI_REQUEST_STREAM
    key: gen_ai.request.stream
    symbol: attribute
    category: identity
    level: conditionally_required
    level_note: when streaming
    kinds: [LLM]
    fill: [native, openinference]
    type: boolean
    group: model_call
    status: shipped
    rationale: |
      Streaming, per the GenAI inference-span conventions: gen_ai.request.stream
      (boolean, Conditionally Required when streaming) and
      gen_ai.response.time_to_first_chunk (double, seconds, "measured from request
      issuance", Recommended for streaming requests). Both are set by
      record_first_token: a first chunk arriving is what proves the request
      streamed, and the SDK has no earlier hook for it.

  - const: GEN_AI_RESPONSE_TIME_TO_FIRST_CHUNK
    key: gen_ai.response.time_to_first_chunk
    symbol: attribute
    category: metadata
    level: recommended
    level_note: when streaming
    kinds: [LLM]
    fill: [native, openinference]
    type: double
    group: model_call
    status: shipped

  - const: GEN_AI_USAGE_INPUT_TOKENS
    key: gen_ai.usage.input_tokens
    symbol: attribute
    category: metadata
    level: recommended
    kinds: [LLM]
    fill: [native, openinference, vercel]
    type: int
    group: usage
    status: shipped

  - const: GEN_AI_USAGE_OUTPUT_TOKENS
    key: gen_ai.usage.output_tokens
    symbol: attribute
    category: metadata
    level: recommended
    kinds: [LLM]
    fill: [native, openinference, vercel]
    type: int
    group: usage
    status: shipped

  - const: GEN_AI_USAGE_CACHE_READ_INPUT_TOKENS
    key: gen_ai.usage.cache_read.input_tokens
    symbol: attribute
    category: metadata
    level: recommended
    level_note: when applicable
    kinds: [LLM]
    fill: [native, openinference, vercel]
    type: int
    group: usage
    status: shipped

  - const: GEN_AI_USAGE_CACHE_WRITE_INPUT_TOKENS
    key: gen_ai.usage.cache_write.input_tokens
    symbol: attribute
    category: metadata
    level: recommended
    level_note: when applicable
    kinds: [LLM]
    fill: [native, openinference]
    type: int
    group: usage
    status: shipped
    rationale: |
      semconv-genai renamed cache_creation -> cache_write (PR #440) before our
      cache fields first shipped; SDKs 0.12.x emitted the pre-rename name.

  - const: GEN_AI_USAGE_REASONING_OUTPUT_TOKENS
    key: gen_ai.usage.reasoning.output_tokens
    symbol: attribute
    category: metadata
    level: recommended
    level_note: when applicable
    kinds: [LLM]
    fill: [native, openinference, vercel]
    type: int
    group: usage
    status: shipped

  - const: GEN_AI_INPUT_MESSAGES
    key: gen_ai.input.messages
    symbol: attribute
    category: content
    level: opt_in
    level_note: on by default
    kinds: [LLM]
    fill: [native, openinference, vercel]
    type: json
    group: content
    status: shipped

  - const: GEN_AI_OUTPUT_MESSAGES
    key: gen_ai.output.messages
    symbol: attribute
    category: content
    level: opt_in
    level_note: on by default
    kinds: [LLM]
    fill: [native, openinference, vercel]
    type: json
    group: content
    status: shipped

  - const: GEN_AI_RESPONSE_FINISH_REASONS
    key: gen_ai.response.finish_reasons
    symbol: attribute
    category: metadata
    level: recommended
    kinds: [LLM]
    fill: [native, openinference, vercel]
    type: string[]
    group: model_call
    status: shipped

  - const: GEN_AI_TOOL_NAME
    key: gen_ai.tool.name
    symbol: attribute
    category: identity
    level: required
    kinds: [TOOL]
    fill: [native, openinference, vercel]
    type: string
    group: tools
    status: shipped

  - const: GEN_AI_TOOL_DEFINITIONS
    key: gen_ai.tool.definitions
    symbol: attribute
    category: content
    level: opt_in
    kinds: [LLM]
    fill: [native, openinference, vercel]
    type: json
    group: content
    status: shipped
    rationale: |
      The request's tool/function definitions, serialized verbatim (provider
      shapes differ; the backend reads names and sizes from either). Content,
      not identity — listed in CONTENT_ATTRIBUTES below.

  - const: GEN_AI_AGENT_NAME
    key: gen_ai.agent.name
    symbol: attribute
    category: identity
    level: conditionally_required
    kinds: [AGENT]
    fill: [native]
    type: string
    group: agent
    status: planned
    ticket: RIUS-953, RIUS-954
    rationale: |
      Names the agent. RIUS-917 lists it twice: Recommended on the RESOURCE
      (RIUS-953, the durable fleet identity) and Conditionally Required on an
      AGENT span (RIUS-954, with an explicit way to name the agent at the call
      site). One key, two placements. The sink already reads both
      (argus-core apps/sink/internal/mapper.agentName).

  - const: GEN_AI_DATA_SOURCE_ID
    key: gen_ai.data_source.id
    symbol: attribute
    category: identity
    level: conditionally_required
    kinds: [RETRIEVER]
    fill: [native]
    type: string
    group: retrieval
    status: planned
    ticket: RIUS-957
    rationale: |
      The index or collection a retrieval hit. Pairs with the "retrieval"
      operation name, which RETRIEVER does not carry today.

  - const: MCP_METHOD_NAME
    key: mcp.method.name
    symbol: attribute
    category: identity
    level: required
    kinds: [MCP]
    fill: [native]
    type: string
    group: tools
    status: shipped
    rationale: |
      OTel MCP semantic conventions (semantic-conventions-genai, Development
      stability). mcp.method.name is the REQUIRED attribute of an MCP client span
      and the marker everything downstream keys on: a local TOOL span has the same
      kind, name and I/O shape, so this is what tells the two apart.

  - const: MCP_METHOD_TOOLS_CALL
    key: tools/call
    symbol: value
    of: MCP_METHOD_NAME
    status: shipped

  - const: MCP_PROTOCOL_VERSION
    key: mcp.protocol.version
    symbol: attribute
    category: identity
    level: recommended
    kinds: [MCP]
    fill: [native]
    type: string
    group: tools
    status: shipped
    rationale: |
      The version the initialize handshake negotiated — not the one we asked for.

  - const: ERROR_TYPE
    key: error.type
    symbol: attribute
    category: metadata
    level: conditionally_required
    level_note: on error
    kinds: all
    fill: [native, openinference, vercel]
    type: string
    group: errors
    status: shipped
    rationale: |
      OTel general error.type: on an MCP tools/call it is "tool_error" when the
      result carries isError (the tool ran and reported failure), else the
      exception class when the call itself raised.

  - const: ERROR_TYPE_TOOL_ERROR
    key: tool_error
    symbol: value
    of: ERROR_TYPE
    status: shipped

  - const: MCP_RESULT_TYPE
    key: mcp.result_type
    symbol: attribute
    category: identity
    level: vendor
    kinds: [MCP]
    kinds_note: interim rounds only
    fill: [native]
    type: string
    group: tools
    status: shipped
    rationale: |
      MCP spec 2026-07-28: a tools/call round can end with an interim
      "input_required" result (MRTR) instead of a final one. Set ONLY on interim
      rounds. NOT an OTel semconv attribute, unlike the two above: the key
      borrows the mcp SDK's own `mcp.*` spelling for its result-type field, and
      no convention defines it. Kept as-is because the backend reads it.

  - const: GEN_AI_REQUEST_PREFIX
    key: gen_ai.request.
    symbol: prefix
    category: identity
    level: recommended
    kinds: [LLM, EMBEDDING]
    fill: [native, openinference, vercel]
    group: model_call
    status: shipped
    covers: gen_ai.request.<param>

  - const: RIUS_REQUEST_PREFIX
    key: rius.request.
    symbol: prefix
    category: identity
    level: vendor
    kinds: [LLM]
    fill: [native]
    group: model_call
    status: planned
    ticket: RIUS-917
    covers: rius.request.<key>
    rationale: |
      Caller model parameters the GenAI spec does not define. Our own
      namespace, per the OTel naming guidance against prefixing an existing
      convention namespace with application-specific keys. Masking follows
      gen_ai.request.* exactly: neither is on the content allowlist today,
      and neither may be added alone.

  - const: RIUS_CONTEXT_SIZES
    key: rius.context.sizes
    symbol: attribute
    category: metadata
    level: vendor
    kinds: [LLM]
    fill: [native]
    type: json
    group: vendor
    status: shipped
    rationale: |
      Per-part byte sizes of a generation's context, as compact JSON with
      readable keys: tool_definitions (name, bytes), input_messages and
      output_messages (literal role, parts typed text / tool_call /
      tool_call_response with bytes and tool name), cache_marker, and a folded
      summary of older input; see _context_sizes.py for the full shape.
      A Rius vendor attribute, NOT a convention:
      the backend reads it to attribute gen_ai.usage.input_tokens across the
      context, and no convention describes context composition. Deliberately
      absent from CONTENT_ATTRIBUTES (it is sizes, not content, and must survive
      masking and capture_content=False — that is its whole point when the
      messages are truncated or stripped) and from PENDING_IDENTITY_ATTRIBUTES
      (content is unknown at span start, so a pending snapshot never has it).

  - const: GEN_AI_FIRST_TOKEN_EVENT
    section: "--- Span event names ---"
    key: gen_ai.first_token
    symbol: event
    category: metadata
    level: recommended
    level_note: when streaming
    kinds: [LLM]
    fill: [native, openinference]
    group: events
    status: shipped
    rationale: |
      First streamed token/chunk arrived: the exact timestamp the backend reads to
      derive TTFT (event time minus span start). The GenAI conventions express the
      same signal as the derived span attribute
      gen_ai.response.time_to_first_chunk (see above), which record_first_token
      emits alongside this event; the event stays because it is what the backend
      keys on, and an absolute timestamp is not recoverable from the duration
      once the span is stored. The name follows the gen_ai.* style (precedent
      Langfuse's completion_start_time); no convention defines an event for this.

  - const: RIUS_SPAN_PENDING
    section: "--- Pending (partial) spans ---"
    key: rius.span.pending
    symbol: attribute
    category: identity
    level: vendor
    kinds: all
    fill: [native]
    type: boolean
    group: vendor
    status: shipped
    rationale: |
      Marks the content-free snapshot exported at span START; the backend maps it
      to Finished=0 and the real span replaces it at end. This key knowingly bends
      the convention-native rule (no vendor namespace): OpenTelemetry has NO
      pending-span mechanism to align with (spec #3732/#4646, semconv #2133, all
      open, none planned), and the only shipping precedent (Logfire's
      logfire.span_type) is equally vendor-namespaced. Spelled glassflow.span.pending
      before the vendor keys moved under rius.*; the backend reads both spellings
      for as long as pre-rename SDK versions are in the field.

  - const: LLM_INVOCATION_PARAMETERS
    key: llm.invocation_parameters
    symbol: attribute
    category: content
    level: vendor
    kinds: [LLM]
    fill: [openinference]
    type: json
    group: partial_content
    status: shipped
    rationale: |
      The request-parameters bag OpenInference instrumentors emit. Not wholly
      content — sampling parameters are identity — but the litellm and langchain
      instrumentations embed the request's tools/functions arrays inside it, so
      masking redacts those members and keeps the rest (see masking.py).
