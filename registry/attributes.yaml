  - const: GEN_AI_DATA_SOURCE_ID
    key: gen_ai.data_source.id
    symbol: attribute
    origin: otel
    kinds: [RETRIEVER]
    category: identity
    level: conditionally_required
    level_note: when the retrieval has a single identifiable data source
    type: string
    fill: [native]
    rationale: |
      The index, collection or knowledge base a retrieval ran against. Identity,
      set at span creation: it is what a retriever span is named after and the
      only thing that distinguishes two otherwise identical searches.

  - const: GEN_AI_RETRIEVAL_TOP_K
    key: gen_ai.retrieval.top_k
    symbol: attribute
    origin: otel
    kinds: [RETRIEVER]
    category: identity
    level: recommended
    type: int
    fill: [native]
    rationale: |
      How many documents the retriever was ASKED for, the spec's own framing
      ("also known as k, limit, or max_num_results"). Identity: it is a property
      of the request, known before the search runs, so it rides pending snapshots.

  - const: GEN_AI_RETRIEVAL_DOCUMENTS
    key: gen_ai.retrieval.documents
    symbol: attribute
    origin: otel
    kinds: [RETRIEVER]
    category: metadata
    level: recommended
    type: json
    fill: [native]
    rationale: |
      What the retriever RETURNED, as the conventions define it: a JSON array of
      objects each with an optional `id` and an optional `score`. Identifiers and
      relevance only, never document text, which is why the spec does not mark it
      sensitive and why it is NOT on the content allowlist. It is metadata: known
      only once the search has run, so it never reaches a pending snapshot, and
      it survives capture_content=False because a document id is not content.

  # --- MCP and errors ------------------------------------------------------

  - const: MCP_METHOD_NAME
    key: mcp.method.name
    symbol: attribute
    origin: otel
    kinds: [TOOL]
    category: identity
    level: required
    level_note: on a TOOL span that is an MCP client call
    type: string
    fill: [native]
    rationale: |
      OTel MCP semantic conventions (semantic-conventions-genai, Development
      stability). mcp.method.name is the REQUIRED attribute of an MCP client span
      and the marker everything downstream keys on: a local TOOL span has the same
      kind, name and I/O shape, so this is what tells the two apart.

  - const: MCP_METHOD_TOOLS_CALL
    key: tools/call
    symbol: value
    of: MCP_METHOD_NAME

  - const: MCP_PROTOCOL_VERSION
    key: mcp.protocol.version
    symbol: attribute
    origin: otel
    kinds: [TOOL]
    category: identity
    level: recommended
    level_note: on a TOOL span that is an MCP client call
    type: string
    fill: [native]
    rationale: |
      The version the initialize handshake negotiated — not the one we asked for.

  - const: ERROR_TYPE
    key: error.type
    symbol: attribute
    origin: otel
    kinds: all
    category: metadata
    level: conditionally_required
    level_note: on error
    type: string
    fill: [native, openinference, vercel]
    rationale: |
      OTel general error.type: on an MCP tools/call it is "tool_error" when the
      result carries isError (the tool ran and reported failure), else the
      exception class when the call itself raised.

  - const: ERROR_TYPE_TOOL_ERROR
    key: tool_error
    symbol: value
    of: ERROR_TYPE

  - const: EXCEPTION_EVENT
    key: exception
    symbol: event
    origin: otel
    direction: read
    rationale: |
      The OTel exception event, as record_exception() writes it, and its attribute
      naming the exception's class. Read, never emitted by us directly: an
      auto-instrumented failure carries these but no error.type, so normalization
      derives error.type from EXCEPTION_TYPE.

  - const: EXCEPTION_TYPE
    key: exception.type
    symbol: attribute
    origin: otel
    direction: read
    kinds: all
    category: metadata
    type: string
    fill: [openinference, vercel]
    note: an attribute of the exception EVENT, not of the span

  - const: MCP_RESULT_TYPE
    key: mcp.result_type
    brief: "Result type of an MCP tools/call round that ended with an interim result instead of a final one."
    stability: development
    examples: ["input_required"]
    symbol: attribute
    origin: rius
    namespace_exception: |
      Predates the rule. The key borrows the mcp SDK's own `mcp.*` spelling for
      its result-type field, and the backend reads it under this name.
    kinds: [TOOL]
    category: identity
    level: vendor
    level_note: interim tools/call rounds only
    type: string
    fill: [native]
    not_pending: |
      Set when an interim round ENDS, so it is never known at span start and a
      pending snapshot has nothing to carry.
    rationale: |
      MCP spec 2026-07-28: a tools/call round can end with an interim
      "input_required" result (MRTR) instead of a final one. Set ONLY on interim
      rounds. NOT an OTel semconv attribute, unlike the two above: the key
      borrows the mcp SDK's own `mcp.*` spelling for its result-type field, and
      no convention defines it. Kept as-is because the backend reads it.

  # --- Request-parameter namespaces ----------------------------------------

  - const: GEN_AI_REQUEST_PREFIX
    key: gen_ai.request.
    symbol: prefix
    origin: otel
    covers: gen_ai.request.<parameter>

  - const: RIUS_REQUEST_PREFIX
    key: rius.request.
    brief: "A request parameter the GenAI conventions do not define, keyed by the parameter's name as the caller spelled it."
    stability: development
    examples: ["flex", true, '{"type":"json_object"}']
    symbol: prefix
    origin: rius
    covers: rius.request.<parameter>
    rationale: |
      Where a request parameter the GenAI registry does NOT define goes. Our own
      namespace rather than gen_ai.request.<key>, per OTel's naming guidance: an
      existing semantic-convention namespace must not be used as a prefix for
      application-specific attributes, because the convention is free to define
      that exact key later and mean something else. The GenAI conventions offer
      no catch-all of their own, so we own one.

      Masking: rius.request.* follows gen_ai.request.* exactly. Today neither is
      in CONTENT_ATTRIBUTES, so both export in clear. The TIE is the rule, not
      the current value — if request parameters ever become maskable, both
      namespaces change together, and neither may join the content allowlist
      alone.

  - const: RIUS_REQUEST_TOOL_CHOICE
    key: rius.request.tool_choice
    brief: "How the request constrained tool use: a mode string, or the provider's forced-call object as compact JSON."
    stability: development
    examples: ["auto", "required", '{"type":"function","function":{"name":"get_weather"}}']
    symbol: attribute
    origin: rius
    kinds: [LLM]
    category: identity
    level: vendor
    type: string
    fill: [native, openinference]
    rationale: |
      How the request constrained tool use: a mode string ("auto", "required")
      or, for a forced call, the provider's object as compact JSON. The GenAI
      conventions define no tool_choice, so it lives in our namespace. Context
      attribution reads it to price the tool-use preamble, which is why the
      normalizer lifts it out of the OpenInference request bag (content) into
      here (not content).

  # --- Usage namespaces ----------------------------------------------------

  - const: GEN_AI_USAGE_PREFIX
    key: gen_ai.usage.
    symbol: prefix
    origin: otel
    covers: gen_ai.usage.<usage key>
    shipped_in: [python, typescript]
    divergence: |
      The SDKs match the usage family by prefix, to move it to
      rius.aggregated_usage.* (see RIUS_AGGREGATED_USAGE_PREFIX). The sink
      names each usage key on its own.

  - const: RIUS_AGGREGATED_USAGE_PREFIX
    key: rius.aggregated_usage.
    type: int
    brief: "A whole agent run's token usage, moved off gen_ai.usage.* so per-call usage is not counted twice; the suffix is the gen_ai.usage.* suffix."
    stability: development
    examples: [115, 42]
    symbol: prefix
    origin: rius
    covers: rius.aggregated_usage.<usage key suffix>
    shipped_in: [python, typescript]
    divergence: |
      Each SDK writes it for the producers it instruments: TypeScript for the
      Vercel AI SDK v7 (@ai-sdk/otel), Python for LiteLLM spans whose OpenAI
      child recorded the same call. The sink adds the key when the trace
      view displays the aggregate.
    rationale: |
      Where a whole agent run's token usage goes when the same producer also
      reports each model call's usage on that call's own span:
      gen_ai.usage.<suffix> becomes rius.aggregated_usage.<suffix>, on the
      in-process (INTERNAL) invoke_agent span only. Left under gen_ai.usage.*,
      the run's tokens are counted once per call span and once more on the
      agent span by any backend that sums usage across spans.

      Applied only to producers KNOWN to repeat the usage on per-call spans,
      because a span on its own cannot say whether its usage is an aggregate
      or the only record. CLIENT invoke_agent spans keep their usage: a remote
      agent's model calls are not in the trace.

      The same move covers a wrapper span that repeats ONE call's usage: a
      LiteLLM completion span whose child, the openai instrumentor's
      ChatCompletion span, records the call. The child keeps gen_ai.usage.*,
      since it is the call itself. Decided from end order (a child ends
      before its parent), so a LiteLLM span with no such child keeps its usage.

      Our namespace, not pydantic-ai's gen_ai.aggregated_usage.*: the GenAI
      conventions define no aggregate yet (semantic-conventions-genai#19), and
      one could be defined later with different semantics (sub-agents included
      or not). A backend reads both spellings, for display only; totals read
      gen_ai.usage.* alone.

  # --- Rius vendor keys ----------------------------------------------------

  - const: RIUS_CONTEXT_SIZES
    key: rius.context.sizes
    brief: "Byte sizes of each part of a generation's context (tool definitions, input and output messages), as compact JSON."
    stability: development
    examples: ['{"version":1,"input_messages":[{"role":"system","parts":[{"type":"text","bytes":19}]},{"role":"user","parts":[{"type":"text","bytes":18}]}],"output_messages":[{"role":"assistant","parts":[{"type":"text","bytes":6}]}]}']
    symbol: attribute
    origin: rius
    kinds: [LLM]
    category: metadata
    level: vendor
    type: json
    fill: [native]
    rationale: |
      Per-part byte sizes of a generation's context, as compact JSON with
      readable keys: tool_definitions (name, bytes), input_messages and
      output_messages (literal role, parts typed text / tool_call /
      tool_call_response with bytes and tool name), cache_marker, and a folded
      summary of older input.
      A Rius vendor attribute, NOT a convention:
      the backend reads it to attribute gen_ai.usage.input_tokens across the
      context, and no convention describes context composition. Deliberately
      absent from CONTENT_ATTRIBUTES (it is sizes, not content, and must survive
      masking and capture_content=False — that is its whole point when the
      messages are truncated or stripped) and from PENDING_IDENTITY_ATTRIBUTES
      (content is unknown at span start, so a pending snapshot never has it).

  - const: GEN_AI_FIRST_TOKEN_EVENT
    section: "--- Span event names ---"
    key: gen_ai.first_token
    brief: "The first streamed token or chunk of a generation arrived."
    stability: development
    symbol: event
    origin: rius
    namespace_exception: |
      Predates the rule, and a rename is a wire change the backend keys on. No
      convention defines an event for the first streamed token.
    rationale: |
      First streamed token/chunk arrived: the exact timestamp the backend reads to
      derive TTFT (event time minus span start). The GenAI conventions express the
      same signal as the derived span attribute
      gen_ai.response.time_to_first_chunk, which record_first_token emits
      alongside this event; the event stays because it is what the backend
      keys on, and an absolute timestamp is not recoverable from the duration
      once the span is stored. The name follows the gen_ai.* style (precedent
      Langfuse's completion_start_time); no convention defines an event for this.

  - const: RIUS_SPAN_PENDING
    section: "--- Pending (partial) spans ---"
    key: rius.span.pending
    brief: "Marks the content-free snapshot of a span that is exported when the span starts, before the real span ends."
    stability: development
    examples: [true]
    symbol: attribute
    origin: rius
    kinds: all
    category: identity
    level: vendor
    type: boolean
    fill: [native]
    not_pending: |
      The snapshot builder stamps this marker onto the snapshot; it is not
      copied from the span, so listing it in PENDING_IDENTITY_ATTRIBUTES would
      be a no-op at best and a double write at worst.
    rationale: |
      Marks the content-free snapshot exported at span START; the backend maps it
      to Finished=0 and the real span replaces it at end. This key knowingly bends
      the convention-native rule (no vendor namespace): OpenTelemetry has NO
      pending-span mechanism to align with (spec #3732/#4646, semconv #2133, all
      open, none planned), and the only shipping precedent (Logfire's
      logfire.span_type) is equally vendor-namespaced. Spelled glassflow.span.pending
      before the vendor keys moved under rius.*; the backend reads both spellings
      for as long as pre-rename SDK versions are in the field.

  - const: RIUS_PARENT_FOREIGN
    section: "--- Another SDK's tracer provider in the process ---"
    key: rius.parent.foreign
    brief: "The span's parent is local to this process but was never received by Rius, so the trace arrives without it."
    stability: development
    examples: [true]
    symbol: attribute
    origin: rius
    kinds: all
    category: identity
    level: vendor
    type: boolean
    fill: [native]
    not_pending: |
      Set at span start but not on PENDING_IDENTITY_ATTRIBUTES in either SDK
      today, so a pending snapshot does not carry it. Recorded as found; whether
      the live view needs it is an SDK decision.
    rationale: |
      On a span: its parent is local to this process, yet rius never received
      it, so the trace arrives without that parent. Remote parents are never
      flagged.

  - const: RIUS_SDK_GLOBAL_PROVIDER
    key: rius.sdk.global_provider
    brief: "The tracer provider that already held the OpenTelemetry global when Rius initialized, as foreign:<class>."
    stability: development
    examples: ["foreign:opentelemetry.sdk.trace.TracerProvider", "foreign:NodeTracerProvider"]
    symbol: attribute
    origin: rius
    kinds: resource
    level: vendor
    type: string
    fill: [native]
    rationale: |
      On the resource: foreign:<module.Class> when another provider already
      held the OpenTelemetry global at init(). Absent when rius registered the
      global.

  - const: LLM_INVOCATION_PARAMETERS
    key: llm.invocation_parameters
    brief: "The request parameters an OpenInference instrumentor recorded, as one JSON object."
    stability: development
    examples: ['{"model": "gpt-4o-mini", "max_tokens": 64, "temperature": 0.2}']
    symbol: attribute
    origin: openinference
    direction: read
    kinds: [LLM]
    category: content
    type: json
    fill: [openinference]
    rationale: |
      The request-parameters bag OpenInference instrumentors emit.

  - const: LLM_INPUT_MESSAGES_PREFIX
    key: llm.input_messages.
    symbol: prefix
    origin: openinference
    direction: read
    covers: llm.input_messages.<i>.<message field>
    shipped_in: [typescript]
    divergence: &flattened_messages_divergence |
      The Python SDK keeps the same strings private in normalization.py rather
      than in semconv.py. Moving them there would let this row ship in Python
      too.
    rationale: |
      OpenInference's flattened message families, read by normalization and
      reassembled into gen_ai.input.messages / gen_ai.output.messages: one key
      per field, <prefix><i>.message.role,
      ...message.tool_calls.<j>.tool_call.id,
      ...message.contents.<k>.message_content.type and so on. Source spellings,
      never emitted.

  - const: LLM_OUTPUT_MESSAGES_PREFIX
    key: llm.output_messages.
    symbol: prefix
    origin: openinference
    direction: read
    covers: llm.output_messages.<i>.<message field>
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence

  - const: LLM_MESSAGE_ROLE
    key: message.role
    symbol: fragment
    origin: openinference
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence
    rationale: |
      The message fields read, relative to <prefix><i>.

  - const: LLM_MESSAGE_CONTENT
    key: message.content
    symbol: fragment
    origin: openinference
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence

  - const: LLM_MESSAGE_TOOL_CALL_ID
    key: message.tool_call_id
    symbol: fragment
    origin: openinference
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence

  - const: LLM_MESSAGE_TOOL_CALLS_PREFIX
    key: message.tool_calls.
    symbol: fragment
    origin: openinference
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence
    rationale: |
      A message's tool calls: message.tool_calls.<j>.tool_call.<field>.

  - const: LLM_TOOL_CALL_PREFIX
    key: tool_call.
    symbol: fragment
    origin: openinference
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence

  - const: LLM_TOOL_CALL_ID
    key: id
    symbol: fragment
    origin: openinference
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence
    rationale: |
      Tool-call fields relative to tool_call.

  - const: LLM_TOOL_CALL_FUNCTION_NAME
    key: function.name
    symbol: fragment
    origin: openinference
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence

  - const: LLM_TOOL_CALL_FUNCTION_ARGUMENTS
    key: function.arguments
    symbol: fragment
    origin: openinference
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence

  - const: LLM_MESSAGE_CONTENTS_PREFIX
    key: message.contents.
    symbol: fragment
    origin: openinference
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence
    rationale: |
      A message's multimodal items:
      message.contents.<k>.message_content.<field>, plus
      message.contents.<k>.tool_call.<field> on a tool_use item.

  - const: LLM_MESSAGE_CONTENT_PREFIX
    key: message_content.
    symbol: fragment
    origin: openinference
    shipped_in: [typescript]
    divergence: *flattened_messages_divergence

  - const: CHAIN_SPAN_NAME
    key: chain
    symbol: name
    rationale: |
      The name of a span whose kind has no operation and nothing else to compose
      from. The conventions define no operation for a generic workflow step, and
      the manual span helpers see nothing but the kind. A literal beats an empty
      name.

passthrough:
  - key: gen_ai.conversation.id
    origin: otel
    upstream: genai
    rationale: |
      pydantic-ai writes it. Neither SDK emits or rewrites it: they write
      session.id, one name for one fact. The Rius backend falls back to it for
      session.id (tools/go_reference_only.yaml, GenAIConversationID).

retired:
  - key: glassflow.span.pending
    brief: "Former spelling of rius.span.pending."
    stability: development
    examples: [true]
    deprecated:
      reason: renamed
      renamed_to: rius.span.pending
      note: |
        Renamed when the vendor keys moved under rius.*. Both SDKs emit
        rius.span.pending from 1.0.0; a backend reads both spellings for as
        long as older SDK versions are in the field.
    symbol: attribute
    origin: rius
    kinds: all
    category: identity
    type: boolean
    rationale: |
      Marked the content-free snapshot exported at span start, as
      rius.span.pending does now. Kept so a reader of older spans can tell
      what the key was.
