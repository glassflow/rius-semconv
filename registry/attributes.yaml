# The Rius attribute registry: every named wire string the SDKs and the sink
# share, one row per constant.
#
# Level with rius-sdk-python src/rius/semconv.py (the reference implementation)
# and rius-sdk-typescript src/semconv.ts on their `main` branches. Where the two
# SDKs disagree, the row says so with `shipped_in` and `divergence` rather than
# picking a winner silently. tools/check_parity.py proves both claims.
#
# Rows are emitted in file order. Order carries no meaning beyond readability.
#
# Columns (the README has the long form)
#
#   const        Constant name in Python and TypeScript. Required, unique.
#   go           Go identifier, when the derived PascalCase name is not the one
#                the Rius backend already uses.
#   key          The wire string. Required.
#   symbol       What the string is:
#                  attribute  an attribute key (span or resource)
#                  prefix     a key prefix, matched with startswith
#                  event      a span event name
#                  value      an enumerated VALUE of some attribute (`of:`)
#                  scope      the instrumentation scope name
#                  name       a span name
#                  fragment   a piece of a key, read relative to a prefix
#                             (OpenInference's flattened message fields)
#   origin       Who defines the key:
#                  otel           an OpenTelemetry convention (general, GenAI, MCP)
#                  openinference  the OpenInference conventions
#                  rius           ours. Must live under rius.*, or carry a
#                                 `namespace_exception` saying why it does not.
#   direction    emitted (default): the SDKs write it.
#                read: the SDKs only ever READ it, from other producers' spans.
#   kinds        Where an attribute lives: `resource`, `all`, `{all_but: [...]}`,
#                or a list of span kinds (AGENT LLM TOOL RETRIEVER EMBEDDING CHAIN).
#   category     Span attributes only, never resource ones:
#                  identity       known at span start, rides pending snapshots
#                  content        what was said; masked or stripped at export
#                  metadata       known only once the work ran; survives masking
#                  process_local  never leaves the process
#   level        required | conditionally_required | recommended | opt_in | vendor
#   level_note   The condition, for conditionally_required and opt_in.
#   type         string | boolean | int | double | string[] | json
#   fill         Which producers populate it: native (our SDKs), openinference,
#                vercel (the AI SDK's ai.* telemetry, via normalization).
#   placements   For a key that means different things in different places.
#                One entry per meaning; see gen_ai.agent.name.
#   not_pending  An identity attribute that is NOT on the pending allowlist and
#                not covered by a pending prefix must say why here.
#   status       shipped (default) | planned. Planned rows are decisions no SDK
#                ships yet. Generators skip them unless --include-planned.
#   shipped_in   Languages the row is generated for, when not all of
#                [python, typescript, go]. Requires `divergence`.
#   divergence   Why the row is not in every language.
#   ts_alias     {name, from}: TypeScript re-exports an upstream constant
#                instead of restating the literal.
#   section      A heading comment emitted above the row.
#   rationale    Prose, emitted as a comment above the constant in every
#                language. Line breaks are authored, not reflowed.
#
# Columns for the Weaver registry (tools/to_weaver.py writes model/ from this
# file). The generators do not read them.
#
#   brief        One plain line saying what the key means. Required on every
#                key model/ defines (`origin: rius` attributes, prefixes and
#                events, and OpenInference attributes no upstream registry
#                defines); not allowed on a key model/ references, whose brief
#                is upstream's.
#   examples     Realistic values. Required where brief is, except on events.
#   stability    development | stable. Required where brief is. Every Rius
#                key starts in development.
#   type         On a `prefix` row: the type of every key under the prefix.
#   deprecated   {reason, renamed_to, note}, as Weaver spells it. reason is
#                renamed (with renamed_to, a key in this file), obsoleted or
#                uncategorized; note says why. See CONTRIBUTING.md,
#                "Deprecation and compatibility". An uncategorized key that
#                moved to an upstream key names it in replaced_by (an
#                upstream row in this file), which Weaver's renamed_to cannot
#                point at; it rides the `rius` annotation, for the docs.
#   upstream_equivalent
#                An upstream key that now names the same fact as this Rius
#                key, which the key is planned to move to. Recorded for the
#                docs; it does not deprecate the row. Not allowed on a
#                deprecated row: the deprecation note names the upstream key.
#
#   upstream     core | genai, on a row whose key an upstream registry defines
#                although `origin` names another source (session.id, user.id).
#                Such a row, like every `origin: otel` attribute, is a ref to
#                the upstream definition in model/, never a definition of ours.
#   values_from  The taxonomy table whose values are this attribute's enum
#                members in model/ (openinference.span.kind: span_kind).
#   upstream_divergence
#                {type, note}: where this row's type differs from the upstream
#                definition the ref points at, and why.
#
# `passthrough:`, after the rows, lists upstream keys other producers put on
# spans that Rius stores, which no SDK emits or rewrites, so they have no row
# and no constant. Each says who writes it and who reads it.
#
# `retired:`, after the rows, lists deprecated keys that have no generated
# constant any more (or never had one). They are never generated; they are
# kept so readers, the docs and Weaver still recognise the key.

attributes:
  - const: TRACER_NAME
    key: rius
    symbol: scope
    origin: rius
    namespace_exception: |
      A scope name, not an attribute key, so there is no namespace to be in.
    shipped_in: [python, typescript]
    divergence: |
      The sink deliberately names no instrumentation scope: it stores
      whatever scope name arrives and no reader keys on it.
    rationale: |
      Instrumentation scope name (stamped on every span as otel.scope.name).
      "rius" since the vendor keys were normalized under the product name; it was
      "glassflow" before. Wire-visible, but nothing in the backend keys on it: the
      sink stores the scope name verbatim and no reader filters on it, so the two
      values coexist in stored data without any special handling.

  # --- Resource attributes -------------------------------------------------

  - const: SERVICE_NAME
    section: "--- Resource attribute keys ---"
    key: service.name
    symbol: attribute
    origin: otel
    kinds: resource
    level: required
    type: string
    fill: [native]
    shipped_in: [go]
    divergence: |
      Both SDKs set service.name through the OpenTelemetry SDK's own resource
      handling and name no constant for it; the sink reads it by this constant.
    rationale: |
      OTel standard logical service name. The backend falls back to it when a
      process names no agent.

  - const: SERVICE_INSTANCE_ID
    key: service.instance.id
    symbol: attribute
    origin: otel
    kinds: resource
    level: required
    type: string
    fill: [native]
    rationale: |
      OTel standard identity of one process lifetime (one uuid per client, minted
      at init). The heartbeat payload's instance_id carries the SAME value, which
      is what lets the backend join heartbeats to traces and count replicas.

  - const: SERVICE_VERSION
    key: service.version
    symbol: attribute
    origin: otel
    kinds: resource
    level: recommended
    type: string
    fill: [native]
    ts_alias:
      name: ATTR_SERVICE_VERSION
      from: "@opentelemetry/semantic-conventions"
    rationale: |
      OTel standard version of the deployed service. Metadata about the process,
      not about any one span. Stamped only when a version is actually known: there
      is deliberately no placeholder default, because a fake one merges every
      deployment into a single bucket — the same mistake `unknown_service` makes
      for service.name.

  - const: TELEMETRY_DISTRO_NAME
    key: telemetry.distro.name
    symbol: attribute
    origin: otel
    kinds: resource
    level: required
    type: string
    fill: [native]
    status: planned
    rationale: |
      Names the distribution that exported the span. Both SDKs set it today as
      an inline literal with no semconv constant, which is why the row is
      planned rather than shipped.

  - const: TELEMETRY_DISTRO_VERSION
    key: telemetry.distro.version
    symbol: attribute
    origin: otel
    kinds: resource
    level: required
    type: string
    fill: [native]
    status: planned
    rationale: |
      The SDK version that exported the span. Inline literal in both SDKs today,
      like telemetry.distro.name.

  - const: GEN_AI_AGENT_NAME
    key: gen_ai.agent.name
    symbol: attribute
    origin: otel
    kinds: [AGENT, TOOL]
    category: identity
    level: conditionally_required
    level_note: when the agent is known
    type: string
    fill: [native]
    placements:
      - scope: resource
        level: recommended
        brief: the agent this PROCESS is
      - scope: span
        when: {operation: invoke_agent}
        kinds: [AGENT]
        level: conditionally_required
        brief: the agent BEING INVOKED
      - scope: span
        when: {operation: execute_tool}
        kinds: [TOOL]
        level: conditionally_required
        brief: the agent EXECUTING the tool
    rationale: |
      The agent this process IS, stamped once on the resource so every span it
      emits groups under the same name its heartbeats do. Without it the backend
      falls through to service.name per span, and a process whose agent name
      differs from its service name has its agents view and its trace list
      disagreeing about what it is called.

  - const: GEN_AI_AGENT_ID
    key: gen_ai.agent.id
    symbol: attribute
    origin: otel
    kinds: [AGENT]
    category: identity
    level: conditionally_required
    level_note: when the invoked agent is a hosted resource with an id
    type: string
    fill: [native]
    rationale: |
      The identifier of a HOSTED agent resource, not of an agent in general: the
      conventions give an AWS Bedrock agent ARN and a GCP Agent Registry id as the
      examples, and say it is NOT RECOMMENDED to record in-memory agent instance
      ids here, because those are transient. So an in-process agent leaves it
      unset and there is no configured default to fall back to — a name is the
      only identity such an agent has. Adopted rather than deferred because the
      callers who do run hosted agents have nowhere else to put the id.

  - const: GEN_AI_AGENT_VERSION
    key: gen_ai.agent.version
    symbol: attribute
    origin: otel
    kinds: [AGENT]
    category: identity
    level: recommended
    type: string
    fill: [native]
    rationale: |
      The version of the agent an AGENT span INVOKED — the same callee
      gen_ai.agent.name and gen_ai.agent.id describe on that span, never
      the process's own version and never service.version. Registry type is a
      plain string and the conventions' own examples are "1.0.0" and "2025-05-01",
      so the caller's value is taken verbatim: there is no format to validate.

  - const: GEN_AI_MAIN_AGENT_NAME
    section: |
      --- The MAIN agent: the agent this PROCESS is ---
      gen_ai.agent.name has no resource-level meaning in the conventions, and ON A
      SPAN it means the agent being INVOKED: one key answering two different
      questions, told apart only by which of a resource and a span you happen to be
      reading. The GenAI conventions' gen_ai.main_agent entity answers the
      process-level question: "the process emitting this telemetry IS this agent",
      once per OTLP batch. rius.main_agent.{name,id,description} answered it
      before the conventions did, and are deprecated in favour of these keys;
      the SDKs stamp both families through the deprecation window.

      gen_ai.agent.name stays on the resource alongside them, deliberately: a swap
      would be a flag day, breaking agent identity for every deployment running an
      SDK newer than the sink. Resource attributes ride once per batch, not per
      span, so carrying all of them costs essentially nothing.
    key: gen_ai.main_agent.name
    symbol: attribute
    origin: otel
    kinds: resource
    level: recommended
    type: string
    fill: [native]
    rationale: |
      The name of the agent this process is, from the same setting as
      gen_ai.agent.name on the resource, and suppressed the same way: a process
      whose name is the unknown_service placeholder stamps none. Emitted only
      with gen_ai.main_agent.id, because the conventions make the id the
      entity's identity and say the entity is not emitted without one.
      Replaces rius.main_agent.name.

  - const: GEN_AI_MAIN_AGENT_ID
    key: gen_ai.main_agent.id
    symbol: attribute
    origin: otel
    kinds: resource
    level: conditionally_required
    level_note: always, whenever the main-agent entity is emitted
    type: string
    fill: [native]
    rationale: |
      The stable identifier of the agent this process is, and the identity of
      the conventions' gen_ai.main_agent entity: no id, no entity. It is the
      configured main-agent id when one is set (the SDK setting, or a
      gen_ai.main_agent.id the operator already put on the resource),
      otherwise the resolved agent name as is. The name is stable across
      restarts and readable, which a generated id would not be; the
      conventions say it MUST NOT come from an in-memory or process-local id.
      A name-derived id meets that MUST but not the conventions' SHOULD that
      the id be the provider-assigned identifier of the agent resource (a
      Bedrock ARN, a GCP Agent Registry id): configure the main-agent id as
      one when there is one. Renaming the agent changes a derived id, so the
      SDKs log a one-time hint that a stable id can be set. With neither an id
      nor a usable name (empty, or the unknown_service placeholder), no
      gen_ai.main_agent.* key is emitted at all.

      Replaces rius.main_agent.id, which was only ever the configured id: the
      derived value is never copied into it.

  - const: GEN_AI_MAIN_AGENT_DESCRIPTION
    key: gen_ai.main_agent.description
    symbol: attribute
    origin: otel
    kinds: resource
    level: recommended
    type: string
    fill: [native]
    rationale: |
      What the agent this process is does, in free text. Stamped only when
      configured, and only with gen_ai.main_agent.id. Replaces
      rius.main_agent.description.

  - const: RIUS_MAIN_AGENT_NAME
    key: rius.main_agent.name
    brief: "Name of the agent this process is, stamped once on the resource."
    stability: development
    examples: ["weather-agent", "support-triage"]
    deprecated:
      reason: uncategorized
      replaced_by: gen_ai.main_agent.name
      note: |
        Moved to gen_ai.main_agent.name, which the OpenTelemetry GenAI
        conventions now define for the same fact. The SDKs stamp both through
        the deprecation window; readers take gen_ai.main_agent.name first.
    symbol: attribute
    origin: rius
    kinds: resource
    level: vendor
    type: string
    fill: [native]
    rationale: |
      Deprecated: moved to gen_ai.main_agent.name.
      Named the agent this process is before the conventions had a key for it.

  - const: RIUS_MAIN_AGENT_ID
    key: rius.main_agent.id
    brief: "Stable identifier of the agent this process is, unchanged across restarts and deployments."
    stability: development
    examples: ["support-triage-prod", "8f14e45f-ceea-467a-9575-4c0d6f6c1b9e"]
    deprecated:
      reason: uncategorized
      replaced_by: gen_ai.main_agent.id
      note: |
        Moved to gen_ai.main_agent.id, which the OpenTelemetry GenAI
        conventions now define for the same fact. The SDKs stamp both through
        the deprecation window; readers take gen_ai.main_agent.id first. This
        key only ever carried a configured id, while gen_ai.main_agent.id falls
        back to the agent name when none is configured.
    symbol: attribute
    origin: rius
    kinds: resource
    level: vendor
    type: string
    fill: [native]
    rationale: |
      Deprecated: moved to gen_ai.main_agent.id.
      Took the same stability constraint the conventions put on gen_ai.agent.id:
      a transient in-memory or process-local id here would mint a new "agent"
      every restart and make the key useless for grouping.

  - const: RIUS_MAIN_AGENT_DESCRIPTION
    key: rius.main_agent.description
    brief: "What the agent this process is does, in free text."
    stability: development
    examples: ["Answers weather questions for a named city."]
    deprecated:
      reason: uncategorized
      replaced_by: gen_ai.main_agent.description
      note: |
        Moved to gen_ai.main_agent.description, which the OpenTelemetry GenAI
        conventions now define for the same fact. The SDKs stamp both through
        the deprecation window; readers take gen_ai.main_agent.description first.
    symbol: attribute
    origin: rius
    kinds: resource
    level: vendor
    type: string
    fill: [native]
    rationale: |
      Deprecated: moved to gen_ai.main_agent.description.

  - const: RIUS_MAIN_AGENT_VERSION
    key: rius.main_agent.version
    brief: "Version of the agent definition (prompt, tools and policy) this process runs, independent of service.version."
    stability: development
    examples: ["7", "2026-10-01"]
    symbol: attribute
    origin: rius
    kinds: resource
    level: vendor
    type: string
    fill: [native]
    rationale: |
      The version of the agent DEFINITION — its prompt, tools and policy — which is
      deliberately NOT service.version. A service can sit at 2.3.1 while its
      agent definition is at 7, and the two move independently; deriving either
      from the other produces confidently wrong data on every deployment where
      they disagree, which is most of them.

  # --- Span attributes: OpenInference and correlation ----------------------

  - const: OPENINFERENCE_SPAN_KIND
    section: |
      --- Attribute keys ---
      OpenInference
    go: OpenInferenceSpanKind
    key: openinference.span.kind
    brief: "The OpenInference span kind, which is the Rius span taxonomy."
    values_from: span_kind
    stability: development
    examples: ["LLM", "AGENT"]
    symbol: attribute
    origin: openinference
    kinds: all
    category: identity
    level: required
    type: string
    fill: [native, openinference, vercel]

  - const: INPUT_VALUE
    key: input.value
    brief: "The input of an agent, tool, retriever or chain step, as text or JSON."
    stability: development
    examples: ['{"args":["Weather in Paris?"],"kwargs":{}}', "What is the weather in Paris?"]
    symbol: attribute
    origin: openinference
    kinds: [AGENT, TOOL, RETRIEVER, CHAIN]
    category: content
    level: vendor
    type: string
    fill: [native, openinference, vercel]

  - const: OUTPUT_VALUE
    key: output.value
    brief: "The output of an agent, tool, retriever or chain step, as text or JSON."
    stability: development
    examples: ["sunny, 22C", '{"temperature_c":22}']
    symbol: attribute
    origin: openinference
    kinds: [AGENT, TOOL, RETRIEVER, CHAIN]
    category: content
    level: vendor
    type: string
    fill: [native, openinference, vercel]

  - const: SESSION_ID
    key: session.id
    upstream: core
    symbol: attribute
    origin: openinference
    kinds: all
    category: identity
    level: vendor
    type: string
    fill: [native]
    rationale: |
      The session grouping key. OpenInference's spelling, and the one the sink
      reads first; gen_ai.conversation.id is deliberately not emitted alongside
      it, one name for one fact.

  - const: USER_ID
    key: user.id
    upstream: core
    symbol: attribute
    origin: openinference
    kinds: all
    category: identity
    level: vendor
    type: string
    fill: [native]
    rationale: |
      The end-user identity. OpenInference's spelling, also what Langfuse reads
      and what the OTel registry lists; the sink additionally accepts OTel's
      enduser.id / enduser.pseudo.id from third-party instrumentors, but the SDKs
      emit one name for one fact.

  - const: WORKSPACE_ROUTE
    key: rius.workspace
    brief: "Alias of the workspace a span is exported to when one process sends to several; stripped before the span leaves the process."
    stability: development
    examples: ["acme", "customer-eu"]
    symbol: attribute
    origin: rius
    kinds: all
    category: process_local
    level: vendor
    type: string
    fill: [native]
    rationale: |
      Process-local routing marker for multi-workspace export. Stamped at span
      start so pending snapshots route too, and ALWAYS stripped by the routing
      exporter before spans leave the process: the destination's API key is what
      tells the backend which workspace a span belongs to.

  # --- Span attributes: OTel GenAI -----------------------------------------

  - const: GEN_AI_OPERATION_NAME
    section: "OTel GenAI (subset we emit)"
    key: gen_ai.operation.name
    symbol: attribute
    origin: otel
    kinds: {all_but: [CHAIN]}
    category: identity
    level: required
    type: string
    fill: [native, openinference, vercel]

  - const: GEN_AI_PROVIDER_NAME
    key: gen_ai.provider.name
    symbol: attribute
    origin: otel
    kinds: [LLM, EMBEDDING]
    category: identity
    level: conditionally_required
    level_note: when known
    type: string
    fill: [native, openinference, vercel]

  - const: GEN_AI_REQUEST_MODEL
    key: gen_ai.request.model
    symbol: attribute
    origin: otel
    kinds: [LLM, EMBEDDING]
    category: identity
    level: conditionally_required
    level_note: when known
    type: string
    fill: [native, openinference, vercel]

  - const: GEN_AI_REQUEST_REASONING_LEVEL
    key: gen_ai.request.reasoning.level
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: identity
    level: recommended
    type: string
    fill: [native]

  - const: GEN_AI_RESPONSE_MODEL
    key: gen_ai.response.model
    symbol: attribute
    origin: otel
    kinds: [LLM, EMBEDDING]
    category: metadata
    level: recommended
    type: string
    fill: [native, openinference, vercel]

  - const: GEN_AI_RESPONSE_ID
    key: gen_ai.response.id
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: metadata
    level: recommended
    type: string
    fill: [native]
    rationale: |
      The provider's own identifier for the completion ("chatcmpl-123"),
      Recommended on an inference span. Metadata: it exists only once the provider
      has answered, so it is a post-call setter and never reaches a pending
      snapshot. Not content — an opaque id says nothing about what was said — so
      it survives capture_content=False.

  - const: GEN_AI_OUTPUT_TYPE
    key: gen_ai.output.type
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: identity
    level: conditionally_required
    level_note: when the request specifies an output format
    type: string
    fill: [native]
    rationale: |
      The output modality the client ASKED for (text / json / image / speech in
      the registry today), Conditionally Required when the request specifies one.
      Identity: it describes the request, so it is known at span creation and must
      ride pending snapshots. Note the key is NOT under gen_ai.request., so
      PENDING_IDENTITY_PREFIXES does not cover it and it needs its own allowlist
      entry. Recorded verbatim rather than validated against the enum: the
      conventions are free to extend it, and a value we do not recognise is still
      the caller's truth. Not content, for the reason the response id is not.

  - const: GEN_AI_REQUEST_STREAM
    key: gen_ai.request.stream
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: identity
    level: conditionally_required
    level_note: when streaming
    type: boolean
    fill: [native, openinference]
    rationale: |
      Streaming, per the GenAI inference-span conventions: gen_ai.request.stream
      (boolean, Conditionally Required when streaming) and
      gen_ai.response.time_to_first_chunk (double, seconds, "measured from request
      issuance", Recommended for streaming requests). Both are set by
      record_first_token: a first chunk arriving is what proves the request
      streamed, and the SDK has no earlier hook for it.

  - const: GEN_AI_RESPONSE_TIME_TO_FIRST_CHUNK
    key: gen_ai.response.time_to_first_chunk
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: metadata
    level: recommended
    level_note: when streaming
    type: double
    fill: [native, openinference]

  - const: GEN_AI_REQUEST_TEMPERATURE
    key: gen_ai.request.temperature
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: identity
    level: recommended
    type: double
    fill: [native, openinference]
    rationale: |
      Sampling parameters. Produced from a generation's model parameters through
      GEN_AI_REQUEST_PARAMETERS, and by normalization, which promotes them out of
      a third-party instrumentor's request bag (llm.invocation_parameters). Names
      and types are the GenAI registry's.

  - const: GEN_AI_REQUEST_TOP_P
    key: gen_ai.request.top_p
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: identity
    level: recommended
    type: double
    fill: [native, openinference]

  - const: GEN_AI_REQUEST_TOP_K
    key: gen_ai.request.top_k
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: identity
    level: recommended
    type: int
    fill: [native, openinference]

  - const: GEN_AI_REQUEST_MAX_TOKENS
    key: gen_ai.request.max_tokens
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: identity
    level: recommended
    type: int
    fill: [native, openinference]

  - const: GEN_AI_REQUEST_FREQUENCY_PENALTY
    key: gen_ai.request.frequency_penalty
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: identity
    level: recommended
    type: double
    fill: [native, openinference]

  - const: GEN_AI_REQUEST_PRESENCE_PENALTY
    key: gen_ai.request.presence_penalty
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: identity
    level: recommended
    type: double
    fill: [native, openinference]

  - const: GEN_AI_REQUEST_SEED
    key: gen_ai.request.seed
    symbol: attribute
    origin: otel
    kinds: [LLM]
    category: identity
    level: conditionally_required
    level_note: when the request includes a seed
    type: int
