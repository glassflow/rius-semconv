# Per-language file preambles and output locations. Not registry data, but
# every generated file needs them.

# `notice` opens every file; Go uses its own standard "Code generated" line
# instead, which Go tooling recognises.
notice: Generated by rius-semconv from its registry/ directory. DO NOT EDIT.
header: |
  Regenerate with `python -m generators.generate` in rius-semconv and copy
  the result; see that repository's README for how consumers pin a version.

python:
  # Vendored next to semconv.py, which re-exports it and keeps the helpers.
  filename: _semconv_generated.py
  docstring: |
    Rius semantic conventions: the constants and tables, generated.

    The hand-written ``semconv.py`` re-exports everything here and adds the
    helper functions that use it.

typescript:
  # Vendored next to semconv.ts, which re-exports it and keeps the helpers.
  filename: semconv.generated.ts

go:
  filename: semconv_generated.go
  package: semconv
