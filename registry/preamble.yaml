go:
  package: semconv
  docstring: |
    Package semconv carries the canonical Rius attribute keys and span-kind
    taxonomy. It is the Go face of the rius-semconv registry; the SDKs carry
    the same keys in semconv.py and semconv.ts, generated from the same rows.
