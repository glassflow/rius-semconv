# Media parts: what every producer's image, audio and file content becomes
# after normalization, and which recordings prove it.
#
# After normalization a media part is exactly one of these (see the part
# shapes below), and inline bytes never survive: a blob is always stripped.
#
#   blob  {"type":"blob","modality","mime_type"?,"byte_size"?,"stripped_reason"}
#         Inline bytes, with no `content`. byte_size is the decoded length,
#         omitted when the bytes never reached us.
#   uri   {"type":"uri","modality","mime_type"?,"uri"}
#         Referenced by URL. A data: URL is never a uri: it becomes a blob.
#   file  {"type":"file","modality","mime_type"?,"file_id"}
#         A provider file id.
#
# The modality comes from the MIME type when it is known: image/* is image,
# audio/* audio, video/* video, anything else (PDF, text/*, office formats)
# document. With no MIME type it comes from the provider's part kind. It is
# never guessed as image for a non-image MIME type.
#
# A part whose type no normalizer recognizes passes through unchanged as a
# generic part. It is never wrapped in a text part.
#
# One row per source shape. tests/test_media_parts.py and the registry linter
# check the file's rules; tools/check_fixtures.py checks that every fixtures
# id names a recorded scenario. The generated table is
# out/docs/media-parts.md.
#
# Fields
#
#   modalities        The modality vocabulary (the upstream enum).
#   stripped_reasons  The `stripped_reason` vocabulary on a blob, with what
#                     each means. A Rius vocabulary on a free-form upstream
#                     field: exactly not_captured and redacted_upstream.
#   raw_payloads      Where parts come from (message keys only), and how a
#                     raw request or response payload is stripped of media in
#                     place. Its detection rules are the ones
#                     tools/check_fixtures.py applies to expected results.
#   source     producer.api: who writes the shape, and through which API.
#   shape      The source shape, as the producer writes it.
#   direction  input | output. Whether the shape is in a request message or
#              in a response message.
#   normalized What the part becomes: blob, uri, file, text (it is text to
#              the model, so it becomes text parts) or generic. A list when
#              the shape normalizes to more than one of these, depending on
#              its value. none (on its own) when no part is made: the media
#              is only in a raw payload, or the instrumentor dropped it, and
#              any raw payload holding it is stripped per raw_payloads.
#   modality   image, video, audio or document, or from_mime: the modality
#              rule above. Not needed when normalized is text or none.
#   paths      Which paths deliver the shape today: passthrough (the SDK
#              helpers, set_input / setInput with raw provider dicts),
#              openinference (flattened message contents), openllmetry,
#              laminar (provider blocks), vercel (ai.prompt.messages),
#              native (semconv parts). openinference is named only where an
#              OpenInference fixture proves the row.
#   fixtures   Scenario ids, <family>/<scenario>: a directory under
#              fixtures/ and a key of recordings.<file>.scenarios in that
#              family's manifest.json. Each must exist.
#   reason     Why no fixture proves the row yet. Required when fixtures is
#              empty.
#   raw_payload  On a none row that describes a raw payload: the attribute
#              key (or a list of keys) holding it, each one of
#              raw_payloads.raw_keys. The payload is stripped per
#              raw_payloads and makes no part, so its fixtures may also be
#              cited by a row for the part the same scenario's message keys
#              make. Not used on a none row whose message source makes
#              nothing (the instrumentor dropped the media).
#   note       Optional detail on how the shape normalizes.

modalities: [image, video, audio, document]

stripped_reasons:
  not_captured: Our default policy removed the inline bytes.
  redacted_upstream: The instrumentor dropped or replaced the payload before we saw it (OpenInference __REDACTED__, a data URL with no bytes, an image with no url).

raw_payloads:
  source_rule: >-
    Normalized message parts come only from message keys: gen_ai.input.messages,
    gen_ai.output.messages and gen_ai.system_instructions, or the flattened
    instrumentor message keys each normalizer already maps (OpenInference
    llm.input_messages.* and llm.output_messages.*, OpenLLMetry gen_ai.prompt.*
    and gen_ai.completion.*, Vercel ai.prompt.messages). Raw request and response
    payloads are never mined to rebuild parts.
  # Exact keys, or prefixes ending in a dot.
  message_keys:
    - gen_ai.input.messages
    - gen_ai.output.messages
    - gen_ai.system_instructions
    - llm.input_messages.
    - llm.output_messages.
    - gen_ai.prompt.
    - gen_ai.completion.
    - ai.prompt.messages
  # Span attributes, and the sink's stored columns, that hold a raw payload.
  raw_keys:
    - input.value
    - output.value
    - lmnr.span.input
    - lmnr.span.output
    - ai.prompt
    - pydantic_ai.all_messages
    - InputValue
    - OutputValue
  strip_rule: >-
    In every string attribute value on every span and span event, and in the
    sink's stored columns, each media token (found by the detection rules below)
    is replaced in place. Every other byte of the string stays identical:
    normalizers must not parse and re-serialize the JSON. Byte equality across
    the Python SDK, the TypeScript SDK and the Go sink depends on this. Message
    parts in gen_ai.*.messages keep the stripped blob part shape instead; the
    replacement string is only for raw payloads.
  replacement:
    # Written as a JSON string token, quotes included.
    format: '[stripped <mime> <byte_size> bytes]'
    unknown: unknown
    # The mime type, by token: a data URL's own media type (unknown when
    # empty); for a keyed base64 string, the sibling media_type, mediaType
    # or mime_type, else audio/<format> from a format sibling; for a Buffer,
    # the enclosing object's media_type, mediaType or mime_type. Anything
    # else is unknown.
    examples:
      - '[stripped image/png 67 bytes]'
      - '[stripped unknown unknown bytes]'
    # A data URL inside prose: only the token is replaced.
    in_text:
      before: 'see data:image/png;base64,iVBORw0KGgo= here'
      after: 'see [stripped image/png 8 bytes] here'
    tokens:
      - token: A data URL (rule b), anywhere in a string
        replaced: 'The data URL token alone: from data: to the end of the base64 run, in place, inside the string. The text around it stays byte-identical; a string that is only the data URL becomes the replacement string.'
        mime: The URL's media type; unknown when it names none.
        byte_size: The decoded length of the base64 run, floor(3 * characters without padding / 4).
      - token: A base64 string value (rule e)
        replaced: The string token.
        mime: The sibling media_type, mediaType or mime_type; else audio/<format> from a format sibling; else unknown.
        byte_size: The decoded length of the base64 data.
      - token: A Buffer object (rule d)
        replaced: The whole object token, by the string.
        mime: The enclosing object's media_type, mediaType or mime_type; else unknown.
        byte_size: The length of the data array.
  detection:
    - id: b
      name: data URL
      description: 'A data:<mime>;base64,<base64> token anywhere in a string: the pattern finds each one, group 1 the mime type (empty when none), group 2 the base64 run. A whole-string data URL is the special case.'
      pattern: 'data:([^;,\s"]*);base64,([A-Za-z0-9+/]*={0,2})'
    - id: d
      name: Buffer object
      description: 'An object {"type": "Buffer", "data": [...]} whose data is a non-empty array.'
      type: Buffer
      array_key: data
    - id: e
      name: keyed base64 string
      description: A non-empty string under one of the keys, when its object has one of the sibling keys, or its object's parent key is one of the parent keys, or its object is a source with type base64.
      keys: [data, b64_json, result]
      sibling_keys: [media_type, mediaType, mime_type, format]
      parent_keys: [input_audio, audio, inline_data]
      source_key: source
      source_type: base64

rows:
  - source: openai.chat
    shape: image_url.url = data:<mime>;base64,...
    direction: input
    normalized: blob
    modality: image
    paths: [passthrough, openinference, laminar]
    fixtures: [openinference-openai/image_data_url, openinference-js-openai/image_data_url]
    note: The mime type comes from the data URL. OpenInference (Python and JS) flattens it into the message contents, and its input.value keeps the request JSON.

  - source: openai.chat
    shape: image_url.url = http(s)://...
    direction: input
    normalized: uri
    modality: image
    paths: [passthrough, openinference, openllmetry, laminar]
    fixtures: [openinference-openai/image_https_url, openinference-js-openai/image_https_url, openllmetry/image_https_url]
    note: OpenLLMetry before 0.62 writes the content array as a JSON string in gen_ai.prompt.N.content. From 0.62 it writes a native uri part.

  - source: openai.chat
    shape: input_audio {data, format}
    direction: input
    normalized: blob
    modality: audio
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family writes it in a message key (OpenInference keeps it only in input.value; see the OpenInference raw-payload row); covered by the SDK pass-through unit tests.
    note: The mime type is audio/<format>.

  - source: openai.chat
    shape: file {file_id}
    direction: input
    normalized: file
    modality: document
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.

  - source: openai.chat
    shape: file {file_data, filename}
    direction: input
    normalized: blob
    modality: from_mime
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.
    note: The modality comes from the data URL's mime type, or from the filename extension.

  - source: openai.chat
    shape: message.audio {data, transcript}
    direction: output
    normalized: blob
    modality: audio
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family writes it in a message key (OpenInference keeps it only in output.value; see the OpenInference raw-payload row); covered by the SDK pass-through unit tests.
    note: A text part with the transcript follows the blob.

  - source: openai.responses
    shape: input_image {image_url | file_id}
    direction: input
    normalized: [blob, uri, file]
    modality: image
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.
    note: A data URL becomes a blob, an http(s) URL a uri, a file id a file.

  - source: openai.responses
    shape: input_file {file_id | file_data | file_url}
    direction: input
    normalized: [file, blob, uri]
    modality: from_mime
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.
    note: A file id becomes a file, file data a blob, a file URL a uri.

  - source: openai.responses
    shape: image_generation_call.result (base64)
    direction: output
    normalized: blob
    modality: image
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.

  - source: anthropic.messages
    shape: image / document with source.type = base64
    direction: input
    normalized: blob
    modality: from_mime
    paths: [passthrough, openinference, openllmetry, laminar]
    fixtures: [openinference-anthropic/image_base64, openinference-js-anthropic/image_base64]
    note: The mime type comes from source.media_type. OpenInference Python flattens an image into a data URL in the message contents; OpenInference JS flattens it to image.media_type and image.type with no data at all (a blob with stripped_reason redacted_upstream). A document is dropped from the flattened messages, so it makes no part (see the OpenInference raw-payload row).

  - source: anthropic.messages
    shape: image / document with source.type = url
    direction: input
    normalized: uri
    modality: from_mime
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.

  - source: anthropic.messages
    shape: image / document with source.type = file
    direction: input
    normalized: file
    modality: from_mime
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.

  - source: anthropic.messages
    shape: document with source.type = text | content
    direction: input
    normalized: text
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.
    note: It is text to the model, so it becomes text parts.

  - source: gemini.generate_content
    shape: inline_data {mime_type, data}
    direction: input
    normalized: blob
    modality: from_mime
    paths: [passthrough]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.

  - source: gemini.generate_content
    shape: file_data {mime_type, file_uri}
    direction: input
    normalized: uri
    modality: from_mime
    paths: [passthrough]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.

  - source: openinference.llm
    shape: message_content.type = image, image.image.url = data URL | http(s) | __REDACTED__
    direction: input
    normalized: [blob, uri]
    modality: image
    paths: [openinference]
    fixtures: [openinference-openai/image_data_url, openinference-openai/image_https_url, openinference-openai/image_redacted, openinference-anthropic/image_base64, openinference-js-openai/image_data_url, openinference-js-openai/image_https_url, openinference-js-openai/image_redacted]
    note: A data URL becomes a blob, an http(s) URL a uri, and __REDACTED__ a blob with stripped_reason redacted_upstream. Python and JS; the JS instrumentor redacts above the same 32,000 characters.

  - source: vercel.ai
    shape: image / file parts in ai.prompt.messages
    direction: input
    normalized: [blob, uri]
    modality: from_mime
    paths: [vercel]
    fixtures: [vercel-ai-v5/image_file, vercel-ai-v5/pdf_file, vercel-ai-v5/text_plain_file, vercel-ai-v5/audio_file, vercel-ai-v6/image_file, vercel-ai-v6/pdf_file, vercel-ai-v6/text_plain_file, vercel-ai-v6/audio_file]
    note: The existing blob and uri mapping, with the modality rule. A blob is stripped. TypeScript SDK and sink. The AI SDK writes a file part as a part of type file with mediaType and base64 data in ai.prompt.messages (the model call), whatever the media type. A PDF and a text/plain file are not images.

  - source: semconv.native
    shape: blob part with content
    direction: input
    normalized: blob
    modality: from_mime
    paths: [native]
    fixtures: [pydantic-ai/image_binary]
    note: The same blob, stripped. pydantic-ai writes it in gen_ai.input.messages and pydantic_ai.all_messages. Any OTel GenAI instrumentation.

  - source: semconv.native
    shape: uri part
    direction: input
    normalized: uri
    modality: from_mime
    paths: [native]
    fixtures: [openllmetry/image_https_url]
    note: Unchanged, and modality is filled from the mime type when missing. OpenLLMetry 0.62 writes it in gen_ai.input.messages.

  - source: semconv.native
    shape: file part
    direction: input
    normalized: file
    modality: from_mime
    paths: [native]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.
    note: Unchanged, and modality is filled from the mime type when missing.

  - source: openinference.llm
    shape: image.image.url = data:None;url,None
    direction: input
    normalized: blob
    modality: image
    paths: [openinference]
    fixtures: [openinference-anthropic/image_url]
    note: What OpenInference's Anthropic instrumentor writes for an image with a url source; the URL itself is lost. The data URL names no mime type and holds no bytes, so the blob has neither mime_type nor byte_size, and its stripped_reason is redacted_upstream.

  - source: laminar.openhands
    shape: ImageContent with image_urls in lmnr.span.input
    direction: input
    normalized: none
    raw_payload: lmnr.span.input
    paths: [laminar]
    fixtures: [laminar/image_base64, laminar/image_https_url]
    note: lmnr.span.input is a raw payload, not a message key, so it makes no part. A data URL in it is stripped per raw_payloads; an http(s) URL stays. Written on the conversation.send_message span's input, and the sink keeps it in InputValue. The LLM span drops the image when the model has no vision support.

  - source: vercel.ai
    shape: file part with Buffer data in ai.prompt
    direction: input
    normalized: none
    raw_payload: ai.prompt
    paths: [vercel]
    fixtures: [vercel-ai-v5/image_file, vercel-ai-v5/pdf_file, vercel-ai-v5/text_plain_file, vercel-ai-v5/audio_file, vercel-ai-v6/image_file, vercel-ai-v6/pdf_file, vercel-ai-v6/text_plain_file, vercel-ai-v6/audio_file]
    note: On the operation span (ai.generateText) the prompt is JSON, and a file given as a Buffer is written as an object of type Buffer whose data is a JSON array of byte values, not base64. ai.prompt is a raw payload, so it makes no part; the Buffer object is replaced per raw_payloads, with byte_size the array length. The part comes from ai.prompt.messages on the model-call span (the image / file parts row).

  - source: vercel.ai_otel
    shape: blob part with modality image for a non-image file, in gen_ai.input.messages
    direction: input
    normalized: blob
    modality: from_mime
    paths: [native]
    fixtures: [vercel-ai-otel/image_file, vercel-ai-otel/pdf_file, vercel-ai-otel/text_plain_file, vercel-ai-otel/audio_file]
    note: '@ai-sdk/otel writes every file part as a blob with base64 content and labels application/pdf and text/plain as modality image (audio/wav is labelled audio). The modality is recomputed from the mime type, so these become document blobs.'

  - source: openinference.llm
    shape: message_content.type = image with no image.url (image.media_type and image.type only, or nothing)
    direction: input
    normalized: blob
    modality: image
    paths: [openinference]
    fixtures: [openinference-js-anthropic/image_base64, openinference-js-anthropic/image_url]
    note: What OpenInference's JS Anthropic instrumentor writes for an image. A base64 source leaves image.media_type (the mime type) and image.type = base64 but no data; a url source leaves only message_content.type = image. The blob carries the mime type when given, no byte_size, and stripped_reason redacted_upstream.

  - source: openinference.llm
    shape: media present only in input.value / output.value (audio input, audio output, PDF document)
    direction: input
    normalized: none
    raw_payload: [input.value, output.value]
    paths: [openinference]
    fixtures: [openinference-openai/input_audio, openinference-openai/audio_output, openinference-js-openai/input_audio, openinference-js-openai/audio_output, openinference-anthropic/document_pdf, openinference-js-anthropic/document_pdf]
    note: OpenInference (Python and JS) leaves OpenAI input_audio, an OpenAI message.audio response and an Anthropic base64 document out of the flattened messages, and keeps them only in the request or response JSON of input.value / output.value. No part is made; the raw payload is stripped per raw_payloads.

  - source: openllmetry.openai
    shape: 'image as a data URL: the instrumentor drops the prompt content; nothing to normalize'
    direction: input
    normalized: none
    paths: [openllmetry]
    fixtures: [openllmetry/image_base64]
    note: Before 0.62 the span keeps only gen_ai.prompt.0.role, with no content; 0.62 writes no gen_ai.input.messages at all. Every recorded version.
